 “this property is up 1%, that one’s down 2%” and everyone freaks out or takes a LinkedIn victory lap?\n\nEvery time, I just think: that’s like someone announcing the planetary average temperature today is 38°F (3°C for the Celsius folks) and saying, “Go figure out how to dress this morning.” Maybe it makes for good headlines. But it doesn’t actually tell you if you’ll freeze walking to the train or if you’ll be sweating by lunch.\n\nBecause at the end of the day, you need the weather for your 𝘀𝗽𝗲𝗰𝗶𝗳𝗶𝗰 𝗰𝗶𝘁𝘆, not some planetary average. And for AEO, the only thing that matters is 𝘆𝗼𝘂𝗿 𝗮𝗰𝘁𝘂𝗮𝗹 𝘃𝗲𝗿𝘁𝗶𝗰𝗮𝗹, 𝘆𝗼𝘂𝗿 𝗿𝗲𝗮𝗹 𝗻𝗶𝗰𝗵𝗲, what’s happening for 𝘆𝗼𝘂𝗿 𝘀𝗹𝗶𝗰𝗲 of the industry. You can have 80° on average globally; your market might still be under snow.\n\nLook, I could’ve posted a 2% citation change headline this week, and sometimes you genuinely do want to know if something big shifted because major model updates really can change your channel strategy. But before you bring that number to your CMO, or get worked up about it yourself, ask: Did anything really move in your vertical? Did the local forecast change for your business, or is the story just about the planetary average?\n\nAs marketers, it’s just good to remember that before we alarm, before we report up, we should always check our actual niche, or our real category. It might look like spring globally, but you might still be snowed in.\n\nSo, I’m releasing my own verticalized data today: it has the biggest citation share changers by answer engine, per vertical, for the last month or so (a sample of our DS, so no, this is not representative of “Profound’s whole dataset”) but I want to share it with you as a simple repo. The link is in the comments. Take the file, remix it, dig in, and actually see what matters in your vertical and region.\n\nBecause your local forecast should always beat the global average when you need to decide what to do next 👀 | 12 comments on LinkedIn", "img": null, "ts": "2026-11-19T16:02:18.881000+00:00", "col": "s", "sum": "Profound's Josh Blyskal says a global citation share change of 1% or 2% tells you little. Check what moved in your own vertical before you report a shift to a client.", "themes": ["tracking"], "day": "Thu Nov 19", "time": "1:02 PM", "wk": 1}, {"kind": "x", "url": "https://x.com/Marie_Haynes/status/2123444413519085757", "name": "Marie Haynes", "sub": "Marie_Haynes", "avatar": "https://pbs.twimg.com/profile_images/1957228632415297537/fl2YY2tU_bigger.jpg", "text": "An Update: Neon is my choice now.\n\nBoy it's hard to keep up with Google's new models but I really encourage you to give Gemini 4 Neon a try. It's almost as smart as Carbon and Argon but faster. It feels quite different to me. I threw a hard problem at it last night that AI has", "img": null, "likes": 32, "replies": 6, "ts": "2026-11-19T15:52:54+00:00", "col": "g", "sum": "Marie Haynes now uses Gemini 4 Neon for most work. She says it is almost as smart as Carbon and Argon, but faster.", "themes": ["models"], "day": "Thu Nov 19", "time": "12:52 PM", "wk": 1}, {"kind": "li", "url": "https://www.linkedin.com/posts/markseo_seo-share-7529208231995289601-CzXK/", "name": "Mark Williams-Cook", "sub": "Director, Candour; Founder, AlsoAsked", "avatar": "https://media.licdn.com/dms/image/v2/D4E03AQGPBXY4DDk12g/profile-displayphoto-scale_400_400/B4EZ7c.eYQKcAg-/0/1781823827484?e=2147483647&v=beta&t=wS5kgO6qdrUz8hw-gT49du8qMC98Q5_OzHD9d9VmY0A", "text": "Unsolicited #SEO tip: If you get a manual action for links, remember that when you have this penalty \"removed\" you will not go back to the position you were in previously.   🙂‍↔️ \n\nThe links that you had, which you were receiving credit for will be discounted (if you haven't removed them), as they were deemed manipulative.\n\nWhile the penalty is removed, it still leaves you with a hole to fill in terms of the signals those links were giving you. This is another reason why using manipulative link building is not to be seen as an \"investment\" like a lot of SEO is.\n\nHappy GTA VI day.", "img": "https://media.licdn.com/dms/image/v2/D4E22AQGREGP42LlTZQ/feedshare-shrink_800/B4EaH0e_XYJ4Ag-/0/1795103127321?e=2147483647&v=beta&t=q2q-T9OFRuQe-iat98w5iXHmsiy-hjmTb3Y_SRzhjqA", "ts": "2026-11-19T15:45:28.432000+00:00", "col": "s", "sum": "When Google removes a manual action for links, rankings do not come back. Google still discounts the manipulative links, so you must replace the signals they gave.", "themes": ["core"], "day": "Thu Nov 19", "time": "12:45 PM", "wk": 1}, {"kind": "li", "url": "https://www.linkedin.com/posts/darrenshawwhitespark_what-happens-when-you-block-googles-ai-features-share-7529208003980443648-qsR9/", "name": "Darren Shaw", "sub": "Founder, Whitespark", "avatar": "https://media.licdn.com/dms/image/v2/D5603AQGPRN78FYknrA/profile-displayphoto-shrink_400_400/profile-displayphoto-shrink_400_400/0/1685132735631?e=2147483647&v=beta&t=UqYA3gtwvph8Yb0r_rahU1g5IkXAz_R8M-wzWwu2sag", "text": "What happens when you block Google’s AI features from using your website content?\nCyrus Shepard tested what happens when you opt your website out of  Google's AI Overviews and AI Mode features, and here’s what he found:\n\n1. AI impressions immediately dropped to zero\n2. AI impressions were estimated to have a 0.9% click-through rate\n\nOk, so this is expected, but Cyrus also found that regular organic clicks dropped too when AI features were disabled (what?!)\n\nHe calls this the \"SERP Halo Effect”.\n\nThe idea is that the more places your brand appears on the search results page, the more likely someone is to click through to your website.\n\nWhen people see your business mentioned in multiple places on the search results page, it builds trust. \n\nAnd that could make them more likely to click on your website, even if it's through a regular organic result rather than an AI citation.\n\nSo anyway, you probably don’t want to opt out of Google’s AI features.", "img": "https://media.licdn.com/dms/image/v2/D5622AQErHnOw0WMvCA/feedshare-shrink_1280/B56aH0exQSHgBc-/0/1795103069608?e=2147483647&v=beta&t=V7bAHVlFO8H2w7gLF_IEXkYfAcTbqVA4qpAyGKWcl2I", "ts": "2026-11-19T15:44:34.069000+00:00", "col": "g", "sum": "Cyrus Shepard opted a site out of AIOs and AI Mode. AI impressions dropped to zero, and regular organic clicks dropped too. Darren Shaw's advice: do not opt out of Google's AI features.", "themes": ["aimode"], "day": "Thu Nov 19", "time": "12:44 PM", "wk": 1}, {"kind": "blog", "url": "https://www.seroundtable.com/microsoft-ads-in-ai-overviews-on-bing-42578.html", "name": "Search Engine Roundtable", "sub": "seroundtable.com", "title": "Microsoft Confirms Ads Are In AI Overviews On Bing Search", "logo": "https://www.google.com/s2/favicons?domain=seroundtable.com&sz=128", "ts": "2026-11-19T10:24:00-05:00", "col": "b", "sum": "Microsoft confirmed that Bing now shows ads in AI Overviews in all markets except China. The ads run through existing campaigns, including Performance Max and AI Max, with no separate setup.", "themes": ["ads"], "day": "Thu Nov 19", "time": "12:24 PM", "wk": 1}, {"kind": "blog", "url": "https://www.searchenginejournal.com/your-wordpress-sitemap-isnt-broken-chrome-158-has-dropped-xslt/597549/", "name": "Search Engine Journal", "sub": "searchenginejournal.com", "title": "Your WordPress Sitemap Isn't Broken: Chrome 158 Has Dropped XSLT", "logo": "https://www.google.com/s2/favicons?domain=searchenginejournal.com&sz=128", "ts": "2026-11-19T15:00:06+00:00", "col": "b", "sum": "Chrome 158 dropped XSLT, so WordPress sitemaps now show as raw XML in the browser. Crawlers do not use XSLT, so nothing is broken. Check the sitemap in Search Console before you change anything.", "themes": [], "day": "Thu Nov 19", "time": "12:00 PM", "wk": 1}, {"kind": "li", "url": "https://www.linkedin.com/posts/chris-long-marketing_aeo-tip-more-companies-are-serving-their-share-7529194593234362368-8243/", "name": "Chris Long", "sub": "Co-founder, Nectiv", "avatar": "https://media.licdn.com/dms/image/v2/D4E03AQEf7iyuuMOsyQ/profile-displayphoto-shrink_400_400/profile-displayphoto-shrink_400_400/0/1696859606064?e=2147483647&v=beta&t=aXra4UyUJSs6shwTwE7K4nEnsm7T2lck5omg5hAy4FE", "text": "AEO Tip: More companies are serving their content via markdown to LLMs. 22% of technology sites we tested served markdown. Here's how to analyze your competitors: \n\nSo we've definitely been seeing a trend that more sites are serving markdown when requested. Basically, when an agent/request comes to your site, your site can serve different versions based on the request headers. A request for text/html would return the full HTML. A request for text/markdown obviously returns a markdown version of this. \n\nWell believe it or not, companies are implementing it. We performed a sample of 300 different sites in the technology space - 22% of them have it implemented (home page check only). \n\nWhat's even more interesting is this skews heavily towards the more tech-inclined companies. For Dev Tools, it was actually the majority of companies (54%). Similarly, data tools had 34% of the sites leveraging it. \n\nYou can check your competitors by using Claude/Code Code. Simply tell it the competitors / sites you want to analyze and it will pull the results and group them via headless requests. Simple, fast and you can better understand what others are doing. \n\nI know there's a lot of debate around this. For this implementation, you're only doing it for specific requests for the markdown - so basically giving agents the option. As long as your serving the exact same content, I don't see any problem with it. | 13 comments on LinkedIn", "img": "https://media.licdn.com/dms/image/v2/D4E22AQECpL5WElCnPg/feedshare-image-high-res/B4EaH0Sld0GkAQ-/0/1795099875825?e=2147483647&v=beta&t=aipAZVVtmW4Nt2MjQISf1yURZNoIWViRoZFcOViYhaw", "ts": "2026-11-19T14:51:16.698000+00:00", "col": "s", "sum": "Nectiv tested 300 tech sites: 22% serve a markdown version of the home page when an agent asks for it. The share is 54% for dev tools and 34% for data tools. He shows how to check competitors.", "themes": ["agents"], "day": "Thu Nov 19", "time": "11:51 AM", "wk": 1}, {"kind": "blog", "url": "https://www.searchenginejournal.com/wordpress-7-1-5-security-release-fixes-18-vulnerabilities/598080/", "name": "Search Engine Journal", "sub": "searchenginejournal.com", "title": "WordPress 7.1.5 Security Release Fixes 18 Vulnerabilities", "logo": "https://www.google.com/s2/favicons?domain=searchenginejournal.com&sz=128", "ts": "2026-11-19T14:40:05+00:00", "col": "b", "sum": "WordPress 7.1.5 fixes 18 vulnerabilities. One is an unauthenticated flaw that can lead to remote code execution and a site takeover, so update client sites now.", "themes": ["security"], "day": "Thu Nov 19", "time": "11:40 AM", "wk": 1}, {"kind": "x", "url": "https://x.com/glenngabe/status/2123404943394484343", "name": "Glenn Gabe", "sub": "glenngabe", "avatar": "https://pbs.twimg.com/profile_images/1939273879274287104/XDnMSJi5_bigger.jpg", "text": "Looks like AIOs are triggering heavily for \"coupon code\" queries now. Will be interesting to see how sites focused on coupon codes perform this holiday season. Note, you *typically* still need to click through to get the code, so CTR should be ok for the sites in the AIO. But for", "img": "https://pbs.twimg.com/media/HXfZYn1WAAAWZ_s.jpg", "likes": 14, "replies": 19, "ts": "2026-11-19T13:16:04+00:00", "col": "g", "sum": "AIOs now show for many 'coupon code' searches. Users usually still click through to get the code.", "themes": ["ads"], "day": "Thu Nov 19", "time": "10:16 AM", "wk": 1}, {"kind": "x", "url": "https://x.com/timsoulo/status/2123404676163076241", "name": "Tim Soulo 🇺🇦", "sub": "timsoulo", "avatar": "https://pbs.twimg.com/profile_images/1757758819134836736/LJevsZAx_bigger.jpg", "text": "Adobe acquired @Semrush for $1.9 billion. One of the biggest MarTech deals in history.\n\nWe (@Ahrefs) are their main competitor - bootstrapped, profitable, small team, zero acquisition baggage.\n\nAnd yet Adobe never called us. 🥲\n\nNot that we were ever looking for an exit, but", "img": null, "likes": 759, "replies": 65, "ts": "2026-11-19T13:15:00+00:00", "col": "s", "sum": "Adobe bought Semrush for $1.9 billion. Tim Soulo says Ahrefs, its main rival, stays independent.", "themes": [], "day": "Thu Nov 19", "time": "10:15 AM", "wk": 1}, {"kind": "li", "url": "https://www.linkedin.com/posts/neilkpatel_your-next-customer-could-find-your-business-ugcPost-7529168456890347520-88LT/", "name": "Neil Patel", "sub": "Co-Founder, Neil Patel Digital", "avatar": "https://media.licdn.com/dms/image/v2/C5103AQFihp1Vzz6oCQ/profile-displayphoto-shrink_400_400/profile-displayphoto-shrink_400_400/0/1516255378406?e=2147483647&v=beta&t=UTj0Kvde2cLI0xl9MLqYgSTChhYtp3fSKUM2jN-gCSc", "text": "Your next customer could find your business through a Google search they never typed. And Google can now use your website to write your ads.\n\nIn this video, I break down six rules for getting customers from Google today. They cover how AI Mode runs extra searches behind the scenes, how AI Max can turn your old pages into ad copy, and how to teach Google which leads actually turn into money.\n\nThese rules come from Google’s own documentation and from what’s working for our clients at NP Digital, where we manage over $1 billion in marketing spend. If your reports still stop at traffic, this is where to start. | 29 comments on LinkedIn", "img": null, "ts": "2026-11-19T13:07:25.308000+00:00", "col": "g", "sum": "Neil Patel lists six rules for getting customers from Google, based on Google's own docs. AI Mode runs extra searches behind the scenes, and AI Max can turn your old pages into ad copy.", "themes": ["aimode"], "day": "Thu Nov 19", "time": "10:07 AM", "wk": 1}, {"kind": "blog", "url": "https://www.searchenginejournal.com/wordpress-7-2-seo-ai-changes/597616/", "name": "Search Engine Journal", "sub": "searchenginejournal.com", "title": "WordPress 7.2 Arrives Dec. 8: Last-Minute Changes Still Being Made", "logo": "https://www.google.com/s2/favicons?domain=searchenginejournal.com&sz=128", "ts": "2026-11-19T13:00:50+00:00", "col": "b", "sum": "WordPress 7.2 ships Dec. 8 with a new /random/ URL that redirects to a random post. It is on by default with no settings toggle, so decide before the update if client sites need code to turn it off.", "themes": [], "day": "Thu Nov 19", "time": "10:00 AM", "wk": 1}, {"kind": "blog", "url": "https://www.seroundtable.com/google-hotel-continue-on-google-42568.html", "name": "Search Engine Roundtable", "sub": "seroundtable.com", "title": "Google Hotel Search Listings With Continue On Google To Book", "logo": "https://www.google.com/s2/favicons?domain=seroundtable.com&sz=128", "ts": "2026-11-19T07:41:00-05:00", "col": "b", "sum": "Google hotel listings now show a \"Continue on Google\" button that books the room through AI Mode with the user's Google account. More hotel bookings stay on Google and do not reach the hotel's own site.", "themes": ["aimode"], "day": "Thu Nov 19", "time": "9:41 AM", "wk": 1}, {"kind": "blog", "url": "https://www.seroundtable.com/google-search-show-original-results-button-42574.html", "name": "Search Engine Roundtable", "sub": "seroundtable.com", "title": "Google Search Tests \"Show Original Results\" Button", "logo": "https://www.google.com/s2/favicons?domain=seroundtable.com&sz=128", "ts": "2026-11-19T07:31:00-05:00", "col": "b", "sum": "Google Search is testing a \"Show original results\" button. It shows results for the exact query when Google rewrites or corrects what the user typed.", "themes": ["hydrogen"], "day": "Thu Nov 19", "time": "9:31 AM", "wk": 1}, {"kind": "blog", "url": "https://www.seroundtable.com/google-images-lens-to-ai-mode-42570.html", "name": "Search Engine Roundtable", "sub": "seroundtable.com", "title": "Google Images Results With Lens To AI Mode Feature", "logo": "https://www.google.com/s2/favicons?domain=seroundtable.com&sz=128", "ts": "2026-11-19T07:11:00-05:00", "col": "b", "sum": "Google Images now has a Lens button that opens an AIO or AI Mode follow-up about the image. Image results become one more entry point into AI Mode.", "themes": ["aimode"], "day": "Thu Nov 19", "time": "9:11 AM", "wk": 1}, {"kind": "li", "url": "https://www.linkedin.com/posts/for-everyone-using-wordpress-introducing-share-7529150772257804288-KKhe/", "name": "Google Search Central", "sub": "Google", "avatar": null, "text": "For everyone using WordPress, introducing a new SiteKit feature to help you grow your audience: quickly launch a newsletter sign-up CTA from your WordPress dashboard to collect newsletter signups and connect directly with your site's visitors. \n\nSite Kit is Google’s official plugin for WordPress, connecting critical Google tools like Search Console, AdSense, and Analytics, directly to your WordPress dashboard. \n\nHere’s what makes it easy: \n• Quickly launch a sign-up form as Site Kit handles the verification steps \n• Customize the form: write your own message, preview it live, and choose which pages show the sign-up before publishing \n• No coding or editing your theme needed, so you don’t have to worry about breaking your site layout to collect emails\n\nNewsletter signup CTAs are available for all WordPress sites using Site Kit with Google Analytics. To try it out, install Site Kit: https://lnkd.in/fxR27A4 | 28 comments on LinkedIn", "img": "https://media.licdn.com/dms/image/v2/D4E22AQFR9opx3QZtJg/feedshare-shrink_800/B4EaHzqu6tIkAg-/0/1795089428448?e=2147483647&v=beta&t=-KA6RuEY3X4vLPmz-vxdIVV_6VdfWw_2fklxfCNV4xo", "ts": "2026-11-19T11:57:08.963000+00:00", "col": "g", "sum": "Site Kit, Google's WordPress plugin, can now add a newsletter sign-up form from the WordPress dashboard. It needs no code and works on all sites that use Site Kit with Google Analytics.", "themes": [], "day": "Thu Nov 19", "time": "8:57 AM", "wk": 1}, {"kind": "li", "url": "https://www.linkedin.com/posts/jimmypark_fascinating-people-are-starting-to-treat-share-7529132837653020672-XCDE/", "name": "Jimmy Park", "sub": "AEO/SEO, Opascope", "avatar": "https://media.licdn.com/dms/image/v2/C4E03AQEDHCy9teWomg/profile-displayphoto-shrink_400_400/profile-displayphoto-shrink_400_400/0/1517674699181?e=2147483647&v=beta&t=f7eRvgoa94oPEICrMw2R8r_HtMcWKJhoaC__Pgicd9o", "text": "FASCINATING. People are starting to treat Google Search like ChatGPT. \n\nInteresting data:\n\nDataForSEO tracked the queries reaching 2,000+ websites from September 2025 to August 2026.\n\n- 15+ word queries: 0.37% to 0.82% of queries on desktop, 0.04% to 0.17% on mobile.\n- 5+ word queries: 29.3% to 34.8% of desktop queries.\n- 3-word queries lost the most share, down 3.18 percentage points on desktop.\n\nShort queries still dominate. 3- and 4-word queries are still about 47% of desktop queries combined.\n\nBut we are seeing a gradual shift in longer queries.\n\nPeople used to type the fewest words possible and let Google guess from two to three keywords. Now, they're picking up new habits from LLM usage and explaining their situation into Google so they get a specific answer.\n\nYou can run this research yourself in Claude & Google Search Console:\n1. Open Search Console → Performance → Search results. Click Date → Compare → Compare last 3 months year over year.\n\n2. Add a filter. Query → Custom (regex) → Matches regex. Paste one pattern, export the CSV, then swap in the next pattern. Each export caps at 1,000 rows, so splitting by length gets you far more of your queries than one export.\n→ ^\\S+(\\s+\\S+)?$ for 1-2 words\n→ ^(\\S+\\s+){2}\\S+$ for 3 words\n→ ^(\\S+\\s+){3}\\S+$ for 4 words\n→ ^(\\S+\\s+){4,8}\\S+$ for 5-9 words\n→ ^(\\S+\\s+){9,}\\S+$ for 10+ words\n\n3. Name each file by its length (3-words.csv). If a file hits 1,000 rows, export that length again split by device and name each file by length and device (3-words-mobile.csv).\n\n4. Upload all the CSVs to Claude and paste this prompt:\n\n\"These are Google Search Console exports, one per query length. The file name gives the length, and the device if I split it. Each file compares the last 3 months with the same 3 months last year. Remove any query that contains my brand name ([your brand]) from every file. Use code for all the counting.\n\nThen:\n→ Add the device files together for the same length.\n→ For each length group, show the number of queries and total impressions in both periods.\n→ Show each length group's share of total impressions in both periods, and the change in percentage points.\n→ Give me the average words per query, weighted by impressions, for each period.\n→ Flag any file with exactly 1,000 rows as cut off and tell me how that affects the result.\n→ Answer in one line. Is my query length going up, down, or flat?\n→ Use only the numbers in the files.\"\n\nHappy to discuss results!", "img": "https://media.licdn.com/dms/image/v2/D4E22AQGXRY1A9ubj2A/feedshare-shrink_800/B4EaHzaa9LHEAg-/0/1795085152505?e=2147483647&v=beta&t=rvrbB0CJV5HuXE_Ub3hwNDMzg_qoTTmzzmT9CVu_pTg", "ts": "2026-11-19T10:45:53.020000+00:00", "col": "g", "sum": "DataForSEO data from 2,000+ sites shows longer Google queries. Queries of 5+ words grew from 29.3% to 34.8% of desktop queries in a year, as people search Google the way they prompt ChatGPT.", "themes": ["aimode"], "day": "Thu Nov 19", "time": "7:45 AM", "wk": 1}, {"kind": "x", "url": "https://x.com/rustybrick/status/2123365651540480080", "name": "Barry Schwartz", "sub": "rustybrick", "avatar": "https://pbs.twimg.com/profile_images/1433030583144390668/FKJ9JkUA_bigger.jpg", "text": "\"Over the last six months, Mr. Evans, who is based in North Carolina, has moved ad dollars away from Google search ads. For one company that sells trophies, he said, he is allocating $500 a month to the search ads, down from $2,000 a month about a year ago, when Google introduced", "img": null, "likes": 132, "replies": 20, "ts": "2026-11-19T10:39:56+00:00", "col": "g", "sum": "Some advertisers move budget out of Google search ads. One cut a trophy company's Google spend from $2,000 to $500 a month.", "themes": ["ads"], "day": "Thu Nov 19", "time": "7:39 AM", "wk": 1}, {"kind": "x", "url": "https://x.com/Kevin_Indig/status/2123356279775096925", "name": "Kevin_Indig", "sub": "Kevin_Indig", "avatar": "https://pbs.twimg.com/profile_images/2028121904565960705/y0y5hAES_bigger.jpg", "text": "I think we severely underestimate how much of a problem bot / automated traffic is.\n\nI'm seeing bot traffic appear across Google Search Console and GA4 across many clients.\n\nIt severely distorts our ability to track real improvements.\n\nYou can filter out most in GA4, but GSC...?", "img": null, "likes": 72, "replies": 48, "ts": "2026-11-19T10:02:41+00:00", "col": "s", "sum": "Kevin Indig sees bot traffic in GSC and GA4 for many clients. It hides real progress, and GSC has no filter for it.", "themes": ["traffic", "gsc"], "day": "Thu Nov 19", "time": "7:02 AM", "wk": 1}, {"kind": "x", "url": "https://x.com/lilyraynyc/status/2123264508156334107", "name": "Lily Ray 😏", "sub": "lilyraynyc", "avatar": "https://pbs.twimg.com/profile_images/1935460090821189632/UvkORAsU_bigger.jpg", "text": "Starting to see a lot more of these social/article quotes embedded in AI Overviews", "img": "https://pbs.twimg.com/media/HXdZwRkWYAAIR3X.jpg", "likes": 33, "replies": 23, "ts": "2026-11-19T03:58:01+00:00", "col": "g", "sum": "Lily Ray sees more quotes from social posts and articles inside AIOs.", "themes": ["hydrogen"], "day": "Thu Nov 19", "time": "12:58 AM", "wk": 1}, {"kind": "x", "url": "https://x.com/gaganghotra_/status/2123250936756003170", "name": "Gagan Ghotra", "sub": "gaganghotra_", "avatar": "https://pbs.twimg.com/profile_images/2023426880469368832/9OJcRM0x_bigger.jpg", "text": "Gemini (web) now shows thinking steps and what web sources was used at each thinking + reasoning step. \n\nUseful for #SEO analysis  👀", "img": "https://pbs.twimg.com/media/HXdNTZ3aAAECdoS.jpg", "likes": 30, "replies": 8, "ts": "2026-11-19T03:04:06+00:00", "col": "g", "sum": "Gemini on the web now shows its thinking steps and the web sources it used at each step. Use it to see why a page gets cited.", "themes": ["tracking"], "day": "Thu Nov 19", "time": "12:04 AM", "wk": 1}, {"kind": "li", "url": "https://www.linkedin.com/posts/daniel-foley-assertive_ive-had-more-client-enquiries-to-fix-manual-share-7529013055096127488-T4sO/", "name": "Daniel Foley Carter", "sub": "SEO Specialist", "avatar": "https://media.licdn.com/dms/image/v2/D4E03AQHL2hzT1ZhL2Q/profile-displayphoto-scale_400_400/B4EaHxp6.8IkAg-/0/1795055662302?e=2147483647&v=beta&t=Aux7-zMiX3Rr8J1qrqfa5vwUFNTRnLiAHpx-Ht2lIxw", "text": "I've had MORE client enquiries to fix manual actions in the last month than in the last few years.\n\nI'm seeing SO many different manual actions - MAJOR spam is coming up more and more, even for businesses who HAVEN'T used AI.\n\nGoogle is going to town on pages based on their intention - LOCATION PAGES are hot potatos right now - because if you create hundreds of them, it's not natural and whether you used AI or not, Google is coming for them.\n\nYou know - the LOCATION NEAR ME pages that so many people doing local SEO opted for?\n\nGoogle isn't just suppressing them, it's actively punishing businesses who are trying to target lots of locations with micro-location pages.\n\nWhat worked in 2016 isn't working in 2026.\n\nI'm seeing a significant surge in:\n\n- Major spam problems relating to huge volumes of micro-pages\n- Spam problems relating to scaled content abuse\n- Link spam issues and manipulative link building\n- Thin content issues\n\nIt seems with the advent of AI and the fact we've had 4 spam updates this year Google is going to town on it.\n\nI'm seeing So many sites losing 90%+ of traffic overnight and failing to get through reconsideration requests.\n\nMy answer is - DON'T TAKE SHORTCUTS or implement tactics from 10+ years ago to get clicks.\n\nLuckily for me, I fix these things and I know what's needed to get things through reconsideration requests, but, it's not pretty.", "img": "https://media.licdn.com/dms/image/v2/D4E22AQHH7nToxV1--w/feedshare-shrink_800/B4EaHxten6HAAk-/0/1795056593723?e=2147483647&v=beta&t=9BFkS53VK5_is5ypx9EywrA8moq90TWAo_0cekb26Do", "ts": "2026-11-19T02:49:54.633000+00:00", "col": "g", "sum": "Daniel Foley Carter got more requests to fix manual actions in the last month than in the last few years. Google now targets sites with hundreds of thin location pages, with or without AI content.", "themes": ["core", "local"], "day": "Wed Nov 18", "time": "11:49 PM", "wk": 1}, {"kind": "blog", "url": "https://www.searchenginejournal.com/openai-gpt-6-2-astra-prompting-guidance/597877/", "name": "Search Engine Journal", "sub": "searchenginejournal.com", "title": "OpenAI Publishes Prompting Guidance For GPT-6.2 Astra", "logo": "https://www.google.com/s2/favicons?domain=searchenginejournal.com&sz=128", "ts": "2026-11-18T22:26:21+00:00", "col": "b", "sum": "OpenAI's GPT-6.2 guide says Astra writes shorter, more direct answers by default. Recheck \"be concise\" lines in your prompts. Apps that edit earlier turns can lose the model's saved reasoning.", "themes": ["models"], "day": "Wed Nov 18", "time": "7:26 PM", "wk": 1}, {"kind": "x", "url": "https://x.com/nathangotch/status/2123161981813424201", "name": "Nathan Gotch", "sub": "nathangotch", "avatar": "https://pbs.twimg.com/profile_images/1690305084964384768/GRC-yHma_bigger.jpg", "text": "7 AI SEO predictions for 2027 (backed by data):\n\n1️⃣ Google AI Mode will become the default search experience\n\n2️⃣ Answer Engine Optimization (AEO) will become mainstream terminology\n\n3️⃣ Traditional SEO will remain essential, but its role will evolve\n\n4️⃣ ChatGPT will reveal more", "img": "https://pbs.twimg.com/media/HXb8dJeWkAAfN0N.png", "likes": 46, "replies": 21, "ts": "2026-11-18T21:10:37+00:00", "col": "s", "sum": "Nathan Gotch's 7 AI SEO predictions for 2027: AI Mode becomes the default, AEO becomes a common term, and traditional SEO stays essential.", "themes": ["debate"], "day": "Wed Nov 18", "time": "6:10 PM", "wk": 1}, {"kind": "blog", "url": "https://blog.google/innovation-and-ai/models-and-research/gemini-models/introducing-gemini-4-neon/", "name": "Google", "sub": "blog.google", "title": "Introducing Gemini 4 Neon", "logo": "https://www.google.com/s2/favicons?domain=blog.google&sz=128", "ts": "2026-11-18T21:00:00+00:00", "col": "g", "sum": "Google released Gemini 4 Neon, a fast model for agents and knowledge work, at $3 per million input tokens. It is live in the Gemini API and for Pro and Ultra users in the Gemini app.", "themes": ["models"], "day": "Wed Nov 18", "time": "6:00 PM", "wk": 1}, {"kind": "li", "url": "https://www.linkedin.com/posts/jason-salt_which-ai-you-should-use-depends-on-which-share-7528866993882517506-13pO/", "name": "Jason Saltzman", "sub": "Head of Research and Insights, AirOps", "avatar": "https://media.licdn.com/dms/image/v2/D5603AQE9g-e98Htx2g/profile-displayphoto-scale_400_400/B56aFfUJL.HUAg-/0/1792600480020?e=2147483647&v=beta&t=Nhd7-aB--uMjuQHDNw7fPRG9wQV6J7qTRnpoB8zWzsU", "text": "Which AI you should use depends on which AI you ask.\n\nAcross answers to AI tool questions, ChatGPT is the only engine that talks about itself more than its rivals... 50.1% of its answers name ChatGPT, only 30.3% name another AI engine.\n\nEvery other engine is a hype man for the competition:\n→ Claude: 18.1% self vs 41.3% rivals\n→ AIO: 17.0% vs 45.2%\n→ AI Mode: 15.1% vs 45.1%\n→ Gemini: 12.8% vs 38.6%\n\nTake ChatGPT out and other engines still name their competitors 27–33% of the time.\n\nThe other engines might need to take \"believe in yourself\" a little more seriously. | 14 comments on LinkedIn", "img": "https://media.licdn.com/dms/image/v2/D5622AQHGV20Oxe23rw/feedshare-shrink_800/B56aHvoopDIsAg-/0/1795021769654?e=2147483647&v=beta&t=hB6U_9tZPeUv7bxSiQQjrvuX4Lk50p9CXclpDGB1JNc", "ts": "2026-11-18T17:09:30.926000+00:00", "col": "c", "sum": "AirOps data: ChatGPT names itself in 50.1% of answers about AI tools and a rival in only 30.3%. Other engines name rivals more often: Claude 18.1% self vs 41.3% rivals, AIOs 17.0% vs 45.2%, Gemini 12.8% vs 38.6%.", "themes": ["tracking"], "day": "Wed Nov 18", "time": "2:09 PM", "wk": 1}, {"kind": "x", "url": "https://x.com/CyrusShepard/status/2123096552009015643", "name": "Cyrus SEO", "sub": "CyrusShepard", "avatar": "https://pbs.twimg.com/profile_images/2107302110866063360/UmdziLzu_bigger.jpg", "text": "New: What Content Earns Backlinks on Autopilot? 535-Site Study\n\nUsing @ahrefs we analyzed the top-linked content across 100s of sites, looking for URLs that earned links year-over-year.\n\nBlog posts performed badly, but we identified 20 winning content types you can create instead", "img": "https://pbs.twimg.com/media/HXa7xujbAAQd983.jpg", "likes": 7, "replies": 2, "ts": "2026-11-18T16:50:37+00:00", "col": "s", "sum": "Cyrus Shepard and Ahrefs studied the top-linked content on 535 sites to find pages that earn links year after year. Blog posts did badly. The study lists 20 content types that earn links on their own.", "themes": [], "day": "Wed Nov 18", "time": "1:50 PM", "wk": 1}, {"kind": "x", "url": "https://x.com/AravSrinivas/status/2123085971625476277", "name": "Aravind Srinivas", "sub": "AravSrinivas", "avatar": "https://pbs.twimg.com/profile_images/2099903483457703936/U-W6QQk__bigger.jpg", "text": "Introducing Perplexity Context API: allows you to fetch useful content from a list of webpages in whatever target format you seek. Usable inside any agentic harness. Outperforms anything else out there on performance, latency, and costs.", "img": null, "likes": 104, "replies": 40, "ts": "2026-11-18T16:08:35+00:00", "col": "t", "sum": "Perplexity launches the Context API. It pulls content from a list of web pages in the format you choose, and it works inside any agent tool.", "themes": ["agents"], "day": "Wed Nov 18", "time": "1:08 PM", "wk": 1}, {"kind": "li", "url": "https://www.linkedin.com/posts/darrenshawwhitespark_google-released-a-free-ai-tool-that-will-share-7528849253222424576-UGky/", "name": "Darren Shaw", "sub": "Founder, Whitespark", "avatar": "https://media.licdn.com/dms/image/v2/D5603AQGPRN78FYknrA/profile-displayphoto-shrink_400_400/profile-displayphoto-shrink_400_400/0/1685132735631?e=2147483647&v=beta&t=UqYA3gtwvph8Yb0r_rahU1g5IkXAz_R8M-wzWwu2sag", "text": "Google released a free AI tool that will fact-check your content before you publish it.\n \nIt's called Deep Review, and it looks very useful for SEOs creating content for their clients.\n \nYou upload a document, and Google's AI analyzes it to find:\n \n- factual errors and unsupported claims\n- inconsistencies and gaps in logic\n- claims that need stronger evidence\n- areas that could use more explanation\n \nIt then gives you a detailed report showing what might be wrong and how you could improve it.\n \nYou could use this for:\n \n- website content\n- case studies\n- client reports\n- research-heavy blog posts\n- and even presentations\n \nYou get two free reviews every week.\n \nLet me know if you want a link to the tool. | 12 comments on LinkedIn", "img": "https://media.licdn.com/dms/image/v2/D5622AQFXx5TWDYn8KA/feedshare-shrink_800/B56aHvYgCgIsAo-/0/1795017540220?e=2147483647&v=beta&t=fsoFKi0C2deBeSqW_WHXc1WBhnDjbA1V8u1BdpPLnjM", "ts": "2026-11-18T15:59:01.223000+00:00", "col": "g", "sum": "Google released Deep Review, a free AI tool that fact-checks a document before you publish it. It flags factual errors, unsupported claims and gaps in logic. You get two free reviews a week.", "themes": [], "day": "Wed Nov 18", "time": "12:59 PM", "wk": 1}, {"kind": "x", "url": "https://x.com/dejanseo/status/2123072974072992011", "name": "DEJAN", "sub": "dejanseo", "avatar": "https://pbs.twimg.com/profile_images/1697227683275706368/LE-IgoQw_bigger.jpg", "text": "Google's AI Mode now defaults to its Gemini 4 Hydrogen model, which directly influences how brands are presented in AI Overviews. To see how this affects brand perception, we tested what Hydrogen knows about us from memory, compared to what it says when it can search the live", "img": "https://pbs.twimg.com/amplify_video_thumb/2123072389701623808/img/00ZcITfpUO4xcp2H.jpg", "likes": 15, "replies": 0, "ts": "2026-11-18T15:16:56+00:00", "col": "g", "sum": "AI Mode now runs on Gemini 4 Hydrogen by default. DEJAN compared what Hydrogen says about a brand from memory with what it says when it searches the live web.", "themes": ["hydrogen"], "day": "Wed Nov 18", "time": "12:16 PM", "wk": 1}, {"kind": "blog", "url": "https://www.searchenginejournal.com/how-to-find-the-questions-your-customers-ask-ai-and-your-keyword-tools-miss/596522/", "name": "Search Engine Journal", "sub": "searchenginejournal.com", "col": "b", "sum": "Turn sales calls, support tickets and forum threads into a content plan built on the questions customers ask AI.", "themes": [], "title": "How To Find The Questions Your Customers Ask AI", "logo": "https://pbs.twimg.com/profile_images/2026045893024096256/LmcENam1_bigger.jpg", "ts": "2026-11-18T12:00:00-03:00", "day": "Wed Nov 18", "time": "12:00 PM", "wk": 1}, {"kind": "li", "url": "https://www.linkedin.com/posts/danielhinckley_geo-case-study-for-local-business-ugcPost-7528829565721526273-H5Nr/", "name": "Dan Hinckley", "sub": "Head of AI, Herringbone Digital", "avatar": "https://media.licdn.com/dms/image/v2/D4E03AQE_kpRoRiYuNQ/profile-displayphoto-scale_400_400/B4EZfvZDomH0Ak-/0/1752068013073?e=2147483647&v=beta&t=dUeyDeJek-abqXitsRp9kc1BXVfodFnnQLGuhefEwYM", "text": "SEO & GEO Case Study: Google's AI now recommends this local business in 94% of its answers. Before, rarely if ever.\n\nIt started with SEO.\n\nI don't believe a local business can get good AI results without a solid SEO plan. You have to be found first by search engines. Then your pages have to give the AI models enough details so it can generate solid answers for everything a user may be looking for.\n\nWe tested that on a local services business in 11 U.S. cities, in two steps.\n\nStep one: get found.\nTitles, descriptions, headings and 125 image descriptions. all the standard SEO best practices so Google can find and read every page.\n\nStep two: give AI what it's looking for.\n - Match the intent. One search is really several questions: price, what's included, who it's for, where, who teaches. Google AI Overviews & ChatGPT extract just the sections of your page that it believes is likely to have what the user needs, so providing all the detail in the right places makes a difference. \n - Analyze the query fan-out. AI asks the questions behind the query. We answered 55 of them for the business's most important revenue driving queries & prompts.\n- Be specific. Real prices. Named neighborhoods and venues. Credentials about the business and the founders. Details an AI can easily consume and verify.\n\nThe results, two months after relaunch:\n• 35 popular searches in Google's top 3. In August, none.\n• 5× the monthly clicks from those top spots.\n• Recommended in 94% of Google's AI answers. Cited in 95%.\n\nMore traffic from search. AI recommending the business by name. That is the path to more leads and revenue, which is what every local business is looking for.\n\nGEO doesn't replace SEO. It takes great SEO past the keyword or topic, into the user's full need and the verification an AI does before it recommends you.\n\nThe charts are in the slides. The full study, written with Clara Sherman, can be found on our website.", "img": "https://media.licdn.com/dms/image/v2/D4E1FAQGwAwjhbYgkfw/feedshare-document-cover-images_480/B4EaHvFCOUGsBA-/0/1795012437956?e=2147483647&v=beta&t=Mc5BGIE_wPwH7qPJ60WdmCGvu3zPXhHltXnhxhBi2ZE\"}},{\"type\":\"image\",\"config\":{\"src\":\"https://media.licdn.com/dms/image/v2/D4E1FAQGwAwjhbYgkfw/feedshare-document-cover-images_480/B4EaHvFCOUGsBA-/1/1795012437956?e=2147483647&v=beta&t=GuT_eQwe21NgzEEeeL7Z3i-1vjHwMZkHDO9dJhOiuL0\"}},{\"type\":\"image\",\"config\":{\"src\":\"https://media.licdn.com/dms/image/v2/D4E1FAQGwAwjhbYgkfw/feedshare-document-cover-images_480/B4EaHvFCOUGsBA-/2/1795012437956?e=2147483647&v=beta&t=9D4elNiz-mL3OmpVYgn0Qg0Nlab5Yzq0YRvYrI_OGnk\"}}],\"enableTopbarAuthor\":false,\"inbugUrl\":\"https://www.linkedin.com/feed/update/urn:li:ugcPost:7528829565721526273\",\"height\":492,\"scanUnavailableOnAccessibilityModeTitle\":\"Sign", "ts": "2026-11-18T14:40:47.357000+00:00", "col": "s", "sum": "A local services business went from rare mentions to 94% of Google's AI answers, tested in 11 US cities. Dan Hinckley says it started with SEO: get found first, then give each page enough detail for AI models to answer from.", "themes": ["local"], "day": "Wed Nov 18", "time": "11:40 AM", "wk": 1}, {"kind": "li", "url": "https://www.linkedin.com/posts/chris-long-marketing_google-tells-seos-not-to-worry-about-the-share-7528828837934043136-Awbt/", "name": "Chris Long", "sub": "Co-founder, Nectiv", "avatar": "https://media.licdn.com/dms/image/v2/D4E03AQEf7iyuuMOsyQ/profile-displayphoto-shrink_400_400/profile-displayphoto-shrink_400_400/0/1696859606064?e=2147483647&v=beta&t=aXra4UyUJSs6shwTwE7K4nEnsm7T2lck5omg5hAy4FE", "text": "Google tells SEOs not to worry about the LLMs.txt and markdown. But every page in the Gemini docs links to both a Markdown version of the page + their LLMs.txt file:  \n\nSo this was discovered by my Nectiv co-founder Jason Melman It looks like at the bottom of every page on Google's Gemini documentation there are links to do different things: \n\n- A markdown version of that individual page\n- A link to the LLMs.txt page \n\nWe've already seen that on the main Google Developers page, they link to markdown version of the files. We've also seen the Chrome team build out LLMs.txt recommendations into their audits. \n\nI'm not saying that all of these will be 100% effective today (although I'm quite bullish on testing markdown and think there's valuable ways to do it). However, I'm saying that these companies are covering all possibilities + preparing for a day when systems might place more weight on them. | 18 comments on LinkedIn", "img": "https://media.licdn.com/dms/image/v2/D4E22AQEFaSEA-YH5vw/feedshare-image-high-res/B4EaHvF7z6KgAQ-/0/1795012673033?e=2147483647&v=beta&t=aYhIXmtNGhRAg4s_IrRoRfqbSpV9RoSGq7NgRAmNecI", "ts": "2026-11-18T14:37:53.839000+00:00", "col": "g", "sum": "Google tells SEOs not to worry about LLMs.txt and markdown. But every page in Google's Gemini docs links to a markdown version and to an LLMs.txt file. Chris Long reads this as Google getting ready for a day when these files count more.", "themes": ["agents"], "day": "Wed Nov 18", "time": "11:37 AM", "wk": 1}, {"kind": "x", "url": "https://x.com/Reuters/status/2123061218445234538", "name": "Reuters", "sub": "Reuters", "avatar": "https://pbs.twimg.com/profile_images/1874154135869616128/nJDmubGJ_bigger.jpg", "text": "🔊 Anthropic prices its long-awaited IPO into one of the most nervous tech markets in years. Today’s episode of the Reuters Morning Bid podcast looks at what it says about appetite for AI stocks reut.rs/4Cpedgu", "img": "https://pbs.twimg.com/media/HXag7DHWYAErMVT.jpg", "likes": 3, "replies": 4, "ts": "2026-11-18T14:30:13+00:00", "col": "t", "sum": "Anthropic prices its IPO in one of the most nervous tech markets in years. Reuters looks at what the pricing says about demand for AI stocks.", "themes": [], "day": "Wed Nov 18", "time": "11:30 AM", "wk": 1}, {"kind": "x", "url": "https://x.com/sejournal/status/2123053844418408547", "name": "SearchEngineJournal®", "sub": "sejournal", "col": "s", "sum": "Rank Math had 16 vulnerabilities in 2026. Update the plugin.", "themes": ["security"], "avatar": "https://pbs.twimg.com/profile_images/2026045893024096256/LmcENam1_bigger.jpg", "text": "Rank Math SEO WordPress Plugin Hit By 16 Vulnerabilities In 2026. via @martinibuster: hubs.li/Q04FFqzX0\n\n#wpnews  #WordPress #SEO", "img": "https://pbs.twimg.com/media/HXaaOJ0XcAAdXqw.jpg", "likes": 0, "replies": 0, "ts": "2026-11-18T14:00:55+00:00", "day": "Wed Nov 18", "time": "11:00 AM", "wk": 1}, {"kind": "x", "url": "https://x.com/semrush/status/2123049483852288454", "name": "Semrush", "sub": "semrush", "col": "s", "sum": "Semrush adds an AI-influenced traffic metric that estimates the visits AI search drives to a brand.", "themes": ["traffic"], "avatar": "https://pbs.twimg.com/profile_images/2032094582213627906/KHSAmydp_bigger.jpg", "text": "Last week, a coalition of brands and industry leaders said AI search needs a measurement standard.\n\nFair. Here’s a start → AI-influenced traffic is a new Semrush metric that estimates the visits your brand earns from being mentioned or cited in AI answers.\n\nNot just the clicks", "img": "https://pbs.twimg.com/media/HXaWP9BXwAAlYZI.png", "likes": 0, "replies": 0, "ts": "2026-11-18T13:43:35+00:00", "day": "Wed Nov 18", "time": "10:43 AM", "wk": 1}, {"kind": "x", "url": "https://x.com/glenngabe/status/2123048902957940867", "name": "Glenn Gabe", "sub": "glenngabe", "col": "s", "sum": "DMGT (Daily Mail) joins the NYT and the FT in the SPUR coalition against AI use of content without permission.", "themes": [], "avatar": "https://pbs.twimg.com/profile_images/1939273879274287104/XDnMSJi5_bigger.jpg", "text": "New members -> DMGT, owner of the Daily Mail and New Scientist, joins the NYT and others in the SPUR coalition, seeking to stop AI firms from using content without permission\n\n\"The group joins the FT, Guardian Media Group, Telegraph Media Group, BBC, Sky News, Mediahuis, and the", "img": null, "likes": 3, "replies": 2, "ts": "2026-11-18T13:41:17+00:00", "day": "Wed Nov 18", "time": "10:41 AM", "wk": 1}, {"kind": "x", "url": "https://x.com/semrush/status/2123046825066140015", "name": "Semrush", "sub": "semrush", "col": "c", "sum": "ChatGPT has announced ads. Semrush lists the steps to prepare.", "themes": ["ads"], "avatar": "https://pbs.twimg.com/profile_images/2032094582213627906/KHSAmydp_bigger.jpg", "text": "ChatGPT has officially announced ads.\nA major shift in the business model of the world’s leading AI assistant, used by 800M+ people every week.\n\nHere's what you need to do to prepare for it & the tool that'll help:\nsocial.semrush.com/3X7mMw4.", "img": "https://pbs.twimg.com/media/HXaT1g3XYAALoOj.jpg", "likes": 18, "replies": 3, "ts": "2026-11-18T13:33:02+00:00", "day": "Wed Nov 18", "time": "10:33 AM", "wk": 1}, {"kind": "x", "url": "https://x.com/Reuters/status/2123044804087189709", "name": "Reuters", "sub": "Reuters", "col": "t", "sum": "Anthropic prepares for what could be one of the biggest IPOs in history.", "themes": [], "avatar": "https://pbs.twimg.com/profile_images/1874154135869616128/nJDmubGJ_bigger.jpg", "text": "Anthropic is gearing up for what could be one of the biggest IPOs in history, undeterred by recent volatility in technology stocks. Sam Kemp from Connection Capital says that private investors have been backing the AI giant for years reut.rs/4zEhi9W", "img": "https://pbs.twimg.com/amplify_video_thumb/2123038038850965505/img/ool8mfPcBxMs_VI5.jpg", "likes": 19, "replies": 11, "ts": "2026-11-18T13:25:00+00:00", "day": "Wed Nov 18", "time": "10:25 AM", "wk": 1}, {"kind": "x", "url": "https://x.com/sejournal/status/2123042290704720037", "name": "SearchEngineJournal®", "sub": "sejournal", "col": "g", "sum": "Over 25% of exact match impressions in AI Max campaigns came through AI Max matching. Audit your search terms.", "themes": ["ads"], "avatar": "https://pbs.twimg.com/profile_images/2026045893024096256/LmcENam1_bigger.jpg", "text": "Are your exact match keywords still keeping traffic to the searches you picked?\n\nMike Ryan found that more than 25% of impressions credited to exact match in AI Max-enabled campaigns had come through AI Max search term matching.\n\nBrooke Osmundson’s audit: hubs.li/Q04Ftrhl0", "img": "https://pbs.twimg.com/media/HXaPtlDX0AAYLGD.jpg", "likes": 2, "replies": 2, "ts": "2026-11-18T13:15:00+00:00", "day": "Wed Nov 18", "time": "10:15 AM", "wk": 1}, {"kind": "x", "url": "https://x.com/jmoserr/status/2123040439263490168", "name": "Jeremy Moser", "sub": "jmoserr", "avatar": "https://pbs.twimg.com/profile_images/2097659595221004288/EZozSJ4E_bigger.jpg", "text": "Stop chasing shiny objects with GEO.\n\nOvernight, Gemini 3x'd Reddit citations again. Comparing Aug vs Nov, Reddit increased by 121% across 2.5m+ prompts. \n\nReddit is back? Well, no, it never left in importance. Let me explain....\n\nJust a few months ago, everyone was claiming a", "img": "https://pbs.twimg.com/media/HXaN54EWgAAyrV-.jpg", "likes": 3, "replies": 2, "ts": "2026-11-18T13:07:39+00:00", "col": "g", "sum": "Reddit citations in Gemini grew 121% from August to November, across 2.5M+ prompts. Reddit never lost its weight as a citation source.", "themes": ["tracking"], "day": "Wed Nov 18", "time": "10:07 AM", "wk": 1}, {"kind": "li", "url": "https://www.linkedin.com/posts/neilkpatel_seo-aisearch-digitalmarketing-ugcPost-7528805346124144641-2LfK/", "name": "Neil Patel", "sub": "Co-Founder, Neil Patel Digital", "avatar": "https://media.licdn.com/dms/image/v2/C5103AQFihp1Vzz6oCQ/profile-displayphoto-shrink_400_400/profile-displayphoto-shrink_400_400/0/1516255378406?e=2147483647&v=beta&t=UTj0Kvde2cLI0xl9MLqYgSTChhYtp3fSKUM2jN-gCSc", "text": "SEO has a new job. It's not about being the 10th blue link nobody scrolls to anymore. It's about becoming the answer AI reaches for when it builds a response. And here's the part most brands miss: the AI is going to describe you either way. The only question is whether it's describing the brand you actually built, or the one the web pieced together about you by accident.\n\n#SEO #AISearch #DigitalMarketing #ContentStrategy #AIMarketing | 38 comments on LinkedIn", "img": null, "ts": "2026-11-18T13:04:32.955000+00:00", "col": "s", "sum": "Neil Patel says the new job of SEO is to be the answer AI uses. AI will describe your brand either way, so make sure the web says what you want it to say.", "themes": ["debate"], "day": "Wed Nov 18", "time": "10:04 AM", "wk": 1}, {"kind": "x", "url": "https://x.com/glenngabe/status/2123039497088581846", "name": "Glenn Gabe", "sub": "glenngabe", "col": "t", "sum": "Microsoft rolls out Autopilot, a personal AI agent for Microsoft 365 that works in Teams and Outlook.", "themes": ["agents"], "avatar": "https://pbs.twimg.com/profile_images/1939273879274287104/XDnMSJi5_bigger.jpg", "text": "Autopilot -> Microsoft launches Autopilot, a personal agent for Copilot\n\n\"Microsoft has started rolling out Autopilot, a personal AI teammate for Microsoft 365 that works across Teams and Outlook on behalf of individual users. Introduced at Ignite, the agent is in preview for", "img": null, "likes": 1, "replies": 1, "ts": "2026-11-18T13:03:54+00:00", "day": "Wed Nov 18", "time": "10:03 AM", "wk": 1}, {"kind": "x", "url": "https://x.com/rustybrick/status/2123038223631081769", "name": "Barry Schwartz", "sub": "rustybrick", "col": "c", "sum": "One week in, Barry still has zero data in his ChatGPT Business Hub.", "themes": ["hub"], "avatar": "https://pbs.twimg.com/profile_images/1433030583144390668/FKJ9JkUA_bigger.jpg", "text": "A week later, I still have zero data in my ChatGPT Business hub - seroundtable.com/chatgpt-busine…", "img": "https://pbs.twimg.com/media/HXaL_jHXUAAkrfo.jpg", "likes": 24, "replies": 14, "ts": "2026-11-18T12:58:51+00:00", "day": "Wed Nov 18", "time": "9:58 AM", "wk": 1}, {"kind": "blog", "url": "https://www.seroundtable.com/microsoft-advertising-bidding-models-update-42567.html", "name": "Search Engine Roundtable", "sub": "seroundtable.com", "col": "b", "sum": "Microsoft Advertising announces what it calls its biggest upgrade to bidding models.", "themes": [], "title": "Microsoft Advertising Announces Biggest Upgrade To Bidding Models", "logo": "https://www.google.com/s2/favicons?domain=seroundtable.com&sz=128", "ts": "2026-11-18T09:31:00-03:00", "day": "Wed Nov 18", "time": "9:31 AM", "wk": 1}, {"kind": "x", "url": "https://x.com/sejournal/status/2123028711070924913", "name": "SearchEngineJournal®", "sub": "sejournal", "col": "g", "sum": "Google explains how to avoid SEO problems when you move a site to a new CDN.", "themes": [], "avatar": "https://pbs.twimg.com/profile_images/2026045893024096256/LmcENam1_bigger.jpg", "text": "Google Explains How To Avoid CDN Migration SEO Problems. via @martinibuster: hubs.li/Q04FF0F80\n\n#seonews  #Google #SEO", "img": "https://pbs.twimg.com/media/HXaDXLFWwAAymul.jpg", "likes": 5, "replies": 2, "ts": "2026-11-18T12:21:03+00:00", "day": "Wed Nov 18", "time": "9:21 AM", "wk": 1}, {"kind": "li", "url": "https://www.linkedin.com/posts/kochjar_claudecode-aiagents-share-7528788635022790656-Y_OG/", "name": "Tim Kochjar", "sub": "Technical Co-founder, Tables.so", "avatar": "https://media.licdn.com/dms/image/v2/D4E03AQEFFMtaVal1yg/profile-displayphoto-scale_400_400/B4EZ54cAMtIwAg-/0/1780137068836?e=2147483647&v=beta&t=NCEaWJYeg9RrSUIk-CWzuI0Q5Nn60zmwAAUoTFS9FgY", "text": "Claude just released Code Mode.\n\nUntil now an AI agent used its tools one step at a time call a tool, wait, read the result, call the next one.\n\nNow it writes a script that chains all the tools together and runs it in one go.\n\nIn practice, at Tables: “find 300 companies, find the top 3 decision makers, get their contacts, remove the ones already in our CRM”. Before, Claude did that one tool call at a time and read every result in between. Now it writes it once as a small script, and the script does the looping, skipping and batching on its own.\n\nTry it in your terminal:\nCLAUDE_CODE_EXPERIMENTAL_CODE_MODE=1 claude\n\nhttps://lnkd.in/e96K_hf2\n\n#ClaudeCode #AIagents | 72 comments on LinkedIn", "img": "https://media.licdn.com/dms/image/v2/D4E22AQETDR__n4r6mw/feedshare-shrink_800/B4EaHuhXmKJgAk-/0/1795003087636?e=2147483647&v=beta&t=XfLgEGAmhjGIVw1LcHeCU6kNibXL4Ud12exB3EsUBi4", "ts": "2026-11-18T11:58:08.718000+00:00", "col": "t", "sum": "Claude Code has an experimental Code Mode. The agent writes one script that chains its tool calls, so it does not stop to read each result. Turn it on with CLAUDE_CODE_EXPERIMENTAL_CODE_MODE=1.", "themes": [], "day": "Wed Nov 18", "time": "8:58 AM", "wk": 1}, {"kind": "li", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7528787901246103552/", "name": "Ruben Remy", "sub": "Freelance SEO and AI Innovation Consultant", "avatar": "https://media.licdn.com/dms/image/v2/D5603AQFmJFfevGNMYA/profile-displayphoto-shrink_400_400/profile-displayphoto-shrink_400_400/0/1685959566993?e=2147483647&v=beta&t=V1l_A_O93RESRpayUuWIG32wl0NZ_cdlfTSSagiP0sE", "text": "Did you know Google BigQuery has an MCP server?\n\nI’ve started setting it up for clients so they can ask questions about their own data in Claude or ChatGPT. Google Search Console, Google Analytics, and internal data that's kept in BigQuery. \n\nThe Bigquery MCP makes it super easy for professionals to get questions answered about their data and offers their personal Oauth login with their Google account. It offers fine-grained access controls so users can only access what they are allowed. Most stakeholders should be read-only.\n\n 💡 A few things I learned while setting it up:\n\n1. Give them BigQuery Job User and MCP Tool User on the project, and Data Viewer only on the datasets they may read. A project-wide Data Viewer grant opens every table, so that's likely not what you want.\n\n2. The tools require a project ID. Put it in the connector name or the first instruction. The assistant will otherwise not pick it up and would ask the oblivious user for it.\n\n3. Write table and column descriptions/definitions in BigQuery. That is the definition the assistant reads while looking at the data. This is the simplest version of your \"semantic layer\". There are other options, but start here and it might be enough.\n\n4. Create a separate OAuth client for the assistant, and mark it as a client for an AI agent. Don’t reuse the client that signs people into a dashboard. GCP offers a checkbox for that which you will see when setting up the Oauth client.\n\n5. The user's email account with which they have a e.g. Claude account, is the same email that needs to get MCP access in Google Cloud. If the email addresses are not matching, then the claude agent cannot authenticate.\n\nDo you need help with AI innovation at your company?\nBesides SEO, this year I've been offering AI innovation and agentic acceleration as a service as well. Q1 2027 I will be able to help another Dutch company out, so feel free to ask! | 18 comments on LinkedIn", "img": "https://media.licdn.com/dms/image/v2/D4E22AQHRvDH1ueF0NA/feedshare-shrink_800/B4EaHugshFIEAg-/0/1795002911174?e=2147483647&v=beta&t=G_-4BEW6fv0QaXefKJLEgKeuYyWWsks0LupE10djcV0", "ts": "2026-11-18T11:55:13.772000+00:00", "col": "t", "sum": "Google BigQuery has an MCP server. Ruben Remy uses it so clients can ask Claude or ChatGPT about their GSC, GA4 and BigQuery data. His tips: give read-only access per dataset, and write table and column descriptions for the assistant to read.", "themes": ["agents"], "day": "Wed Nov 18", "time": "8:55 AM", "wk": 1}, {"kind": "x", "url": "https://x.com/MordyOberstein/status/2123015879873134806", "name": "Mordy Oberstein", "sub": "MordyOberstein", "col": "g", "sum": "November 2026 Core Update: SE Ranking shows volatility cooling, most at the very top of the SERP.", "themes": ["core"], "avatar": "https://pbs.twimg.com/profile_images/1823356809962233856/ZSedLx-q_bigger.jpg", "text": "Google November 2026 Core Update, Update: \n\nThis is a weird little update, isn't it? @SERanking shows slight cooling off in volatility - more so at the very TOP of the SERP", "img": "https://pbs.twimg.com/tweet_video_thumb/HXZ3mQlWEAAv_05.jpg", "likes": 2, "replies": 4, "ts": "2026-11-18T11:30:04+00:00", "day": "Wed Nov 18", "time": "8:30 AM", "wk": 1}, {"kind": "li", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7528776512632918016/", "name": "Samanyou Garg", "sub": "Founder and CEO, Writesonic", "avatar": null, "text": "Introducing the ChatGPT Ads Library + AI Ads Index. Both completely free.\n\nThink Meta Ads Library, but for ads appearing inside ChatGPT and Google AI Overviews.\n\nYou can now search for a competitor and see the actual AI ads they're running, the messaging they're using, where they're sending customers, and even the prompts triggering those ads.\n\nAnd the numbers are getting pretty interesting.\n\nIn our November 16 sample, 18.94% of ChatGPT answers contained a sponsored ad.\nThe following day, we observed over 4,000 advertisers.\n\nJotform alone has over 1,500 captured ChatGPT ad examples in our library.\n\nWhen ChatGPT first started experimenting with ads, we built an AI Ads Index to understand how quickly this new advertising channel was evolving.\n\nNow we're taking it much further.\n\nAI Ads Library: Search advertisers, explore real ad creatives, landing pages, prompts, and where their ads are appearing.\n\nAI Ads Index: Track ad penetration, advertiser activity, industry trends, and how AI advertising is evolving over time.\n\nBoth are updated daily, and completely free.\n\nWhat I find particularly fascinating is that we're watching a new advertising channel take shape in real time.\n\nFor years, marketers have optimized for Google Ads and Meta Ads. Now there's an entirely new surface where people are actively researching, comparing, and deciding what to buy.\n\nWhich prompts trigger ads? What messaging works? How will paid placements interact with organic AI recommendations?\n\nWe're going to learn a lot over the coming months.\n\nAnd I think everyone should have access to this data, not just the brands already advertising.\n\nGo explore. You might be surprised by what your competitors are doing.\n\nLinks in the first comment. | 52 comments on LinkedIn", "img": null, "ts": "2026-11-18T11:0
