g a page for every version of the query. Google actually warns against that. More pages won’t win. Evidence will. Real data. Screenshots. Real pricing. Honest limitations. If your page says what every other page says,", "img": "https://pbs.twimg.com/media/HXXMD1ZXwAAjbrf.jpg", "likes": 21, "replies": 13, "ts": "2026-11-17T23:00:13+00:00", "col": "s", "sum": "Google warns against a separate page for every version of a query. Neil Patel says evidence wins instead: real data, screenshots, real pricing and honest limits.", "themes": ["debate"], "day": "Tue Nov 17", "time": "8:00 PM", "wk": 1}, {"kind": "x", "url": "https://x.com/Google/status/2122820914777845813", "name": "Google", "sub": "Google", "col": "g", "sum": "Gemini 4 Hydrogen is live in Google Search worldwide: better intent understanding, smarter query fan-out and more links.", "themes": ["hydrogen"], "avatar": "https://pbs.twimg.com/profile_images/2042749771337564160/AgOFPEL3_bigger.jpg", "text": "Gemini 4 Hydrogen is live in Google Search globally 🚀\n\nOur biggest model upgrade to Search yet brings:\n🔹 Better understanding of your intent\n🔹 Smarter query fan-out and linking\n🔹 More visual, adaptive responses\n🔹 Richer multilingual capabilities\n\nSwipe to see a full", "img": "https://pbs.twimg.com/amplify_video_thumb/2122820757931556864/img/hXcXtZnKJRBaX-ym.jpg", "likes": 3102, "replies": 120, "ts": "2026-11-17T22:35:20+00:00", "day": "Tue Nov 17", "time": "7:35 PM", "wk": 1}, {"kind": "x", "url": "https://x.com/OfficialLoganK/status/2122818500763009273", "name": "Logan Kilpatrick", "sub": "OfficialLoganK", "col": "g", "sum": "Google AI Studio now supports custom domains and builds Android apps you can install from Google Play (US only).", "themes": [], "avatar": "https://pbs.twimg.com/profile_images/1943787288955084800/QOl7OJMc_bigger.jpg", "text": "Big @GoogleAIStudio updates today : ) \n\n- Support for Custom Domains (buy it direct in AI Studio)\n- Build an Android App and download it to your phone through the Google Play store (US only for now)\n- Securely add AI to your Android Apps in AI Studio\n\nai.studio/build", "img": "https://pbs.twimg.com/amplify_video_thumb/2122818275163930624/img/YENet75JbGWSBwLS.jpg", "likes": 1924, "replies": 169, "ts": "2026-11-17T22:25:45+00:00", "day": "Tue Nov 17", "time": "7:25 PM", "wk": 1}, {"kind": "x", "url": "https://x.com/lilyraynyc/status/2122812829560631390", "name": "Lily Ray 😏", "sub": "lilyraynyc", "col": "g", "sum": "Google now links out more in AI search.", "themes": ["hydrogen"], "avatar": "https://pbs.twimg.com/profile_images/1935460090821189632/UvkORAsU_bigger.jpg", "text": "Wait now Google is linking out more too? Is external linking suddenly the hot new thing in AI search?  😆 \n\nAbout time!", "img": null, "likes": 61, "replies": 9, "ts": "2026-11-17T22:03:13+00:00", "day": "Tue Nov 17", "time": "7:03 PM", "wk": 1}, {"kind": "x", "url": "https://x.com/sejournal/status/2122808875627733418", "name": "SearchEngineJournal®", "sub": "sejournal", "col": "c", "sum": "6.9% of ChatGPT conversations in a US panel showed purchase intent.", "themes": ["ads"], "avatar": "https://pbs.twimg.com/profile_images/2026045893024096256/LmcENam1_bigger.jpg", "text": "6.9% Of ChatGPT Conversations Showed Purchase Intent In U.S. Panel. via @MattGSouthern: hubs.li/Q04FBxFp0\n\n#ppcnews   #ChatGPT #PPC #PaidSearch #SEM #SEO", "img": "https://pbs.twimg.com/media/HXW7bF_WkAEqZOy.jpg", "likes": 12, "replies": 2, "ts": "2026-11-17T21:47:30+00:00", "day": "Tue Nov 17", "time": "6:47 PM", "wk": 1}, {"kind": "x", "url": "https://x.com/TheRundownAI/status/2122805949203148959", "name": "The Rundown AI", "sub": "TheRundownAI", "col": "t", "sum": "Microsoft introduces seven MAI models at Ignite, for coding, cyber defense, image editing and live voice.", "themes": ["models"], "avatar": "https://pbs.twimg.com/profile_images/1672707817197965312/zsxkJv_T_bigger.jpg", "text": "SHIPPING: Microsoft introduced seven MAI models at its Ignite event, including new systems for coding, cyber defense, image editing, live voice, and more.\n\nHighlights include:\n\nMAI Code 2: within a few points of Claude Opus 5.5 on coding benchmarks, for a twentieth of what", "img": "https://pbs.twimg.com/media/HXWQ0xcXgAE-LFy.png", "likes": 44, "replies": 17, "ts": "2026-11-17T21:35:52+00:00", "day": "Tue Nov 17", "time": "6:35 PM", "wk": 1}, {"kind": "x", "url": "https://x.com/aleyda/status/2122799233673912549", "name": "Aleyda Solis 🕊️", "sub": "aleyda", "col": "g", "sum": "Before and after examples of how Gemini 4 Hydrogen changed the links and sources in AIOs.", "themes": ["hydrogen"], "avatar": "https://pbs.twimg.com/profile_images/1803039284108083200/i0blVR4I_bigger.jpg", "text": "There's an important impact after Gemini 4 Hydrogen release in AI Overviews Links and Sources I'm tracking 👇 \n\nI've been checking how answers are changing, and here's an example of the before/after I'm seeing for: \"best place for men's jeans online\", comparing Nov 7 vs. 16.\n\n*", "img": "https://pbs.twimg.com/media/HXWyjeZXwAANcZs.jpg", "likes": 61, "replies": 33, "ts": "2026-11-17T21:09:11+00:00", "day": "Tue Nov 17", "time": "6:09 PM", "wk": 1}, {"kind": "x", "url": "https://x.com/timsoulo/status/2122796941146730891", "name": "Tim Soulo 🇺🇦", "sub": "timsoulo", "col": "s", "sum": "Most AI prompt tracking setups miss important details.", "themes": ["tracking"], "avatar": "https://pbs.twimg.com/profile_images/1757758819134836736/LJevsZAx_bigger.jpg", "text": "I bet your AI prompt tracking is set up wrong.\n\nHow do I know?\n\nBecause there's A TON of nuance to prompt tracking that your setup most likely doesn't account for.\n\nHonestly, there's so much nuance that I probably don't know all of it myself.\n\nThat's why I'm bringing two super", "img": "https://pbs.twimg.com/media/HXWwj-mX0AECVYa.jpg", "likes": 8, "replies": 3, "ts": "2026-11-17T21:00:05+00:00", "day": "Tue Nov 17", "time": "6:00 PM", "wk": 1}, {"kind": "li", "url": "https://www.linkedin.com/posts/larslofgren_if-youre-deciding-how-to-allocate-your-seo-share-7528549282908471296-6Qog/", "name": "Lars Lofgren", "sub": "Fractional B2B CMO", "col": "s", "sum": "Base your 2027 SEO and GEO budget on which of 3 performance buckets your site is in.", "themes": ["debate"], "avatar": "https://media.licdn.com/dms/image/v2/D5603AQHhnHOdc2BRrQ/profile-displayphoto-shrink_400_400/profile-displayphoto-shrink_400_400/0/1716317795674?e=2147483647&v=beta&t=8SRXIw3SHZBF2r9nbdOIoW5pqBuNpRrfDs1vAd7pQtA", "text": "If you're deciding how to allocate your SEO/GEO budget for 2027, I'd base it on which of the 3 buckets that your site currently falls into (based on your 2026 performance).\n\nI've had the fortune of working on a bunch of epic domains in the past few years. Huge brands, monster DRs, endless traffic, major budgets. Even in this cohort, SEO performance varies a lot. I have my suspicions for what causes this difference but that's another post for another time.\n\nRoughly, every program has ended up in 1 of 3 buckets.\n\n1) Google loves you = changes occur in weeks. New blog posts, updates, landing pages, technical fixes, whatever. In a lot of cases, you can see the impact in days. And it's not hard to show program progress over weeks. If this is you, go double down on whatever it is you're doing. I would, however, be careful about overspending on SEO. Somewhere in the $30-50K/month range is where I settle these days. After that, I spend on other channels. Increasing your budget from $10 to $20K? Definitely. Going from $50K to $100K? I probably wouldn't, even if things are going well. Overweighting on SEO can destroy the program.\n\n2) Google likes you, doesn't love you though. Most changes take months to show real progress. You can definitely see progress YoY but nothing is a given. If this is you, I'd get your SEO budget into the $10-20K/month range at least. Take it seriously, keep building.\n\n3) Google hates you. Feels like nothing ever works. If you squint, you can maybe see YoY progress but it all feels like a slog. Very common for sites that overweighted on SEO in the past (this is possible even for major brands). SEO got you into this mess, SEO will not get you out. For anyone in this bucket, I'd slash SEO budget to the bone. Maybe keep $5K/month for cleanup and basic updates. Cut everything else. Instead, dump all your budget into building other channels out (YouTube, Reddit, personal social profiles, etc). Ironically, this will make SEO a lot easier in the future.\n\nDM me if you want a second set of eyes on your marketing budget. I can share a few quick thoughts with you directly (I always keep things private too). | 22 comments on LinkedIn", "img": null, "ts": "2026-11-17T20:07:02.727000+00:00", "day": "Tue Nov 17", "time": "5:07 PM", "wk": 1}, {"kind": "li", "url": "https://www.linkedin.com/posts/edward-sturm_google-is-testing-removing-ai-mode-from-search-ugcPost-7528537477578489857-RrX5/", "name": "Edward Sturm", "sub": "SEO & Marketer", "col": "g", "sum": "Google is testing removing AI Mode from its homepage, because AI Mode ads earn less for Google and for advertisers.", "themes": ["ads"], "avatar": "https://media.licdn.com/dms/image/v2/D4E03AQH8ff7dRFcwlw/profile-displayphoto-shrink_400_400/profile-displayphoto-shrink_400_400/0/1676566898420?e=2147483647&v=beta&t=yzQT5jhDKKHlA-X5T1xGOmJtfF1GYMQ9TCQSpZ_MTs0", "text": "Google is testing removing AI Mode from search because AI ads make less money for advertisers.\n\nGoogle’s also testing removing the Ask Anything box under AI Overviews… and removing AI Mode from their homepage.\n\nGoogle has literally said AI Mode ads make everybody less money than traditional search ads: makes less money for Google, makes less money for advertisers.\n\nIn fact, this study about ChatGPT ads was just released- ChatGPT ads are terribly unprofitable.\n\n\"A ChatGPT ad click is worth $0.26. One of the largest publicly known accounts paid $1.72, more than six times as much.\n\nVisitors from ChatGPT ads perform worse behind Google Ads, Google search, direct traffic, ChatGPT's own unpaid recommendations.\"\n\nJust like Google's AI Mode ads, ChatGPT ads make advertisers less money.\n\nBack in May this year, Google announced all these AI features at Google I/O.\n\nHere's TechCrunch saying “The era of 10 blue links is officially over.”\n\nPeople have been screaming SEO is dead for decades.\n\nNext time you see a big hyped-up statement like this, my advice is to keep calm and to focus on the SEO that matters.\n\nAs long as there's large amounts of unorganized data to sort through, companies, people will always need search engine optimization.\n\nDon't give into the hype. | 56 comments on LinkedIn", "img": null, "ts": "2026-11-17T19:20:08.117000+00:00", "day": "Tue Nov 17", "time": "4:20 PM", "wk": 1}, {"kind": "x", "url": "https://x.com/lilyraynyc/status/2122764084974415955", "name": "Lily Ray 😏", "sub": "lilyraynyc", "col": "c", "sum": "One of the higher CTRs she has seen in ChatGPT Business Hub. The 17 clicks converted at 12%.", "themes": ["hub"], "avatar": "https://pbs.twimg.com/profile_images/1935460090821189632/UvkORAsU_bigger.jpg", "text": "This is cool to see - this is one of the higher CTRs I’ve seen in ChatGPT Business Hub so far, and the marketing lead tells me that the conversion rate among those 17 clicks is 12% 🤯\n\n(Yes it’s a small biz/startup so the numbers are tiny, but highly valuable!)", "img": "https://pbs.twimg.com/media/HXWSr0GWkAEpLDY.jpg", "likes": 56, "replies": 21, "ts": "2026-11-17T18:49:31+00:00", "day": "Tue Nov 17", "time": "3:49 PM", "wk": 1}, {"kind": "x", "url": "https://x.com/JordiRib1/status/2122763042748252394", "name": "Jordi Ribas", "sub": "JordiRib1", "col": "s", "sum": "Web IQ is Microsoft's search engine for AI agents. It grounds ChatGPT, Copilot and Mistral.", "themes": ["agents"], "avatar": "https://pbs.twimg.com/profile_images/1847301322871296001/IpD_WybT_bigger.jpg", "text": "While Bing is our web search engine for humans, Web IQ is our search engine for AI agents. Web IQ provides web grounding to many companies and leading AI platforms like ChatGPT, Copilot, and Mistral.\n\nAt Microsoft Ignite, we’re announcing that Web IQ is now broadly available to", "img": "https://pbs.twimg.com/amplify_video_thumb/2122762979431116801/img/rREEhdHhqOSqvAXG.jpg", "likes": 172, "replies": 10, "ts": "2026-11-17T18:45:23+00:00", "day": "Tue Nov 17", "time": "3:45 PM", "wk": 1}, {"kind": "x", "url": "https://x.com/randfish/status/2122760870262644844", "name": "Rand Fishkin", "sub": "randfish", "col": "c", "sum": "SparkToro analyzed 118K prompts from 12K ChatGPT users. ChatGPT is mostly a consumer app.", "themes": ["traffic"], "avatar": "https://pbs.twimg.com/profile_images/1642291634066030593/byujxuux_bigger.jpg", "text": "NEW RESEARCH: sparktoro.com/blog/we-analyz…\n\nWe analyzed 118k prompts from 12k ChatGPT users to answer key Qs:\n - how often do brands appear?\n - what % of prompts have commercial intent?\n - how does usage compare to Google search?", "img": "https://pbs.twimg.com/media/HXWPww3akAAThtp.jpg", "likes": 131, "replies": 33, "ts": "2026-11-17T18:36:45+00:00", "day": "Tue Nov 17", "time": "3:36 PM", "wk": 1}, {"kind": "li", "url": "https://www.linkedin.com/posts/simoahava_google-tags-are-now-google-tag-manager-containers-share-7528525452714577920-mAOs/", "name": "Simo Ahava", "sub": "Co-founder, Simmer", "avatar": "https://media.licdn.com/dms/image/v2/D4D03AQGwwyV9Znx98A/profile-displayphoto-shrink_400_400/profile-displayphoto-shrink_400_400/0/1695718541802?e=2147483647&v=beta&t=ejKc6vEnubEyzm6hYuHfxuL8sm_K2crUugZdf4sz26c", "text": "Google Tags are now Google Tag Manager containers. \n\nInstead of managing Google Tags via their own settings interface, you will now control them with the GTM UI. They will retain all Google Tag capabilities but will now benefit from a more unified approach to tagging under Google. \n\nOnce the migration is complete, hopefully some of the confusion introduced by the GTM upgrade will be dispelled. However, Google Tag vs. Google Tag Manager is still confusing even for experts and power users. Maybe with this consolidation it will be easier to grok each system’s role in a marketing setup. \n\nAgain, importantly, on-page behavior doesn’t change. This doesn’t introduce additional data collection or processing beyond what the tags have already done and been capable of. \n\nRelease notes: https://lnkd.in/dbCJkyGe | 27 comments on LinkedIn", "img": "https://media.licdn.com/dms/image/v2/D4D22AQGojJp06sH5xw/feedshare-shrink_1280/B4DaHqyAdyKIAQ-/0/1794940340387?e=2147483647&v=beta&t=USULRRro1SukGKz-ioQyfISAHkNtjgXuSUw_pj6sqxo", "ts": "2026-11-17T18:32:21.166000+00:00", "col": "g", "sum": "Google Tags are now Google Tag Manager containers. You manage them in the GTM interface, and they keep all Google Tag features. On-page behavior and data collection do not change.", "themes": [], "day": "Tue Nov 17", "time": "3:32 PM", "wk": 1}, {"kind": "x", "url": "https://x.com/glenngabe/status/2122754993753411827", "name": "Glenn Gabe", "sub": "glenngabe", "col": "c", "sum": "OpenAI launches GPT-6.2 Astra for complex professional work and GPT-6.2 Sol for everyday work.", "themes": ["models"], "avatar": "https://pbs.twimg.com/profile_images/1939273879274287104/XDnMSJi5_bigger.jpg", "text": "Now OpenAI news... right after Gemini news... :) -> OpenAI launches GPT-6.2 Astra, its new frontier model for “complex professional work”, and GPT-6.2 Sol, its new “go-to model for everyday work”\nopenai.com/index/introduc…", "img": null, "likes": 5, "replies": 3, "ts": "2026-11-17T18:13:24+00:00", "day": "Tue Nov 17", "time": "3:13 PM", "wk": 1}, {"kind": "blog", "url": "https://www.searchenginejournal.com/date-confirmed-rating-meets-expectations-comments-none/597709/", "name": "Search Engine Journal", "sub": "searchenginejournal.com", "col": "b", "sum": "Pedro Dias: a core update gives you a date and nothing else. He suggests a better question to ask about your site.", "themes": ["core"], "title": "Date: Confirmed, Rating: Meets Expectations, Comments: None", "logo": "https://pbs.twimg.com/profile_images/2026045893024096256/LmcENam1_bigger.jpg", "ts": "2026-11-17T15:01:00-03:00", "day": "Tue Nov 17", "time": "3:01 PM", "wk": 1}, {"kind": "x", "url": "https://x.com/rustybrick/status/2122750412105396346", "name": "Barry Schwartz", "sub": "rustybrick", "col": "g", "sum": "Google AI Mode now has temporary threads.", "themes": ["aimode"], "avatar": "https://pbs.twimg.com/profile_images/1433030583144390668/FKJ9JkUA_bigger.jpg", "text": "Google AI Mode temporary threads - we covered it yesterday thanks to @gaganghotra_ spotted it seroundtable.com/google-ai-mode…", "img": null, "likes": 10, "replies": 3, "ts": "2026-11-17T17:55:11+00:00", "day": "Tue Nov 17", "time": "2:55 PM", "wk": 1}, {"kind": "blog", "url": "https://www.searchenginejournal.com/optimizely-signup-flaw-malware/597839/", "name": "Search Engine Journal", "sub": "searchenginejournal.com", "col": "b", "sum": "An attacker put harmful code into a trusted Optimizely script, and it reached 178 organizations. Check your code, account access and security headers.", "themes": ["security"], "title": "A Trusted Optimizely Script Carried Malware To 178 Organizations", "logo": "https://pbs.twimg.com/profile_images/2026045893024096256/LmcENam1_bigger.jpg", "ts": "2026-11-17T14:32:00-03:00", "day": "Tue Nov 17", "time": "2:32 PM", "wk": 1}, {"kind": "x", "url": "https://x.com/glenngabe/status/2122744362870174089", "name": "Glenn Gabe", "sub": "glenngabe", "col": "g", "sum": "Gemini gets more agentic: in the US it can call local businesses and pay and check out for users.", "themes": ["agents"], "avatar": "https://pbs.twimg.com/profile_images/1939273879274287104/XDnMSJi5_bigger.jpg", "text": "Gemini Update. It's becoming more agentic...\n\nFrom Josh:\nMany highly requested features are rolling out now, starting in the US: \n* Call local businesses (via Google Duplex) \n* Pay and check out (via Google Pay) \n* Text Gemini on Android or iOS (via RCS) \n* Forward emails to", "img": null, "likes": 38, "replies": 7, "ts": "2026-11-17T17:31:09+00:00", "day": "Tue Nov 17", "time": "2:31 PM", "wk": 1}, {"kind": "blog", "url": "https://blog.google/innovation-and-ai/products/gemini-app/tasks-in-gemini-free-new-features/", "name": "Google", "sub": "blog.google", "col": "g", "sum": "Tasks in Gemini is now free in six countries, with new features.", "themes": [], "title": "Put Gemini to work for you", "logo": "https://pbs.twimg.com/profile_images/2042749771337564160/AgOFPEL3_bigger.jpg", "ts": "2026-11-17T14:00:00-03:00", "day": "Tue Nov 17", "time": "2:00 PM", "wk": 1}, {"kind": "li", "url": "https://www.linkedin.com/posts/landwehr_my-thoughts-on-the-chatgpt-business-hub-share-7528494407398920193-iUSq/", "name": "Malte Landwehr", "sub": "Peec AI", "col": "c", "sum": "ChatGPT Business Hub is a worse GSC: real data, but few clicks, no prompts and an odd definition of a mention.", "themes": ["hub"], "avatar": "https://media.licdn.com/dms/image/v2/D4E03AQHpAoxOrqhQmQ/profile-displayphoto-scale_400_400/B4EZfBsEGwHcAg-/0/1751301244427?e=2147483647&v=beta&t=OH6j_3-uSdr5ZzbWEiFGBCg0ciT4vaO9Yy5fgHj-xdo", "text": "My thoughts on the ChatGPT Business Hub: a worse GSC.\n\nBut also more than GSC. It includes functionality similar to Google Merchant Center and Google Business Profile.\n\nThe big plus? „Real“ data. Finally!\n\nThe big minus? No prompts, very generic topics, limited historical data, and a weird definition of what a mention is.\n\nAlso, very few clicks! But that is as expected.\n\nWeird definition of mentions? Hear me out. Your brand is mentioned with a link to your website? That’s a mention! Your website is cited? That is a mention too - even if your brand was not mentioned in the answer at all.\n\nYour brand is mention without a link? Or the link goes to your LinkedIn profile? Those are not mentions. \n\nThere is also no differentiation between branded and unbranded prompts.\n\nIn the end, it has the purpose to convince you to give OpenAI access to all your data. It will not help you gain more citations, understand how you perform vs competitors, are help you be recommended more often.\n\nSimilar to Google Search Console and Bing Webmaster Tools, it is a data source. It has value. But it is only one of multiple data points that should inform your execution layer and success measurement.\n\nMore details in the Peec AI blog. | 53 comments on LinkedIn", "img": "https://media.licdn.com/dms/image/v2/D4E22AQGRL8mWLqn4Vw/feedshare-shrink_800/B4EaHqVxUnHwAg-/0/1794932938409?e=2147483647&v=beta&t=Ya7hkns0F4POpBnvDJxzB9nZtZCCnMf8bDAMqJiUU7I", "ts": "2026-11-17T16:28:59.386000+00:00", "day": "Tue Nov 17", "time": "1:28 PM", "wk": 1}, {"kind": "li", "url": "https://www.linkedin.com/posts/darrenshawwhitespark_google-will-tell-you-about-3-citations-it-share-7528475092624986112-tcYs/", "name": "Darren Shaw", "sub": "Founder, Whitespark", "avatar": "https://media.licdn.com/dms/image/v2/D5603AQGPRN78FYknrA/profile-displayphoto-shrink_400_400/profile-displayphoto-shrink_400_400/0/1685132735631?e=2147483647&v=beta&t=UqYA3gtwvph8Yb0r_rahU1g5IkXAz_R8M-wzWwu2sag", "text": "Google will tell you about 3 citations it is associating with your business in the “Web Results” section of your listing on Maps. We analyzed over 21,000 businesses to see what Google shows there, and here’s what we found:\n \nYour website is your #1 citation (duh)\n \nIt showed up in 86% of listings, usually in the top spot. I have to assume the remaining 14% do not have a website.\n \nFacebook is the number one third-party site, appearing for 41% of businesses.\n \nOk, I know that Facebook is for “the olds”, but a Facebook business page is pretty important to Google based on this data.\n \nMapQuest is more important than you thought\n \nIt showed up in 18% of Business Profiles!\n \nReddit threads can appear in this section, including ones that are over a decade old.\n \nAnd many of them are complaints about your business. Uh oh.\n \nPlus so many other interesting discoveries!\n \nMiriam Ellis has written up the detailed analysis on the Whitespark website. It includes the complete list of the most important sites for your business industry, plus a full checklist to maximize control over your Google Maps Web Results.\n \nLet me know if you want the link. | 19 comments on LinkedIn", "img": "https://media.licdn.com/dms/image/v2/D5622AQHIhfTtdiztNQ/feedshare-shrink_800/B56aHqENEgH0Ag-/0/1794928333484?e=2147483647&v=beta&t=WHA035aQ5wztlSmtHAXII6DjjleNHXw5NBEMA83zPbM", "ts": "2026-11-17T15:12:14.385000+00:00", "col": "g", "sum": "Whitespark checked 21,000+ businesses to see the 3 citations Google shows in the Maps Web Results section. The website showed up in 86%, Facebook in 41% and MapQuest in 18%. Old Reddit complaint threads can show there too.", "themes": ["local"], "day": "Tue Nov 17", "time": "12:12 PM", "wk": 1}, {"kind": "li", "url": "https://www.linkedin.com/posts/nelliott_as-anthropic-prepares-to-go-public-this-share-7528465549652185088-JU9N/", "name": "Nate Elliott", "sub": "EMARKETER", "col": "s", "sum": "Google Search has the same monthly users as in 2023. AI is not killing search.", "themes": ["debate"], "avatar": null, "text": "As Anthropic prepares to go public, this is your regular reminder that AI isn't killing search. It's not even making a dent.\n\nMuch of Anthropic's narrative rightly focuses on its strength as an enterprise tool. But Claude is also one of the world's largest chatbots, having separated itself this year from competitors like Perplexity and Grok.\n\nAnthropic is likely to be valued at well over $1 trillion, and OpenAI is seeking a similar valuation next year. The main argument for such lofty numbers is that their chatbots will ravage the search industry: that people will stop using traditional discovery channels like Google, and that this will lead to a bonanza of subscription and advertising revenue for AI platforms.\n\nBut Google Search has the same number of monthly users now as it did in 2023. And the average Google Search user actually visits slightly more often now than in 2023.\n\nSo yes, billions of people around the world use AI on a regular basis. Yes, AI is changing the way many people search, and what they expect responses to look like. And yes, now that Google has gotten people using AI Overviews and AI Mode (which are part of the data in this chart), it needs to figure out how to better monetize these tools.\n\nBut no, chatbots are not killing search. Not even close. | 70 comments on LinkedIn", "img": "https://media.licdn.com/dms/image/v2/D4E22AQERonKtrn5TRA/feedshare-shrink_1280/B4EaHp7hqoIgAQ-/0/1794926058488?e=2147483647&v=beta&t=5r2zl0BOGzdMaA9Ln3c7j1o3QdKjNZoP0mYekq33P-4", "ts": "2026-11-17T14:34:19.163000+00:00", "day": "Tue Nov 17", "time": "11:34 AM", "wk": 1}, {"kind": "li", "url": "https://www.linkedin.com/posts/b2b-saas-copywriter-dorcas-adisa_as-part-of-my-aeogeoseo-research-i-built-share-7528442166092861440-Zz3b/", "name": "Dorcas Adisa", "sub": "Organic & AI Search", "col": "s", "sum": "A new site got 1K+ impressions in 4 days with no promotion. She lists the setup steps.", "themes": [], "avatar": "https://media.licdn.com/dms/image/v2/C5603AQHBCUmYI562xA/profile-displayphoto-shrink_400_400/profile-displayphoto-shrink_400_400/0/1638622263547?e=2147483647&v=beta&t=HTRDiYJu0mDI832f5z1IZQEzUpex_1qOOqawI6ZRywk", "text": "As part of my AEO/GEO/SEO research, I built a website from scratch to see how quickly a new website could gain organic search visibility.\n\n4 days after hosting the site, I'm already at 1K+ impressions. I haven't promoted the site or put the link anywhere online.\n\n\n\n\nI didn't get here by luck though, I put some structure in place while building the website:\n\n1.) Started by defining my new positioning. In my past life, I was Dorcas the content writer. Now, I am becoming an organic and AI search strategist and everything on my website (and LinkedIn) has to reflect that\n\n2.) I used my new positioning to do keyword research and mapped out my website pages. My homepage targets a specific keyword, and each service I offer got its dedicated page and keyword focus. \n\n\n3.) I built a solid seo technical foundation to make the website accessible to search engines and AI crawlers. \n\nSome of the things I checked:\n    - Minimized JavaScript on website, so important content is accessible\n    - Ensure robot.txt allows AI search crawlers\n    - Indexed all pages on GSC and Bing and checked that they're discoverable\n    - Internally linked important pages so they're discoverable\n    - Updated XML sitemaps so everything exists and everything is accessible\n\nI'm still building, so this is quite interesting. I want to see what I can achieve in the next month. | 58 comments on LinkedIn", "img": "https://media.licdn.com/dms/image/v2/D4D22AQEtMpTdjl8utQ/feedshare-shrink_800/B4DaHpmQENHIAg-/0/1794920481279?e=2147483647&v=beta&t=hAyYfze1ajNJqYy-LYkwe6MgIH-LvDrZAqUMLJssdWY", "ts": "2026-11-17T13:01:24.088000+00:00", "day": "Tue Nov 17", "time": "10:01 AM", "wk": 1}, {"kind": "blog", "url": "https://www.seroundtable.com/fbi-says-seo-poisoning-led-to-28-million-in-ransomware-payments-42546.html", "name": "Search Engine Roundtable", "sub": "seroundtable.com", "col": "b", "sum": "The FBI says SEO poisoning led to $28 million in ransomware payments.", "themes": ["security"], "title": "FBI: SEO Poisoning Led To $28 Million In Ransomware Payments", "logo": "https://www.google.com/s2/favicons?domain=seroundtable.com&sz=128", "ts": "2026-11-17T09:51:00-03:00", "day": "Tue Nov 17", "time": "9:51 AM", "wk": 1}, {"kind": "x", "url": "https://x.com/rustybrick/status/2122671437320212976", "name": "Barry Schwartz", "sub": "rustybrick", "col": "g", "sum": "John Mueller: a site move does not improve a site's overall quality.", "themes": [], "avatar": "https://pbs.twimg.com/profile_images/1433030583144390668/FKJ9JkUA_bigger.jpg", "text": "Google's John Mueller said A site move doesn't improve the site's overall quality\n\nseroundtable.com/google-site-mo…", "img": null, "likes": 12, "replies": 3, "ts": "2026-11-17T12:41:22+00:00", "day": "Tue Nov 17", "time": "9:41 AM", "wk": 1}, {"kind": "blog", "url": "https://www.seroundtable.com/google-200-status-code-site-down-42542.html", "name": "Search Engine Roundtable", "sub": "seroundtable.com", "col": "b", "sum": "John Mueller: do not serve a 200 status code to Googlebot when your site is down.", "themes": [], "title": "Google On Why Serving A 200 Status Code When Your Site Is Down Is Bad", "logo": "https://www.google.com/s2/favicons?domain=seroundtable.com&sz=128", "ts": "2026-11-17T09:31:00-03:00", "day": "Tue Nov 17", "time": "9:31 AM", "wk": 1}, {"kind": "li", "url": "https://www.linkedin.com/posts/jimmypark_ai-search-is-not-the-same-as-seo-i-dont-share-7528428357869338624-oQQR/", "name": "Jimmy Park", "sub": "AEO/SEO", "col": "s", "sum": "Stop chasing high-volume prompts. In 1,455 repeat prompts, the same brands came back only 7.49% of the time.", "themes": ["tracking"], "avatar": "https://media.licdn.com/dms/image/v2/C4E03AQEDHCy9teWomg/profile-displayphoto-shrink_400_400/profile-displayphoto-shrink_400_400/0/1517674699181?e=2147483647&v=beta&t=f7eRvgoa94oPEICrMw2R8r_HtMcWKJhoaC__Pgicd9o", "text": "AI search is NOT the same as SEO. I don't care about keywords or search volume. Instead, I look at AEO Determinants.\n\nBefore:\n- Upload highest-volume visibility prompts into a tracker\n- Read whichever citations come back\n- Write articles chasing them\n- Hope you’re now cited\n\nThis is NOT the right way to do AEO.\n\nInstead of trying to show up for prompts, you need to intercept Determinants. \n\nExplained:\n\n1. Don't chase high-volume visibility prompts\n- Prompts are long-tail. Two buyers rarely type the same thing.\n- There's no reliable way to measure prompt volume.\n- Tracked prompts don't recommend the same brands consistently. We ran 1,455 prompts back to back across 14 industries, and the same set of brands came back only 7.49% of the time.\n\n2. Instead, chase determinants that appear consistently\n- A Determinant is a factor the model weighs before it makes a recommendation.\n- We measured more than 659,000 AI responses to buying prompts. In 94.4% of ChatGPT's answers, 2 or more of 5 Determinants show up together:\n\na) Audience (59.8% of answers) - who's asking, by role, company size, and situation.\nb) Use case (92.5%) - the job, plus what they already run and where they're based.\nc) Selection criteria (83.9%) - price, features, quality, support, compliance.\nd) Credibility (55.6%) - reviews, studies, certifications, expert mentions.\ne) Brand association (at least 17.1%) - how tightly the model links you to the category.\n\n- For example, I asked ChatGPT \"My TV is getting old. Which one should I buy?\" It then asked me about my budget & screen size (selection criteria), what I watch & how bright the room is (use case) before it recommended a solution.\n\n3. How to take advantage of Determinants\n\na) Map the Determinants for your category\n- Run buying prompts through ChatGPT and note every question it asks before it recommends.\n- Sort each question into a Determinant. For example, a question about role or company size is audience.\n\nb) Adjust your own pages for audience, use case, and selection criteria\n- Imagine you run AEO for a payroll tool.\n- For Audience, you would name every buyer type on your pages. Founders, HR managers, and accountants, from 3 employees to 3,000.\n- For Use Case, you would write a section for each situation a buyer is in, then answer it. Think hiring in a second state or paying contractors.\n- For Selection Criteria, you would publish what buyers compare you on. Think price per employee, whether tax filing is included, and how support works.\n\nTobias (Loud & Lexis) I have been working on this together. We’ve analyzed 659k+ AI responses and with all our findings, have published the Determinants Manifesto. \n\nLINK: https://lnkd.in/gFqTeMhu | 61 comments on LinkedIn", "img": "https://media.licdn.com/dms/image/v2/D5622AQGwiQUtW49yJw/feedshare-shrink_800/B56aHpZssjHgAg-/0/1794917190724?e=2147483647&v=beta&t=VjKlX5wtu4WhWl-PdpZtSpJZTYLWlEO8_SXcK0imojQ", "ts": "2026-11-17T12:06:31.951000+00:00", "day": "Tue Nov 17", "time": "9:06 AM", "wk": 1}, {"kind": "x", "url": "https://x.com/rustybrick/status/2122662377850110107", "name": "Barry Schwartz", "sub": "rustybrick", "col": "g", "sum": "Google publishes a help doc for Google-Agent, a new Googlebot.", "themes": ["agents"], "avatar": "https://pbs.twimg.com/profile_images/1433030583144390668/FKJ9JkUA_bigger.jpg", "text": "New Google-Agent Googlebot help document is out\n\nseroundtable.com/google-agent-b…", "img": null, "likes": 62, "replies": 4, "ts": "2026-11-17T12:05:22+00:00", "day": "Tue Nov 17", "time": "9:05 AM", "wk": 1}, {"kind": "li", "url": "https://www.linkedin.com/posts/harryclarksonbennett_heres-how-im-approaching-ai-search-and-share-7528411600567894016-NqTu/", "name": "Harry Clarkson-Bennett", "sub": "AI Search consultant", "col": "s", "sum": "How he approaches AI search with clients: it is marketing plus SEO, with a focus on entities and brand.", "themes": ["debate"], "avatar": "https://media.licdn.com/dms/image/v2/D4E03AQHUlvjex-mxdA/profile-displayphoto-scale_400_400/B4EZuSi9lcLYAg-/0/1767690200953?e=2147483647&v=beta&t=BVIEnRTtZ2EIyj8ykVpYOE-Pkusuvxynn2ZcdqmxFa8", "text": "Here's how I'm approaching AI Search and modern information retrieval with clients who care about it: https://lnkd.in/g2xTaNqn\n\nIt's really hard to describe it as anything other than marketing + SEO. I think unless you have some skin in the game, that's how you're describing it too.\n\nIt's definitely a good catalyst in getting us to focus more on entities, connections and building a brand that can withstand a loss of clicks. Building something that people actually pay attention too. \n\nI wanted to do a video to go alongside this, but baby + consulting was making that something of a challenge time-wise. \n\nEndless crying and nappy changes. The baby's not much better either. | 36 comments on LinkedIn", "img": null, "ts": "2026-11-17T10:59:56.699000+00:00", "day": "Tue Nov 17", "time": "7:59 AM", "wk": 1}, {"kind": "blog", "url": "https://openai.com/index/introducing-chatgpt-for-sales", "name": "OpenAI", "sub": "openai.com", "col": "c", "sum": "ChatGPT gets a Sales plugin and 30+ new and expanded partner plugins.", "themes": [], "title": "Introducing ChatGPT for Sales", "logo": "https://www.google.com/s2/favicons?domain=openai.com&sz=128", "ts": "2026-11-17T05:00:00-03:00", "day": "Tue Nov 17", "time": "5:00 AM", "wk": 1}, {"kind": "blog", "url": "https://www.searchenginejournal.com/google-ask-maps-appointments-business-calls/597678/", "name": "Search Engine Journal", "sub": "searchenginejournal.com", "col": "b", "sum": "Ask Maps now finds open appointments and calls local businesses for users. Check what Business Profile says about Google's automated calls.", "themes": ["agents"], "title": "Google Adds Appointment Finding & Business Calls To Ask Maps", "logo": "https://pbs.twimg.com/profile_images/2026045893024096256/LmcENam1_bigger.jpg", "ts": "2026-11-16T22:13:00-03:00", "day": "Mon Nov 16", "time": "10:13 PM", "wk": 1}, {"kind": "blog", "url": "https://blog.google/innovation-and-ai/products/gemini-notebook/interactive-sites/", "name": "Google", "sub": "blog.google", "col": "g", "sum": "Gemini Notebook now turns notes, research and sources into interactive sites.", "themes": [], "title": "Transform notes into interactive sites with Gemini Notebook", "logo": "https://pbs.twimg.com/profile_images/2042749771337564160/AgOFPEL3_bigger.jpg", "ts": "2026-11-16T13:00:00-03:00", "day": "Mon Nov 16", "time": "1:00 PM", "wk": 1}, {"kind": "blog", "url": "https://blog.google/products-and-platforms/product const PAL=["#1d9bf0","#f91880","#00ba7c","#7856ff","#ff7a00","#e0245e","#0a66c2","#17bf63"];
const hue=s=>PAL[[...s].reduce((a,c)=>a+c.charCodeAt(0),0)%PAL.length];
const ini=s=>s.split(/\s+/).filter(w=>/[A-Za-z]/.test(w[0]||"")).map(w=>w[0]).join("").slice(0,2).toUpperCase();
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>n>=1000?(n/1000).toFixed(n>=10000?0:1)+"K":String(n);
const TM=Object.fromEntries(THEMES.map(t=>[t.id,t]));
const WK=Object.fromEntries(WEEKS.map(w=>[w.i,w]));
const CHEV='<svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M5 12.5l5-5 5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const KEY="tacoFeed.folded";
let pref=false;
try{pref=localStorage.getItem(KEY)==="1";}catch(e){}
const state={theme:null,src:null,folded:pref};
function tag(id,label){return `<button class="tag" data-theme="${esc(id)}" aria-pressed="false">${esc(label)}</button>`;}
function avatar(p){
  const src=p.kind==="blog"?p.logo:p.avatar;
  const sq=p.kind==="blog"?" sq":"";
  if(!src) return `<div class="avf" style="background:${hue(p.name)}">${ini(p.name)}</div>`;
  return `<img class="av${sq}" src="${esc(src)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML='<div class=&quot;avf&quot; style=&quot;background:${hue(p.name)}&quot;>${ini(p.name)}</div>'">`;
}
function card(p,i){
  const meta=p.kind==="x"?"@"+p.sub:p.sub;
  const badge=p.kind==="x"?"𝕏":p.kind==="li"?"LinkedIn":"Blog";
  const long=(p.text||"").length>320;
  const tags=p.themes.length?`<div class="tags">${p.themes.filter(id=>TM[id]).map(id=>tag(id,TM[id].label)).join("")}</div>`:"";
  let body="";
  if(p.kind==="blog") body=`<div class="ttl">${esc(p.title)}</div><div class="tx">${esc(p.sum)}</div>${tags}`;
  else body=`<div class="sum">${esc(p.sum)}</div>${tags}<div class="tx${long?" clamp":""}" id="t${i}">${esc(p.text)}</div>${long?`<button class="more" data-t="t${i}">Show more</button>`:""}`;
  const img=p.img?`<img class="img" src="${esc(p.img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:"";
  const stats=p.kind==="x"?`<span>♡ ${fmt(p.likes||0)}</span><span>💬 ${fmt(p.replies||0)}</span>`:"";
  const link=p.kind==="x"?"View on X":p.kind==="li"?"View on LinkedIn":"Read article";
  return `<article class="card src-${p.kind}" data-src="${p.kind}" data-themes="${esc(p.themes.join(" "))}">${avatar(p)}<div style="min-width:0">
    <div class="hd"><span class="nm">${esc(p.name)}</span><span class="mt">${meta&&meta!=="@"?esc(meta)+" · ":""}${p.time}</span><span class="badge">${badge}</span></div>
    ${body}${img}<div class="ft">${stats}<a href="${esc(p.url)}" target="_blank" rel="noopener">${link} ↗</a></div></div></article>`;
}
const topBar=document.getElementById("top");
const deck=document.getElementById("deck");
let idx=0;
COLS.forEach(c=>{
  const items=P.filter(p=>p.col===c.id);
  const sec=document.createElement("section"); sec.className="col"; sec.dataset.col=c.id;
  let h=`<div class="colhead" style="--c:${c.color}"><h2>${esc(c.title)}</h2><span class="n"></span></div><div class="feed">`;
  let wk=null, day="";
  items.forEach(p=>{
    if(p.wk!==wk){
      if(wk!==null) h+="</div>";
      wk=p.wk; day="";
      const w=WK[wk]||{label:"",range:""};
      h+=`<div class="wkg" data-wk="${wk}"><div class="wk"><span>${esc(w.label)}</span><span class="wkr">${esc(w.range)}</span></div>`;
    }
    if(p.day!==day){day=p.day; h+=`<div class="day">${esc(p.day)}</div>`;}
    h+=card(p,idx++);
  });
  if(wk!==null) h+="</div>";
  sec.innerHTML=h+`<div class="empty hide">No posts</div></div>`;
  deck.appendChild(sec);
});
const deckEmpty=document.createElement("div"); deckEmpty.className="deckempty hide"; deckEmpty.textContent="No posts"; deck.appendChild(deckEmpty);
document.getElementById("themes").innerHTML=THEMES.filter(t=>!t.archived).map(t=>`<button class="theme" data-theme="${esc(t.id)}" aria-pressed="false">${esc(t.label)} <span class="c">${t.n}</span></button>`).join("");
const ov=document.getElementById("overview");
function slot(){
  const t=state.theme?TM[state.theme]:null;
  if(!t&&!TAKE.length){ov.classList.add("hide"); ov.innerHTML=""; return;}
  ov.classList.remove("hide");
  ov.classList.toggle("folded",state.folded);
  const fold=`<button class="fold" aria-expanded="${!state.folded}" aria-label="${state.folded?"Expand":"Collapse"}" title="${state.folded?"Expand":"Collapse"}">${CHEV}</button>`;
  if(t){
    const back=TAKE.length?`<button class="crumb" data-back>Key takeaways</button><span class="sep" aria-hidden="true">›</span>`:"";
    const clear=TAKE.length?"":`<button class="clr" data-back title="Clear" aria-label="Clear">×</button>`;
    ov.innerHTML=`<div class="ovh"><div class="ovt">${back}<h3>${esc(t.label)} <span class="c">${t.n}</span></h3></div>${clear}${fold}</div><ol class="brief">${(t.lines||[]).map(l=>`<li>${esc(l)}</li>`).join("")}</ol>`;
  }else{
    ov.innerHTML=`<div class="ovh"><div class="ovt"><h3>Key takeaways</h3></div>${fold}</div><ol class="take">${TAKE.map(k=>{const th=k.theme&&TM[k.theme]; return `<li>${esc(k.text)}${th?" "+tag(th.id,th.label+" · "+th.n):""}</li>`;}).join("")}</ol>`;
  }
}
const mq=window.matchMedia("(max-width:700px)");
function fit(){
  if(mq.matches){deck.style.height=""; return;}
  deck.style.height=Math.max(560,window.innerHeight-topBar.offsetHeight)+"px";
}
function apply(){
  const refocus=document.activeElement&&document.activeElement.classList.contains("fold");
  slot();
  if(refocus){const f=ov.querySelector(".fold"); if(f) f.focus();}
  document.querySelectorAll("[data-theme]").forEach(b=>{const on=b.dataset.theme===state.theme; b.classList.toggle("on",on); b.setAttribute("aria-pressed",on?"true":"false");});
  document.querySelectorAll("#filters button").forEach(b=>{const on=b.dataset.f===state.src; b.classList.toggle("on",on); b.setAttribute("aria-pressed",on?"true":"false");});
  const filtered=!!(state.theme||state.src);
  let open=0;
  document.querySelectorAll(".col").forEach(col=>{
    let shown=0;
    col.querySelectorAll(".card").forEach(c=>{
      const ok=(!state.src||c.dataset.src===state.src)&&(!state.theme||c.dataset.themes.split(" ").includes(state.theme));
      c.classList.toggle("hide",!ok); if(ok) shown++;
    });
    col.querySelectorAll(".day").forEach(d=>{
      let n=d.nextElementSibling, any=false;
      while(n&&!n.classList.contains("day")){ if(n.classList.contains("card")&&!n.classList.contains("hide")){any=true; break;} n=n.nextElementSibling; }
      d.classList.toggle("hide",!any);
    });
    col.querySelectorAll(".wkg").forEach(g=>g.classList.toggle("hide",!g.querySelector(".card:not(.hide)")));
    col.querySelector(".n").textContent=shown;
    col.querySelector(".empty").classList.toggle("hide",shown>0);
    col.classList.toggle("hide",filtered&&shown===0);
    if(!col.classList.contains("hide")) open++;
  });
  deckEmpty.classList.toggle("hide",open>0);
  fit();
}
function reset(){document.querySelectorAll(".feed").forEach(f=>{f.scrollTop=0;}); deck.scrollLeft=0;}
function clearTopic(){state.theme=null; state.folded=pref; reset(); apply();}
document.addEventListener("click",e=>{
  const tb=e.target.closest("[data-theme]");
  if(tb){
    const fromCard=!!tb.closest(".card");
    if(state.theme===tb.dataset.theme){clearTopic(); return;}
    state.theme=tb.dataset.theme; state.folded=false; reset(); apply();
    if(fromCard) window.scrollTo({top:0,behavior:"smooth"});
    return;
  }
  if(e.target.closest("[data-back]")){clearTopic(); return;}
  if(e.target.closest(".fold")){
    state.folded=!state.folded; pref=state.folded;
    try{localStorage.setItem(KEY,pref?"1":"0");}catch(err){}
    apply(); return;
  }
  const fb=e.target.closest("#filters button");
  if(fb){state.src=state.src===fb.dataset.f?null:fb.dataset.f; reset(); apply(); return;}
  const mb=e.target.closest(".more");
  if(mb){const t=document.getElementById(mb.dataset.t); const closed=t.classList.toggle("clamp"); mb.textContent=closed?"Show more":"Show less";}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&state.theme) clearTopic();});
window.addEventListener("resize",fit);
apply();
</script>
</body>
