<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Taco Feed</title>
<style>
:root{--bg:#f4f6f8;--col:#fff;--card:#fff;--line:#e3e7ec;--ink:#0f1419;--muted:#536471;--chip:#eef2f6;--chipOn:#0f1419;--chipOnInk:#fff;--accent:#1d9bf0;--sum:#f2f7fd;--sumInk:#1c3d5a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b0f14;--col:#121821;--card:#161d27;--line:#26313f;--ink:#e7edf3;--muted:#8b98a5;--chip:#1e2834;--chipOn:#e7edf3;--chipOnInk:#0b0f14;--accent:#4cb3ff;--sum:#16263a;--sumInk:#cfe3f7}}
:root[data-theme="dark"]{--bg:#0b0f14;--col:#121821;--card:#161d27;--line:#26313f;--ink:#e7edf3;--muted:#8b98a5;--chip:#1e2834;--chipOn:#e7edf3;--chipOnInk:#0b0f14;--accent:#4cb3ff;--sum:#16263a;--sumInk:#cfe3f7}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button{font:inherit;color:inherit}
.top{padding:14px 16px 12px;border-bottom:1px solid var(--line);background:var(--col)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.brand{font-weight:800;font-size:16px;margin-right:8px}
.stamp{font-weight:400;font-size:11.5px;color:var(--muted);margin-left:4px}
.themes{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.theme{border:1px solid transparent;background:var(--chip);border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.theme .c{opacity:.6;font-variant-numeric:tabular-nums}
.theme:hover{border-color:var(--line)}
.theme.on{background:var(--chipOn);color:var(--chipOnInk)}
.filters{display:flex;gap:4px}
.filters button{border:1px solid var(--line);background:var(--col);border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer}
.filters button.on{background:var(--chipOn);color:var(--chipOnInk);border-color:var(--chipOn)}
.overview{margin-top:10px;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:8px 10px 12px 14px;background:var(--card)}
.overview.folded{padding-bottom:8px}
.overview.folded ol{display:none}
.ovh{display:flex;align-items:flex-start;gap:8px}
.ovt{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;flex:1;min-width:0;min-height:30px}
.ovh h3{margin:0;font-size:15px}
.ovh .c{color:var(--muted);font-size:12.5px;font-weight:400;font-variant-numeric:tabular-nums;margin-left:2px}
.crumb{border:0;background:none;padding:0;color:var(--accent);font-weight:600;font-size:13.5px;cursor:pointer}
.crumb:hover{text-decoration:underline}
.sep{color:var(--muted)}
.fold,.clr{border:1px solid transparent;background:none;border-radius:8px;width:30px;height:30px;display:grid;place-items:center;cursor:pointer;color:var(--muted);padding:0;flex:none}
.fold:hover,.clr:hover{border-color:var(--line);color:var(--ink)}
.fold svg{transition:transform .15s}
.folded .fold svg{transform:rotate(180deg)}
.clr{font-size:20px;line-height:1}
.overview ol{margin:6px 0 0;padding-left:22px}
.overview li{margin:3px 0}
.brief{max-width:980px}
.brief li:last-child{font-weight:600}
.take{max-width:1500px}
.take li{margin:5px 0;break-inside:avoid}
.take li::marker{color:var(--muted);font-weight:700}
@media (min-width:1100px){.take{columns:2;column-gap:36px}}
.tag{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:1px 9px;font-size:12px;line-height:1.5;cursor:pointer;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:1px}
.tag:hover{border-color:var(--muted)}
.tag.on{background:var(--chipOn);color:var(--chipOnInk);border-color:var(--chipOn)}
.take .tag{margin-left:4px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 6px}
.deck{display:flex;gap:12px;padding:12px 16px 16px;overflow-x:auto;height:calc(100vh - 150px);min-height:560px}
.col{flex:0 0 360px;background:var(--col);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.colhead{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;border-top:4px solid var(--c);border-radius:14px 14px 0 0}
.colhead h2{font-size:15px;margin:0;flex:1}
.colhead .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.feed{overflow-y:auto;min-height:0;flex:1}
.wk{position:sticky;top:0;z-index:2;display:flex;align-items:baseline;gap:8px;padding:9px 14px 7px;background:var(--col);border-bottom:1px solid var(--line);font-weight:700;font-size:12.5px}
.wkr{color:var(--muted);font-weight:400}
.day{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 14px 4px}
.empty{color:var(--muted);font-size:13px;padding:18px 14px}
.deckempty{color:var(--muted);font-size:13px;padding:24px 4px}
.card{padding:12px 14px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:40px 1fr;gap:10px}
.card:hover{background:color-mix(in srgb,var(--chip) 45%,transparent)}
.av{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--chip)}
.av.sq{border-radius:10px}
.avf{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700}
.card>div{min-width:0;overflow-wrap:anywhere}
.hd{display:flex;gap:4px;align-items:baseline;flex-wrap:wrap;min-width:0}
.nm{font-weight:700}
.mt{color:var(--muted);font-size:13px}
.badge{margin-left:auto;font-size:11px;font-weight:700;color:var(--muted)}
.sum{background:var(--sum);color:var(--sumInk);border-radius:8px;padding:6px 9px;margin:6px 0;font-size:13px}
.ttl{font-weight:700;margin:4px 0 2px}
.tx{white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.tx.clamp{display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}
.src-blog .tx{margin-bottom:6px}
.more{border:0;background:none;color:var(--accent);padding:0;cursor:pointer;font-size:13px}
.img{display:block;width:100%;max-height:230px;object-fit:cover;border-radius:14px;border:1px solid var(--line);margin-top:8px}
.ft{display:flex;gap:16px;margin-top:8px;color:var(--muted);font-size:12.5px;align-items:center}
.ft a{color:var(--accent);text-decoration:none;margin-left:auto}
.hide{display:none!important}
@media (max-width:1100px){.brand{flex-basis:100%}.themes{order:3;flex-basis:100%}}
@media (max-width:700px){
  .top{padding:12px 12px 10px}
  .deck{height:auto!important;min-height:0;flex-direction:column;overflow-x:visible;padding:10px 12px 14px}
  .col{flex:none;min-width:0}
  .feed{max-height:70vh}
  .themes{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .themes::-webkit-scrollbar{display:none}
  .theme{flex:none}
  .theme,.filters button,.crumb,.take .tag{min-height:36px}
  .tags .tag{min-height:34px;padding:4px 12px}
  .fold,.clr{width:36px;height:36px}
  .ovt{min-height:36px}
  .more{min-height:32px}
}
</style>
</head>

      <button data-f="x" aria-pressed="false">X</button><button data-f="li" aria-pressed="false">LinkedIn</button><button data-f="blog" aria-pressed="false">Blogs</button>

  <section class="overview hide" id="overview"></section>
</div>
<div class="deck" id="deck"></div>

const COLS=[{"id": "g", "title": "Google AI products", "color": "#1a73e8"}, {"id": "c", "title": "ChatGPT", "color": "#10a37f"}, {"id": "t", "title": "Claude & AI tools", "color": "#d97706"}, {"id": "s", "title": "Industry & strategy", "color": "#8b5cf6"}, {"id": "b", "title": "SEO blogs", "color": "#e11d48"}];
const THEMES=[{"id": "core", "label": "Core update and spam", "lines": ["The November Core Update is still rolling out, and Google added FAQs to its back button hijacking spam policy.", "Glenn Gabe sees big surges and drops since about Nov. 13, and sites that scaled AI content drop hard. On Nov. 18, SERP trackers lost up to 98% of their data.", "Judge drops in GSC, skip Nov. 18 rank data, and audit scaled or thin pages."], "n": 10, "archived": false}, {"id": "creators", "label": "Google Search Profiles", "lines": ["Google Search Profiles are now live worldwide.", "Barry Schwartz confirmed the global rollout. Profiles can show LinkedIn and Threads accounts, and Google tests Medium pages.", "Claim and complete Search Profiles for client authors and experts."], "n": 6, "archived": false}, {"id": "tracking", "label": "AI visibility tracking", "lines": ["New data shows what drives AI citations and how fast they change.", "One ChatGPT update brought 51% more cited URLs per prompt (Kevin Indig). AIOs cite YouTube most, and ChatGPT cites Wikipedia most (DataForSEO).", "Report citation trends over weeks, not single checks, and check which prompts recommend the client."], "n": 19, "archived": false}, {"id": "traffic", "label": "AI traffic and attribution", "lines": ["Analytics undercount AI-driven visits, and zero-click searches keep growing.", "Nearly 7 in 10 US Google searches ended without a click from January to April. Cyrus Shepard sees customers name AI chatbots more than half the time when asked how they found a business.", "Add a 'How did you hear about us?' field to client forms, and flag bot traffic before you report."], "n": 9, "archived": false}, {"id": "ads", "label": "AI ads and shopping", "lines": ["Ads, shopping results and coupon codes now show inside AI answers.", "ChatGPT's agent writes its own ad queries, and OpenAI dropped its line that shopping results ignore partnerships. Writesonic found ads in 18.94% of ChatGPT answers on Nov. 16.", "Keep ad budgets on Google Search for now, and check client coupon and product prompts."], "n": 17, "archived": false}, {"id": "local", "label": "Local SEO and AI", "lines": ["AI tools now use more local signals than the map pack.", "Whitespark found the business website in 86% of Maps Web Results across 21,000+ businesses. Since Nov. 16, Ask Maps can call local businesses for users.", "Keep client websites and citations complete, check GBP call settings, and get reviews beyond Google."], "n": 9, "archived": false}, {"id": "aimode", "label": "AI Mode inside Search", "lines": ["Google keeps adding to AI Mode: a sidebar with past chats, Dive Deeper links and Connected Apps.", "Google also tests removing AI Mode from the top navigation. Desktop queries of 5+ words grew from 29.3% to 34.8% in a year (DataForSEO).", "Do not opt client sites out of AI features, since that cut organic clicks in Cyrus Shepard's test."], "n": 12, "archived": false}, {"id": "hydrogen", "label": "Gemini 4 Hydrogen in Search", "lines": ["Google moved Search to Gemini 4 Hydrogen on Nov. 17, with better intent understanding and more query fan-out.", "AIOs now quote social posts and articles and place the first inline link lower. Only 51.8% put it in the first third of the answer on Nov. 20, down from 76.8% in September (David Konitzny).", "Recheck AIO citations for priority keywords, and answer the follow-up questions that fan-out asks."], "n": 11, "archived": false}, {"id": "agents", "label": "AI agents and crawlers", "lines": ["Google and Microsoft now build crawlers, tools and test webs for AI agents.", "Google published a Google-Agent help doc and built a test web for agents. Ask Maps can call businesses, and Connected Apps let users call a business's MCP from Search.", "Check robots.txt rules and logs for Google-Agent, and see which clients should apply for Connected Apps."], "n": 13, "archived": false}, {"id": "debate", "label": "SEO vs GEO debate", "lines": ["Big brands say SEO is dead, but SEO experts show AI search still runs on SEO basics.", "Salesforce's CEO said 'Goodbye SEO', while OpenAI hires a B2B SEO and AEO lead at $239k to $265k. Neil Patel says Google Search ignores special AI schema and llms.txt files.", "Keep client budgets on SEO fundamentals, and skip GEO add-ons that Google ignores."], "n": 16, "archived": false}, {"id": "models", "label": "New model launches", "lines": ["Google released Gemini 4 Neon, after new model families from OpenAI and Microsoft.", "Gemini 4 Neon use on Perplexity grew 10.6% a day, and Marie Haynes now uses it for most work. OpenAI released GPT-6.2 Astra and Sol, and Microsoft introduced seven MAI models.", "Retest saved prompts on the new models, since answers and sources change."], "n": 6, "archived": false}, {"id": "hub", "label": "ChatGPT Business Hub", "lines": ["ChatGPT Business Hub gives real data, but very little of it, and it now connects to ChatGPT Ads accounts.", "Barry Schwartz still has zero data after a week. Malte Landwehr says it counts a citation as a mention even when the brand is not named.", "One account got 17 clicks that converted at 12%. Do not use these numbers as benchmarks yet."], "n": 4, "archived": false}, {"id": "gsc", "label": "Search Console changes", "lines": ["The Search Analytics API now labels queries as branded or non-branded and adds multimodal search data.", "Lily Ray got a warning pop-up after one Request Indexing click, and Kevin Indig sees bot traffic in GSC for many clients.", "Pull non-branded clicks from the API, and flag bot spikes before you report growth."], "n": 3, "archived": false}, {"id": "security", "label": "Plugin and script security", "lines": ["Four security stories touch client sites this week.", "WordPress 7.1.5 fixes 18 flaws, Rank Math had 16 in 2026, an Optimizely script carried malware to 178 organizations, and the FBI tied SEO poisoning to $28 million in ransomware payments.", "Update WordPress core and Rank Math, and review third-party scripts on client sites."], "n": 4, "archived": false}];
const TAKE=[{"theme": "core", "text": "The November Core Update is still rolling out, and SERP trackers lost up to 98% of their data on Nov. 18. Judge ranking drops in GSC before you report them."}, {"theme": "creators", "text": "Google Search Profiles are now live worldwide and can show LinkedIn and Threads accounts. Claim and complete profiles for client authors and experts."}, {"theme": "tracking", "text": "AI citations change with each model update. One ChatGPT update brought 51% more cited URLs per prompt, so report citation trends over weeks, not single checks."}, {"theme": "traffic", "text": "Analytics miss most AI-driven visits. Customers name AI chatbots more than half the time when asked how they found a business, so add a 'How did you hear about us?' field to client forms."}, {"theme": "ads", "text": "AI answers now show ads, shopping results and coupon codes. Check how e-commerce clients show up for product and coupon prompts."}, {"theme": "local", "text": "Ask Maps can now call local businesses to check hours and prices. Check the GBP call setting for each local client and brief their staff."}];
const WEEKS=[{"i": 0, "label": "This week", "range": "Nov 23 to 29"}, {"i": 1, "label": "Last week", "range": "Nov 16 to 22"}, {"i": 2, "label": "2 weeks ago", "range": "Nov 9 to 15"}];
const P=[{"kind": "x", "url": "https://x.com/glenngabe/status/2124913410651344979", "name": "Glenn Gabe", "sub": "glenngabe", "avatar": "https://pbs.twimg.com/profile_images/1939273879274287104/XDnMSJi5_bigger.jpg", "text": "But will many people connect these to Personal Intelligence? -> Get more helpful Search responses by securely opting in to connect Google Wallet, Drive, and the Gemini app to Personal Intelligence in AI Mode\n\n\"Today, Search is getting even more tailored with the ability to", "img": null, "likes": 4, "replies": 5, "ts": "2026-11-23T17:10:10+00:00", "col": "g", "sum": "Google now lets users connect Google Wallet, Drive and the Gemini app to Personal Intelligence in AI Mode for more tailored answers. Glenn Gabe doubts many people will turn it on.", "themes": ["aimode"], "day": "Mon Nov 23", "time": "2:10 PM", "wk": 0}, {"kind": "x", "url": "https://x.com/lilyraynyc/status/2124905288398499900", "name": "Lily Ray 😏", "sub": "lilyraynyc", "avatar": "https://pbs.twimg.com/profile_images/1935460090821189632/UvkORAsU_bigger.jpg", "text": "Hey Google:\n\nCan you provide a way for Creators using Google's new Creator Profiles to dispute \"links that violate our community guidelines\"?\n\nThere is nothing \"sexually explicit\" anywhere on my Substack.\n\nMy theory is this probably (once again) has to do with the adult film star", "img": "https://pbs.twimg.com/media/HX0toR4XsAAoxHy.jpg", "likes": 6, "replies": 1, "ts": "2026-11-23T16:37:54+00:00", "col": "g", "sum": "Lily Ray asks Google for a way to dispute links that Creator Profiles flag as against community guidelines. Google flagged her Substack, which has no explicit content.", "themes": ["creators"], "day": "Mon Nov 23", "time": "1:37 PM", "wk": 0}, {"kind": "x", "url": "https://x.com/lilyraynyc/status/2124904683911406035", "name": "Lily Ray 😏", "sub": "lilyraynyc", "avatar": "https://pbs.twimg.com/profile_images/1935460090821189632/UvkORAsU_bigger.jpg", "text": "Oh cool - my Google Creator profile is now showing my Threads & LinkedIn accounts... this profile becomes more robust every day", "img": "https://pbs.twimg.com/media/HX0sYOZXkAATKPy.png", "likes": 12, "replies": 4, "ts": "2026-11-23T16:35:30+00:00", "col": "g", "sum": "Lily Ray's Google Creator profile now shows her Threads and LinkedIn accounts. She says the profile gets more complete every day.", "themes": ["creators"], "day": "Mon Nov 23", "time": "1:35 PM", "wk": 0}, {"kind": "x", "url": "https://x.com/TheCoolestCool/status/2124895813507920064", "name": "Ross Simmonds", "sub": "TheCoolestCool", "avatar": "https://pbs.twimg.com/profile_images/1901456296760520704/VNW4xQkG_bigger.jpg", "text": "The most underrated AI search growth channel rn is YouTube.\n\n@Ahrefs studied 75K brands & found that @YouTube mentions had the strongest correlation with brand visibility across ChatGPT, Google AI Mode & AI Overviews.\n\nIf you're investing in AEO/GEO, put YouTube to the test:\n\n→", "img": null, "likes": 13, "replies": 9, "ts": "2026-11-23T16:00:15+00:00", "col": "s", "sum": "Ross Simmonds points to an Ahrefs study of 75K brands: YouTube mentions had the strongest link to brand visibility in ChatGPT, AI Mode and AIOs. Test YouTube for clients that invest in AI search.", "themes": ["tracking"], "day": "Mon Nov 23", "time": "1:00 PM", "wk": 0}, {"kind": "x", "url": "https://x.com/glenngabe/status/2124887536661065782", "name": "Glenn Gabe", "sub": "glenngabe", "avatar": "https://pbs.twimg.com/profile_images/1939273879274287104/XDnMSJi5_bigger.jpg", "text": "1) I have not seen one manual action for back button hijacking (since most publishers have stopped this...)\n2) The FAQs are great since I've heard similar confusion about those topics. In particular:\n\n(Q) Does this policy apply to sites in Google Discover?\n(A) Yes, Discover is a", "img": null, "likes": 4, "replies": 2, "ts": "2026-11-23T15:27:21+00:00", "col": "g", "sum": "Glenn Gabe has not seen one manual action for back button hijacking yet. The new FAQs confirm that the policy also covers sites in Google Discover.", "themes": ["core"], "day": "Mon Nov 23", "time": "12:27 PM", "wk": 0}, {"kind": "x", "url": "https://x.com/Marie_Haynes/status/2124886474524958869", "name": "Marie Haynes", "sub": "Marie_Haynes", "avatar": "https://pbs.twimg.com/profile_images/1957228632415297537/fl2YY2tU_bigger.jpg", "text": "Google added a bunch of information to the spam policies about back button hijacking.\n\nBack button hijacking happens when a site manipulates browser history so clicking \"Back\" traps users on the page or redirects them elsewhere (like to an ad) instead of immediately returning", "img": "https://pbs.twimg.com/media/HX0c7E9XIAEGXlO.jpg", "likes": 3, "replies": 5, "ts": "2026-11-23T15:23:08+00:00", "col": "g", "sum": "Google added FAQs to its spam policy on back button hijacking. The policy targets sites that trap users or send them to ads when they click Back.", "themes": ["core"], "day": "Mon Nov 23", "time": "12:23 PM", "wk": 0}, {"kind": "li", "url": "https://www.linkedin.com/posts/darrenshawwhitespark_most-local-grid-rank-trackers-stop-counting-share-7530651606498058241--gSH/", "name": "Darren Shaw", "sub": "Founder, Whitespark", "avatar": "https://media.licdn.com/dms/image/v2/D5603AQGPRN78FYknrA/profile-displayphoto-shrink_400_400/profile-displayphoto-shrink_400_400/0/1685132735631?e=2147483647&v=beta&t=UqYA3gtwvph8Yb0r_rahU1g5IkXAz_R8M-wzWwu2sag", "text": "Most local grid rank trackers stop counting at position 20. If your client ranks 25th, the report just says \"20+.\" One agency, Clixsy, ran into this with BrightLocal.\n \nTheir costs kept increasing with every new client, and the geogrid scans couldn't show where a business ranked past 20. A client could be ranking 25 and nobody would know.\n \nThey switched from BrightLocal to Whitespark, which tracks to position 100. Now they can see a client’s ranking move from 70 to 25, which is valuable progress worth reporting!\n \nAlso, they are saving a bundle. They now pay about HALF of what they used to, and get way more data for it.\n \nOh, and you should know that this rank tracker is NOT affected by the poisoned SERPs issue, because we track Maps, not organic.\n \nIt’s probably time for you to upgrade your local rank tracker. You can do that at whitespark*ca/local-ranking-grids", "img": "https://media.licdn.com/dms/image/v2/D5622AQFVFmV74m3Nqw/feedshare-shrink_800/B56aII_uorHMAg-/0/1795447255328?e=2147483647&v=beta&t=vedXLfzgyB6wXnmtO7ib4LW-X-187_R6dC-6Xbws_rw", "ts": "2026-11-23T15:20:55.730000+00:00", "col": "s", "sum": "Most local grid rank trackers stop counting at position 20, so a move from 70 to 25 never shows. Whitespark's grids track to position 100.", "themes": ["local"], "day": "Mon Nov 23", "time": "12:20 PM", "wk": 0}, {"kind": "li", "url": "https://www.linkedin.com/posts/jimmypark_dataforseo-just-shared-what-chatgpt-google-share-7530646770335395840-swi5/", "name": "Jimmy Park", "sub": "AEO/SEO, Opascope", "avatar": "https://media.licdn.com/dms/image/v2/C4E03AQEDHCy9teWomg/profile-displayphoto-shrink_400_400/profile-displayphoto-shrink_400_400/0/1517674699181?e=2147483647&v=beta&t=f7eRvgoa94oPEICrMw2R8r_HtMcWKJhoaC__Pgicd9o", "text": "DataForSEO just shared what ChatGPT & Google cite\n\nThey're rewarding DIFFERENT sites. Results below:\n\nGoogle AI Overviews (share among its top 30 sites, calculated from DataForSEO's data):\n1. YouTube (25.5%)\n2. Reddit, Inc. (12.3%)\n3. Facebook (10.0%)\n4. Wikipedia (9.8%)\n5. Google (7.8%)\n6. Instagram (5.9%)\n\nChatGPT (share among its top 30 sites, calculated from DataForSEO's data):\n1. Wikipedia (31.1%)\n2. Reddit (20.7%)\n3. Fandom (4.3%)\n4. Britannica Education (3.1%)\n5. The National Institutes of Health (3.0%)\n6. Healthline Media (2.3%)\n\nThere is a BIG difference in who's being cited.\n\nI'm confident the difference is due to intent:\n→ People ask AI Overviews Google-type questions. I'd expect \"best Bluetooth speakers\" to pull Amazon (no.9 on Google) and a celebrity's name to pull Facebook, Instagram and TikTok (no.10 on Google).\n→ Deeper research and problem solving goes to ChatGPT. Someone who wants a lawyer's trust document reviewed asks ChatGPT, which fits LegalClarity at no.7. Health research explains NIH and Healthline at no.5 and no.6.\n\nMy bet is if you ran the same study on Gemini or Claude, the list would look closer to ChatGPT's and Amazon would drop.\n\nI wouldn't build a separate strategy for Google and ChatGPT off these lists. Work out the intent behind what your buyer searches, then check which sites get cited for that intent and whether your brand appears on those sites.", "img": "https://media.licdn.com/dms/image/v2/D5622AQGE8WIT3kJTPQ/feedshare-shrink_800/B56aII7VeNIEAg-/0/1795446102227?e=2147483647&v=beta&t=MCydJiqh0aZBhLki0URxt6eTtn-Npy-k1mNuRJ3o0S8", "ts": "2026-11-23T15:01:42.699000+00:00", "col": "s", "sum": "DataForSEO data shows AIOs and ChatGPT cite different sites. AIOs cite YouTube (25.5%) and Reddit (12.3%) most, and ChatGPT cites Wikipedia (31.1%) and Reddit (20.7%) most.", "themes": ["tracking"], "day": "Mon Nov 23", "time": "12:01 PM", "wk": 0}, {"kind": "li", "url": "https://www.linkedin.com/posts/adriaan-dekker-google-ads-freelancer-rotterdam_news-share-7530643590625054721-96YI/", "name": "Adriaan Dekker", "sub": "Google Ads specialist, Dertien11", "avatar": "https://media.licdn.com/dms/image/v2/D4E03AQFRJSFw00197w/profile-displayphoto-scale_400_400/B4EZ83_ueTJUAg-/0/1783350883806?e=2147483647&v=beta&t=Vch7Hdz1KGOAybCUMna4KMRGweDsmqcW3S2fbbIcA2I", "text": "OpenAI no longer says ChatGPT product results ignore its partnerships.\n\nThe Shopping with ChatGPT Search help page used to say results are picked independently and not influenced by any OpenAI partnerships. That line is gone.\n\nThe new wording only says product results are not ads, and points to a section describing how products and merchants are selected.\n\nNo word yet on whether anything changed in how products are actually ranked. Only the documentation changed.\n\nSpotted by Juozas Kaziukėnas, via Search Engine Roundtable.\n\n#news", "img": null, "ts": "2026-11-23T14:49:04.597000+00:00", "col": "c", "sum": "OpenAI removed the line that said ChatGPT shopping results ignore its partnerships. The help page now only says product results are not ads.", "themes": ["ads"], "day": "Mon Nov 23", "time": "11:49 AM", "wk": 0}, {"kind": "x", "url": "https://x.com/glenngabe/status/2124862137285677115", "name": "Glenn Gabe", "sub": "glenngabe", "avatar": "https://pbs.twimg.com/profile_images/1939273879274287104/XDnMSJi5_bigger.jpg", "text": "And maybe most importantly, how does Liz view the impact to clicks to publishers and the open web based on AI answers and how Search is changing. \n\nFrom Liz: What we generally see is that people don't just want AI. They want AI and the web. They want specific types of content on", "img": "https://pbs.twimg.com/media/HX0GyMsWMAARK93.jpg", "likes": 2, "replies": 3, "ts": "2026-11-23T13:46:26+00:00", "col": "g", "sum": "Liz Reid, head of Google Search, says people do not want AI alone. They want AI and the web, and Google wants AI answers to keep sending clicks to publishers.", "themes": ["traffic"], "day": "Mon Nov 23", "time": "10:46 AM", "wk": 0}, {"kind": "x", "url": "https://x.com/glenngabe/status/2124855502584639695", "name": "Glenn Gabe", "sub": "glenngabe", "avatar": "https://pbs.twimg.com/profile_images/1939273879274287104/XDnMSJi5_bigger.jpg", "text": "Interesting: ChatGPT's Agent Writes Its Own Queries to Serve Ads. Advertisers Don’t Get to See Them\n\n\"When a user writes a prompt in ChatGPT, an AI agent OpenAI calls the orchestrator reads the conversation and works out what the person might want to buy. It can also draw on the", "img": "https://pbs.twimg.com/media/HX0AyTBWoAALG0N.jpg", "likes": 7, "replies": 6, "ts": "2026-11-23T13:20:04+00:00", "col": "c", "sum": "An AI agent inside ChatGPT reads the conversation, guesses what the user wants to buy and writes its own ad queries. Advertisers do not see these queries.", "themes": ["ads"], "day": "Mon Nov 23", "time": "10:20 AM", "wk": 0}, {"kind": "x", "url": "https://x.com/Kevin_Indig/status/2124852333066469766", "name": "Kevin_Indig", "sub": "Kevin_Indig", "avatar": "https://pbs.twimg.com/profile_images/2028121904565960705/y0y5hAES_bigger.jpg", "text": "I just published a Growth Memo about how much new model releases and interface changes impact mentions and citations on AI Engines.\n\nFor example, an update of ChatGPT 5.6 on August 6th led to 51% more cited URLs per prompt and 14% more mentions (I explain why in the Memo).\n\nA", "img": "https://pbs.twimg.com/media/HXz92SPXkAAQfau.jpg", "likes": 9, "replies": 19, "ts": "2026-11-23T13:07:28+00:00", "col": "s", "sum": "Kevin Indig measured how model releases and interface changes move AI citations. One ChatGPT 5.6 update on Aug. 6 brought 51% more cited URLs per prompt and 14% more mentions.", "themes": ["tracking"], "day": "Mon Nov 23", "time": "10:07 AM", "wk": 0}, {"kind": "li", "url": "https://www.linkedin.com/posts/joshua-blyskal_do-citation-chips-in-chatgpt-actually-drive-ugcPost-7530614570118479872-zjij/", "name": "Josh Blyskal", "sub": "Head of Insights, Profound", "avatar": "https://media.licdn.com/dms/image/v2/D4E03AQGqCGmYvlT-ww/profile-displayphoto-scale_400_400/B4EaGCoVZeKUAg-/0/1793192974805?e=2147483647&v=beta&t=SQr-Arzq8cACZ9aUHWJ8NGd-J8NiUFzEkikxKDgfFFY", "text": "Do citation chips in ChatGPT actually drive traffic? Since May 7, when ChatGPT started hyperlinking brand names inline, I think everyone (me included) assumed the chips rly didn’t. I pulled 4,954 human visits from ChatGPT to our own site last week to see where people actually land, here’s what’s up:\n\n- 38% of visits landed on pages that mostly show up as citation chips: and they land on 100s of different pages (guides, research, product pages, best-of lists)\n\n- No single one of those pages got more than ~2%, so it’s a very very long tail\n\n- 50% of visits landed on pages ChatGPT cites inline (47% on the homepage, 3% on other pages)\n\n- The rest of people: 6% landed on the pricing page, which shows up both ways, and 6% on other pages\n\n__________\n\nSo what's up here?\n\nChatGPT pulls the value out of your guides and comparison pages and puts it right in the answer, so those pages are already doing their job by informing the answer and getting cited.\n\nI honestly assumed that’s where their job ended, bc nobody clicks the footnotes, right?\n\nWell, 38% of visits says people still go check the details for themselves.\n\nMy mental framework is that the two citation styles go hand in hand: the content in the chips informs the answer, so it has a say in whether you get mentioned inline at all.\n\nAnd the traffic from those chips is an added bonus (esp if you also assumed they weren’t rly driving any).\n\n__________\n\nSo you can drive traffic in two ways:\n\n1.) by being visible in the answer, through the inline link\n2.) by getting cited, through the chips\n\nAs marketers, I think the next steps are pretty simple:\n\n1.) Pull your ChatGPT sessions by landing page and look at the split between homepage and other pages (roughly: how much comes from being named in the answer vs being cited by it)\n2.) Open a few of your long-tail pages as if you just clicked through from an answer: do they say who you are, and is there anywhere to go next?\n\nFWIW this is one site (ours), and ChatGPT traffic is still a small slice of anyone’s total, so this is very much a sense check and something to use as a touchpoint.\n\nWhat share of your ChatGPT traffic is from your homepage vs. elsewhere? 👀", "img": null, "ts": "2026-11-23T12:53:45.569000+00:00", "col": "c", "sum": "Profound checked 4,954 visits from ChatGPT to its own site. 38% landed on pages that show up as citation chips, so the chips do send traffic.", "themes": ["traffic"], "day": "Mon Nov 23", "time": "9:53 AM", "wk": 0}, {"kind": "x", "url": "https://x.com/glenngabe/status/2124847812508532783", "name": "Glenn Gabe", "sub": "glenngabe", "avatar": "https://pbs.twimg.com/profile_images/1939273879274287104/XDnMSJi5_bigger.jpg", "text": "Again, we have seen Google test removing AI Mode from the top navigation and the 'Ask anything' field in AIOs -> How Apple Got Caught Up in Google Search Ads Slowdown\n\n\"Growth in Apple’s services revenue, which includes a cut of ad revenue Google makes when people search on", "img": "https://pbs.twimg.com/media/HXz5xt9XgAAuJa8.jpg", "likes": 14, "replies": 3, "ts": "2026-11-23T12:49:30+00:00", "col": "g", "sum": "Google again tests removing AI Mode from the top navigation and the 'Ask anything' field from AIOs. Glenn Gabe links the tests to slower Google search ad revenue.", "themes": ["aimode", "ads"], "day": "Mon Nov 23", "time": "9:49 AM", "wk": 0}, {"kind": "x", "url": "https://x.com/rustybrick/status/2124845750118994122", "name": "Barry Schwartz", "sub": "rustybrick", "avatar": "https://pbs.twimg.com/profile_images/1433030583144390668/FKJ9JkUA_bigger.jpg", "text": "Google Search Profiles make it easier to add your LinkedIn profile -via @AndellDam\n\nseroundtable.com/google-search-…", "img": null, "likes": 12, "replies": 2, "ts": "2026-11-23T12:41:19+00:00", "col": "g", "sum": "Google Search Profiles now make it easier to add a LinkedIn profile. You can add it by hand when Google does not find it.", "themes": ["creators"], "day": "Mon Nov 23", "time": "9:41 AM", "wk": 0}, {"kind": "x", "url": "https://x.com/rustybrick/status/2124843250368356438", "name": "Barry Schwartz", "sub": "rustybrick", "avatar": "https://pbs.twimg.com/profile_images/1433030583144390668/FKJ9JkUA_bigger.jpg", "text": "Bing is reverting and now testing Copilot Answers instead of AI Overviews - hat tip @b4k_khushal\n\nseroundtable.com/bing-ai-overvi…", "img": null, "likes": 4, "replies": 5, "ts": "2026-11-23T12:31:23+00:00", "col": "t", "sum": "Bing now tests the name Copilot Answers in place of AI Overviews for its AI answers.", "themes": [], "day": "Mon Nov 23", "time": "9:31 AM", "wk": 0}, {"kind": "x", "url": "https://x.com/noahiglerSEO/status/2124840900706640281", "name": "Noah Igler", "sub": "noahiglerSEO", "avatar": "https://pbs.twimg.com/profile_images/1937965709423734784/dX1I6eQi_bigger.jpg", "text": "This setting controls whether Google can call your business for a homeowner.\n\nSince Nov 16, Ask Maps in Google Maps can look for home repair appointments and call local businesses to check open times and prices for the customer.\n\nWhat your CSR says on that call is what goes back", "img": "https://pbs.twimg.com/media/HXzzigJXgAANn6x.jpg", "likes": 10, "replies": 16, "ts": "2026-11-23T12:22:03+00:00", "col": "g", "sum": "Since Nov. 16, Ask Maps can call local businesses to check open times and prices for a homeowner. A GBP setting controls these calls, and what staff say goes back to the customer.", "themes": ["local", "agents"], "day": "Mon Nov 23", "time": "9:22 AM", "wk": 0}, {"kind": "x", "url": "https://x.com/semrush/status/2124822649784131587", "name": "Semrush", "sub": "semrush", "avatar": "https://pbs.twimg.com/profile_images/2032094582213627906/KHSAmydp_bigger.jpg", "text": "Your buyers are asking ChatGPT which bags fit under a plane seat, Googling airline size limits, and comparing hard-shell spinners at 2 a.m.\n\nThat’s not a just a keyword or a prompt. That’s a whole topic. And Semrush now tracks your visibility at the topic level, with keyword", "img": "https://pbs.twimg.com/media/HXzi8CuXEAA7Dke.png", "likes": 9, "replies": 6, "ts": "2026-11-23T11:09:31+00:00", "col": "s", "sum": "Semrush now tracks visibility at the topic level, with keywords and AI prompts in one report.", "themes": ["tracking"], "day": "Mon Nov 23", "time": "8:09 AM", "wk": 0}, {"kind": "li", "url": "https://www.linkedin.com/posts/davidkonitzny_google-ai-overviews-love-links-just-not-share-7530547777261559808-2bQY/", "name": "David Konitzny", "sub": "", "avatar": "https://media.licdn.com/dms/image/v2/D4E03AQFo48OP-Aa6_g/profile-displayphoto-scale_400_400/B4EZ9wE1jkH8Ak-/0/1784291745465?e=2147483647&v=beta&t=HEN65RKo23s63cE66-RBmfI_gaR7W9DscwJMN25YzmE", "text": "Google AI Overviews love links. Just not at the top anymore. 💔\n\nIn my previous post, I showed how Google is adding more inline links to its AI answers.\n\nNow I wanted to look at something else: where the first link actually appears.\n\nI analysed 88M+ chats to track the position of the first inline link in Google AI Overviews. These are links placed directly in the answer text, not the source cards.\n\n👉 On September 21, 76.8% of AI Overviews had their first inline link in the first third of the answer.\n\n👉 By November 20, that number had dropped to 51.8%.\n\nThat's a decline of 25 percentage points in just two months, with two noticeable drops around October 9 and October 30.\n\nToday, only about half of AI Overviews place their first inline link in the opening third of the answer.\n\n💡 More links don't necessarily mean more visibility. Even as Google adds more links overall, users may have to read further before encountering the first one. | 20 comments on LinkedIn", "img": "https://media.licdn.com/dms/image/v2/D4E22AQEuUgtjE_Y1uw/feedshare-shrink_800/B4EaIHhS91JwAg-/0/1795422499395?e=2147483647&v=beta&t=ouNp7J9VvPZmHmWR862-DEZTEwsn_hAz-76buop5ZMs", "ts": "2026-11-23T08:28:20.911000+00:00", "col": "g", "sum": "David Konitzny tracked 88M+ AIO answers. On Sept. 21, 76.8% put the first inline link in the first third of the answer. By Nov. 20, only 51.8% did.", "themes": ["hydrogen", "tracking"], "day": "Mon Nov 23", "time": "5:28 AM", "wk": 0}, {"kind": "x", "url": "https://x.com/AravSrinivas/status/2124765417378099414", "name": "Aravind Srinivas", "sub": "AravSrinivas", "avatar": "https://pbs.twimg.com/profile_images/2099903483457703936/U-W6QQk__bigger.jpg", "text": "Gemini 4 Neon has compounded at +10.6%/day in Ask (fast search) queries and +15.0%/day in Computer (agentic tasks) user-generated on Perplexity, since its first full day (Nov 19 to Nov 22, 22-hour matched basis).", "img": null, "likes": 1235, "replies": 145, "ts": "2026-11-23T07:22:06+00:00", "col": "t", "sum": "Perplexity's CEO says Gemini 4 Neon use on Perplexity grew 10.6% a day in fast search and 15.0% a day in agent tasks from Nov. 19 to Nov. 22.", "themes": ["models"], "day": "Mon Nov 23", "time": "4:22 AM", "wk": 0}, {"kind": "x", "url": "https://x.com/Reuters/status/2124730931629985879", "name": "Reuters", "sub": "Reuters", "avatar": "https://pbs.twimg.com/profile_images/1874154135869616128/nJDmubGJ_bigger.jpg", "text": "California Attorney General Rob Bonta said that he had filed a lawsuit against OpenAI ‘for failing to keep its models secure and putting public safety at risk’ reut.rs/4iTHWGC", "img": null, "likes": 99, "replies": 25, "ts": "2026-11-23T05:05:04+00:00", "col": "c", "sum": "California's Attorney General sued OpenAI. He says OpenAI did not keep its models secure and put public safety at risk.", "themes": [], "day": "Mon Nov 23", "time": "2:05 AM", "wk": 0}, {"kind": "x", "url": "https://x.com/rustybrick/status/2124662300544049303", "name": "Barry Schwartz", "sub": "rustybrick", "avatar": "https://pbs.twimg.com/profile_images/1433030583144390668/FKJ9JkUA_bigger.jpg", "text": "Google StarSearch, AIGC, Zero-History Discovery, Feed Ranking, and more surface in Google Discover job listing - via @AndellDam\n\nseroundtable.com/google-starsea…", "img": null, "likes": 17, "replies": 2, "ts": "2026-11-23T00:32:21+00:00", "col": "g", "sum": "A Google Discover job listing names StarSearch, AIGC, Zero-History Discovery and feed ranking work. It shows where Discover can go next for publishers.", "themes": [], "day": "Sun Nov 22", "time": "9:32 PM", "wk": 1}, {"kind": "x", "url": "https://x.com/AndellDam/status/2124647968150024348", "name": "Damien Andell", "sub": "AndellDam", "avatar": "https://pbs.twimg.com/profile_images/1786292725005873152/GuGN2FmX_bigger.jpg", "text": "Google's \"Search Profile\" is testing Medium pages. We saw this test for Bluesky in October, and now we're seeing Medium pages dedicated to a creator.\n\nHere's an example on a \"Search Profile\" page on Medium.\n\nCC @gaganghotra_ @rustybrick \n\n#searchprofiles", "img": "https://pbs.twimg.com/media/HXxD5ptWwAAFy7F.jpg", "likes": 7, "replies": 0, "ts": "2026-11-22T23:35:24+00:00", "col": "g", "sum": "Google tests Medium pages in Search Profiles, after a Bluesky test in October.", "themes": ["creators"], "day": "Sun Nov 22", "time": "8:35 PM", "wk": 1}, {"kind": "x", "url": "https://x.com/rustybrick/status/2124645679695896658", "name": "Barry Schwartz", "sub": "rustybrick", "avatar": "https://pbs.twimg.com/profile_images/1433030583144390668/FKJ9JkUA_bigger.jpg", "text": "Connect your ChatGPT Business Hub with your ChatGPT Ads account - via @CalebTennenbaum\n\nseroundtable.com/chatgpt-busine…", "img": null, "likes": 16, "replies": 12, "ts": "2026-11-22T23:26:18+00:00", "col": "c", "sum": "You can now connect ChatGPT Business Hub to a ChatGPT Ads account.", "themes": ["hub", "ads"], "day": "Sun Nov 22", "time": "8:26 PM", "wk": 1}, {"kind": "x", "url": "https://x.com/neilpatel/status/2124639130453672146", "name": "Neil Patel", "sub": "neilpatel", "avatar": "https://pbs.twimg.com/profile_images/1502690164744732674/3w3KcZkt_bigger.jpg", "text": "Most brands check one thing. Did AI mention us? That’s the wrong question. The right question is who it’s recommending you to. Say you sell to coffee chains with 20 locations. Ask AI Mode for the best machines for a multi-location chain and you’re not there. Ask for budget", "img": "https://pbs.twimg.com/media/HXw8BjyWsAA-Fyy.jpg", "likes": 31, "replies": 24, "ts": "2026-11-22T23:00:17+00:00", "col": "s", "sum": "Neil Patel says 'Did AI mention us?' is the wrong question. Check which buyer prompts AI recommends you for, and where it leaves you out.", "themes": ["tracking"], "day": "Sun Nov 22", "time": "8:00 PM", "wk": 1}, {"kind": "x", "url": "https://x.com/rustybrick/status/2124634349110771901", "name": "Barry Schwartz", "sub": "rustybrick", "avatar": "https://pbs.twimg.com/profile_images/1433030583144390668/FKJ9JkUA_bigger.jpg", "text": "Google Search Profiles have rolled out globally - via @ClaraSoteras\n\nseroundtable.com/google-search-…", "img": null, "likes": 134, "replies": 15, "ts": "2026-11-22T22:41:17+00:00", "col": "g", "sum": "Google Search Profiles are now live worldwide. Before, people in most countries could not claim one.", "themes": ["creators"], "day": "Sun Nov 22", "time": "7:41 PM", "wk": 1}, {"kind": "x", "url": "https://x.com/neilpatel/status/2124578729556894090", "name": "Neil Patel", "sub": "neilpatel", "avatar": "https://pbs.twimg.com/profile_images/1502690164744732674/3w3KcZkt_bigger.jpg", "text": "Ask ChatGPT to design your living room. Next to the picture, a labeled ad shows you a couch you can buy. OpenAI is testing this with a small group of US advertisers. It says the ad stays separate from your image and doesn’t change the answers. If you sell something people can", "img": "https://pbs.twimg.com/media/HXwFF1WXkAAgvA7.jpg", "likes": 34, "replies": 4, "ts": "2026-11-22T19:00:16+00:00", "col": "c", "sum": "OpenAI tests labeled ads next to images that ChatGPT makes, with a small group of US advertisers. A room design can now show a couch to buy.", "themes": ["ads"], "day": "Sun Nov 22", "time": "4:00 PM", "wk": 1}, {"kind": "x", "url": "https://x.com/HunterLapeyre/status/2124514452708208734", "name": "Hunter Lapeyre", "sub": "HunterLapeyre", "avatar": "https://pbs.twimg.com/profile_images/2108541238668308480/ov0c-Unq_bigger.jpg", "text": "Here's what fan-out looks like for home services:\n\nA homeowner asks AI for a Fortified Roofer in New Orleans who handles the grant paperwork.\n\nTo answer that, Google goes looking for pages on Fortified roofs, the grant process, the evaluator visit, the insurance discount and", "img": null, "likes": 6, "replies": 5, "ts": "2026-11-22T14:44:51+00:00", "col": "g", "sum": "One AI question about a Fortified roofer starts searches on the roof type, the grant process and the insurance discount. Local service pages need to answer each of these.", "themes": ["local", "hydrogen"], "day": "Sun Nov 22", "time": "11:44 AM", "wk": 1}, {"kind": "li", "url": "https://www.linkedin.com/posts/jonlclark_this-is-the-cleanest-map-ive-seen-of-whose-share-7530276866847608832-sR_r/", "name": "Jon Clark", "sub": "Moving Traffic Media", "avatar": "https://media.licdn.com/dms/image/v2/D4E03AQE1NObaIBPXvw/profile-displayphoto-scale_400_400/B4EZ8.bk32IcAg-/0/1783458845421?e=2147483647&v=beta&t=V8Ea1uzb2k0ZeaMpBLprdntl78K_e9adNadib-lLqQQ", "text": "This is the cleanest map I've seen of whose model and whose index sits behind each AI search product.\n \nA few things to consider:\n \nBing's index is documented behind ChatGPT search, Microsoft Copilot, DuckDuckGo AI and Yahoo Scout, with a reported link to Meta AI too.\n \nClaude pulls from Brave Search. Brave has its own independent index, so pages Bing and Google know about aren't automatically pages Brave knows about.\n \nAnthropic's models show up inside Copilot, DuckDuckGo AI, Yahoo Scout, Alexa+ and Perplexity.\n \nAnd four products, including Apple Siri and Grok, don't disclose where their index comes from at all.\n \nAs I've said before, for anyone doing AEO work, \"AI visibility\" starts with getting crawled and indexed by more than one engine. If a page isn't in the index an assistant retrieves from, it can't be in the answer.\n \nIt's why Bing Webmaster Tools, IndexNow and AI crawler access are graded line items in our technical audits at Moving Traffic Media.\n \nWhich index is your team actually monitoring beyond Google's?\n \nFull sources and method are in the comments. Great work, Bill!", "img": "https://media.licdn.com/dms/image/v2/D5622AQE-6-JZHHhedA/feedshare-shrink_800/B56aIDq6GbIEAg-/0/1795357909726?e=2147483647&v=beta&t=5uDNM0aqxh6nz38xWXZuvq6EA6I8Bw2MiuSDo9gsx7M", "ts": "2026-11-22T14:31:50.835000+00:00", "col": "s", "sum": "Jon Clark maps which index sits behind each AI search tool. Bing feeds ChatGPT search, Copilot, DuckDuckGo AI and Yahoo, and Claude uses Brave, so check client pages in Bing and Brave too.", "themes": ["tracking"], "day": "Sun Nov 22", "time": "11:31 AM", "wk": 1}, {"kind": "x", "url": "https://x.com/wespreadjam/status/2124508844839870901", "name": "jam", "sub": "wespreadjam", "avatar": "https://pbs.twimg.com/profile_images/2119650345140006912/y5R7msRt_bigger.png", "text": "Granola, a $1.5B company on how they grew new users from AI search by 4,600% in JUST 7 months", "img": "https://pbs.twimg.com/media/HXvEtfDbMAAeemD.png", "likes": 4734, "replies": 80, "ts": "2026-11-22T14:22:34+00:00", "col": "s", "sum": "Granola, a $1.5B company, explains how it grew new users from AI search by 4,600% in 7 months. Gianluca Fiorelli says the playbook is SEO done right.", "themes": ["debate"], "day": "Sun Nov 22", "time": "11:22 AM", "wk": 1}, {"kind": "x", "url": "https://x.com/neilpatel/status/2124276731670385018", "name": "Neil Patel", "sub": "neilpatel", "avatar": "https://pbs.twimg.com/profile_images/1502690164744732674/3w3KcZkt_bigger.jpg", "text": "Some people are selling special AI schema and llms.txt files as the secret to showing up in Google’s AI results. Google Search ignores them. Save your budget. Rewrite the paragraphs that answer your most important buying questions so each one is clear, specific and useful by", "img": "https://pbs.twimg.com/media/HXrybPeWcAAmarc.jpg", "likes": 38, "replies": 23, "ts": "2026-11-21T23:00:14+00:00", "col": "s", "sum": "Some vendors sell special AI schema and llms.txt files for Google's AI results. Neil Patel says Google Search ignores them, so spend the budget on clear answers to buying questions.", "themes": ["debate"], "day": "Sat Nov 21", "time": "8:00 PM", "wk": 1}, {"kind": "x", "url": "https://x.com/neilpatel/status/2124216322489770434", "name": "Neil Patel", "sub": "neilpatel", "avatar": "https://pbs.twimg.com/profile_images/1502690164744732674/3w3KcZkt_bigger.jpg", "text": "If your traffic is down, you’re not imagining it. From January to April this year, nearly 7 in 10 US Google searches ended without a single click. Two years ago it was 6 in 10. Google is answering the question before anyone reaches your site.\n\n#ZeroClickSearch #SEO #GoogleSearch", "img": "https://pbs.twimg.com/media/HXq7fAOXIAAP7i-.jpg", "likes": 43, "replies": 19, "ts": "2026-11-21T19:00:11+00:00", "col": "s", "sum": "From January to April, nearly 7 in 10 US Google searches ended without a click. Two years ago it was 6 in 10.", "themes": ["traffic"], "day": "Sat Nov 21", "time": "4:00 PM", "wk": 1}, {"kind": "x", "url": "https://x.com/noahiglerSEO/status/2124195150825955337", "name": "Noah Igler", "sub": "noahiglerSEO", "avatar": "https://pbs.twimg.com/profile_images/1937965709423734784/dX1I6eQi_bigger.jpg", "text": "We're testing a review link that sends a share of customers to the BBB and Angi instead of Google.\n\nThe mix we're aiming for: about 85% of new reviews on Google, about 10% on Yelp and about 5% on the BBB, Angi or HomeAdvisor, depending on the trade.\n\nChatGPT and other AI answers", "img": "https://pbs.twimg.com/media/HXqoO4hWQAAi8q5.jpg", "likes": 28, "replies": 15, "ts": "2026-11-21T17:36:04+00:00", "col": "s", "sum": "Noah Igler tests a review link that sends some customers past Google: about 85% of new reviews on Google, 10% on Yelp and 5% on the BBB or Angi. AI answers read reviews from more than Google.", "themes": ["local"], "day": "Sat Nov 21", "time": "2:36 PM", "wk": 1}, {"kind": "x", "url": "https://x.com/glenngabe/status/2124157301296705709", "name": "Glenn Gabe", "sub": "glenngabe", "avatar": "https://pbs.twimg.com/profile_images/1939273879274287104/XDnMSJi5_bigger.jpg", "text": "Just saw the new \"Dive Deeper\" links in AI Mode (which Google announced in October). Blue links, thumbnails and a description. Good to see more links there. :)  \n\n\"Once you’ve gotten the lay of the land on a topic, you might want to dig deeper on interesting angles – and we want", "img": "https://pbs.twimg.com/media/HXqFejKWkAA552i.jpg", "likes": 30, "replies": 18, "ts": "2026-11-21T15:05:40+00:00", "col": "g", "sum": "AI Mode now shows Dive Deeper links with blue links, thumbnails and descriptions. Google announced them in October.", "themes": ["aimode"], "day": "Sat Nov 21", "time": "12:05 PM", "wk": 1}, {"kind": "x", "url": "https://x.com/glenngabe/status/2124147559434182763", "name": "Glenn Gabe", "sub": "glenngabe", "avatar": "https://pbs.twimg.com/profile_images/1939273879274287104/XDnMSJi5_bigger.jpg", "text": "Don't immediately trust what you see in an AI Overview (or any AI responses). Good lesson from @localseoguide  -> Google AI Overviews: Not safe for Your Money or Your Life\n\n\"Yesterday, Andrew Googled Vanguard’s customer support number. Google AI Overviews gave him a number, and", "img": null, "likes": 33, "replies": 20, "ts": "2026-11-21T14:26:57+00:00", "col": "g", "sum": "An AIO gave Andrew Shotland a phone number when he searched for Vanguard's support line, and he warns AIOs are not safe for YMYL searches. Check what AIOs show for client phone numbers.", "themes": [], "day": "Sat Nov 21", "time": "11:26 AM", "wk": 1}, {"kind": "x", "url": "https://x.com/HunterLapeyre/status/2124140525909618845", "name": "Hunter Lapeyre", "sub": "HunterLapeyre", "avatar": "https://pbs.twimg.com/profile_images/2108541238668308480/ov0c-Unq_bigger.jpg", "text": "Semrush published a study this week on AI Overviews and the map pack. If you run a roofing, HVAC or plumbing company, look at it before you change anything on your site.\n\nAn agency owner, Chris Shirlow, ran 480 signed-out Google searches for local services across 12 US markets", "img": null, "likes": 6, "replies": 11, "ts": "2026-11-21T13:59:00+00:00", "col": "s", "sum": "Hunter Lapeyre points to a new Semrush study on AIOs and the map pack, and to 480 signed-out searches across 12 US markets. Local service sites should read it before they change pages.", "themes": ["local"], "day": "Sat Nov 21", "time": "10:59 AM", "wk": 1}, {"kind": "x", "url": "https://x.com/neilpatel/status/2123914385009619180", "name": "Neil Patel", "sub": "neilpatel", "avatar": "https://pbs.twimg.com/profile_images/1502690164744732674/3w3KcZkt_bigger.jpg", "text": "One question in. Several searches out. That’s query fan-out, and it changes what ranking means. A cafe owner asks which espresso machine to buy. Google may also look up boiler types, water filtration and service contract costs. If your site is one product page with a spec sheet,", "img": "https://pbs.twimg.com/media/HXmo34PWUAAwPLi.jpg", "likes": 32, "replies": 7, "ts": "2026-11-20T23:00:24+00:00", "col": "g", "sum": "One question can start several searches through query fan-out. Neil Patel says a single product page now competes with pages that also answer the follow-up questions.", "themes": ["hydrogen"], "day": "Fri Nov 20", "time": "8:00 PM", "wk": 1}, {"kind": "x", "url": "https://x.com/CyrusShepard/status/2123908515349823622", "name": "Cyrus SEO", "sub": "CyrusShepard", "avatar": "https://pbs.twimg.com/profile_images/2107302110866063360/UmdziLzu_bigger.jpg", "text": "AI Attribution Paradox: Analytics show shockingly little AI traffic, but customers asked \"How did you hear about us?\" answer AI chatbots >50% of the time", "img": null, "likes": 72, "replies": 55, "ts": "2026-11-20T22:37:05+00:00", "col": "s", "sum": "Cyrus Shepard calls it the AI attribution paradox: analytics show little AI traffic, but customers name AI chatbots more than half the time when asked how they heard about you.", "themes": ["traffic"], "day": "Fri Nov 20", "time": "7:37 PM", "wk": 1}, {"kind": "x", "url": "https://x.com/Marie_Haynes/status/2123877071499739629", "name": "Marie Haynes", "sub": "Marie_Haynes", "avatar": "https://pbs.twimg.com/profile_images/1957228632415297537/fl2YY2tU_bigger.jpg", "text": "Google brought more Connected Apps to Search. As a reminder, this is the system that you can apply for that lets people \"@\" your business MCP from within Search or a Gemini conversation to use your company's tools and functionality in their conversation.\n\nCan you see where Search", "img": null, "likes": 37, "replies": 19, "ts": "2026-11-20T20:32:08+00:00", "col": "g", "sum": "Google added more Connected Apps to Search. Businesses can apply so users can '@' their MCP from Search or Gemini and use their tools in the chat.", "themes": ["aimode", "agents"], "day": "Fri Nov 20", "time": "5:32 PM", "wk": 1}, {"kind": "x", "url": "https://x.com/aleyda/status/2123874857037242559", "name": "Aleyda Solis 🕊️", "sub": "aleyda", "avatar": "https://pbs.twimg.com/profile_images/1803039284108083200/i0blVR4I_bigger.jpg", "text": "How does Google's AI see your brand? You can check it out for free thanks to @HannsKronenberg  new tool: Google Oracle, that asks Google's decision model Gemini Decision 1, what sets it apart, and how it is positioned compared with other brands.\n\n* Assess your own brand through", "img": "https://pbs.twimg.com/media/HXmE1qsWQAA36uZ.jpg", "likes": 130, "replies": 23, "ts": "2026-11-20T20:23:20+00:00", "col": "s", "sum": "Hanns Kronenberg's free Google Oracle tool asks Google's Gemini Decision 1 model how it sees a brand and how it compares with rivals.", "themes": ["tracking"], "day": "Fri Nov 20", "time": "5:23 PM", "wk": 1}, {"kind": "blog", "url": "https://www.searchenginejournal.com/salesforce-ceo-goodbye-seo-salesforce-seo-guide/598343/", "name": "Search Engine Journal", "sub": "searchenginejournal.com", "title": "Salesforce CEO Says ‘Goodbye SEO.’ Salesforce’s SEO Guide Disagrees", "logo": "https://www.google.com/s2/favicons?domain=searchenginejournal.com&sz=128", "ts": "2026-11-20T20:20:52+00:00", "col": "b", "sum": "Salesforce CEO Marc Benioff posted \"Goodbye SEO\" on X to promote Palmata, its AI visibility tool. But a Salesforce guide linked from the Palmata page says SEO \"is still the foundation,\" and Aleyda Solis says AI search uses the same fundamentals. Show clients this guide when they ask if SEO still matters.", "themes": ["debate"], "day": "Fri Nov 20", "time": "5:20 PM", "wk": 1}, {"kind": "blog", "url": "https://www.searchenginejournal.com/why-building-trust-through-real-people-stands-the-test-of-time-in-seo-ai-search/598110/", "name": "Search Engine Journal", "sub": "searchenginejournal.com", "title": "Why Building Trust Through Real People Stands The Test Of Time In SEO & AI Search", "logo": "https://www.google.com/s2/favicons?domain=searchenginejournal.com&sz=128", "ts": "2026-11-20T20:00:34+00:00", "col": "b", "sum": "Lily Ray says real, named experts are the one SEO investment that lasted through every shortcut, from bought links to scaled AI listicles. In October 2026, Google added fake creator profiles with AI headshots or false credentials to its helpful content docs as a form of deception. Put real authors with full profiles on client content.", "themes": ["creators", "debate"], "day": "Fri Nov 20", "time": "5:00 PM", "wk": 1}, {"kind": "blog", "url": "https://blog.google/products-and-platforms/products/search/connected-apps-holiday-errands/", "name": "Google", "sub": "blog.google", "title": "Get your year-end tasks done with new Connected Apps", "logo": "https://www.google.com/s2/favicons?domain=blog.google&sz=128", "ts": "2026-11-20T18:00:00+00:00", "col": "g", "sum": "Google is rolling out new Connected Apps in Search and the Gemini app in the US. Users can order groceries from Albertsons, Safeway and Target, check credit with Experian and estimate taxes with H&R Block without leaving Search. Angi and Thumbtack follow in the coming weeks, so watch this for home service clients.", "themes": ["aimode"], "day": "Fri Nov 20", "time": "3:00 PM", "wk": 1}, {"kind": "x", "url": "https://x.com/lilyraynyc/status/2123829633795686621", "name": "Lily Ray 😏", "sub": "lilyraynyc", "avatar": "https://pbs.twimg.com/profile_images/1935460090821189632/UvkORAsU_bigger.jpg", "text": "I've seen dozens of posts this week about how \"Google rankings and AI citations don't usually match up\" or \"there's a very low correlation between what ranks in Google and what appears in AI search\"...\n\n...and ZERO posts or articles pointing out that Google's AI Overviews", "img": null, "likes": 111, "replies": 52, "ts": "2026-11-20T17:23:38+00:00", "col": "s", "sum": "Lily Ray pushes back on the many posts that say Google rankings and AI citations do not match.", "themes": ["tracking", "debate"], "day": "Fri Nov 20", "time": "2:23 PM", "wk": 1}, {"kind": "blog", "url": "https://www.searchenginejournal.com/google-told-cmos-to-stop-top-10-listicles/598310/", "name": "Search Engine Journal", "sub": "searchenginejournal.com", "title": "Google Told CMOs To Stop ‘Top 10’ Listicles. Here’s Its Example", "logo": "https://www.google.com/s2/favicons?domain=searchenginejournal.com&sz=128", "ts": "2026-11-20T16:17:43+00:00", "col": "b", "sum": "Google's Think with Google account told CMOs: \"AI didn't make your brand invisible in Search. Your content did.\" The example it wants brands to stop is a generic \"Top 10 Things to Consider\" post, not every listicle. Check each planned tips post for first-hand knowledge before we write it.", "themes": ["debate"], "day": "Fri Nov 20", "time": "1:17 PM", "wk": 1}, {"kind": "li", "url": "https://www.linkedin.com/posts/austinhulak_okay-this-is-kind-of-wild-the-company-that-share-7529573063743705088-VsEI/", "name": "Austin Hulak", "sub": "aematic", "avatar": "https://media.licdn.com/dms/image/v2/C4D03AQHMKIFVQ1KX5g/profile-displayphoto-shrink_400_400/profile-displayphoto-shrink_400_400/0/1516864458898?e=2147483647&v=beta&t=67BnvG2e0O3hJp28h1feAYn_bc5Zte3W0q4Am3bj4ks", "text": "Okay this is kind of wild, the company that LITERALLY makes the answer engine is hiring someone to get found in answer engines. 🤯 OpenAI just opened a “Growth Marketing Manager, B2B SEO & AEO” role, paying $239k-$265k.\n\n3 things (a trend, a thought, a tip for finding these roles):\n\n1) Trend: AEO has is no longer just a buzzword. I’ve tracked 27 SEO roles with posted pay over the last two weeks, and 20 of them have AEO, GEO or AI in the title. It’s showing up at JPMorganChase, GEICO, Klaviyo, CARFAX and now OpenAI. Jobs with just plain old “SEO Manager” titles are going the way of the dodo.\n\n2) Thought: the most honest line in this JD is that you’ll “track visibility, citations, and referral quality while distinguishing observed results from hypotheses.” OpenAI built ChatGPT and even they describe AEO as experiment-driven. I would imagine you’d get to play some inside baseball within ChatGPT, but the other engines, like Claude, Gemini, or even Perplexity, are going to be a series of experiments.\n\n3) A tip: search for these titles on LinkedIn and set your Location to United States, so you catch roles open in multiple cities and remote roles that only show up under the company’s HQ city:\nAEO\nGEO\nAI search\nAI visibility\nAI discoverability\norganic growth\norganic search\n\nAnd if you apply to this one, lead with revenue and your experimental approach. Think about and be ready to speak on developing a content ROI model or how you would measure ROI against content creation or AEO work. The JD wants organic tied to “workspace creation, activation, paid conversion, and revenue,” not just rankings or traffic. Candidly I’m surprised the company that’s still figuring out attribution for their own paid product expects you to have it completely dialed for their onboarding and organic traffic. (Attribution for ChatGPT ads is a big part of what we do at aematic, so I say that with love.)\n\nI’m sharing roles like this as I find them. Follow along if you work in search.\n\nHere’s the role at OpenAI:", "img": null, "ts": "2026-11-20T15:55:11.099000+00:00", "col": "c", "sum": "OpenAI is hiring a Growth Marketing Manager for B2B SEO and AEO at $239k to $265k. Austin Hulak found AEO, GEO or AI in the titles of 20 of 27 recent SEO jobs.", "themes": ["debate"], "day": "Fri Nov 20", "time": "12:55 PM", "wk": 1}, {"kind": "li", "url": "https://www.linkedin.com/posts/darrenshawwhitespark_yelp-is-doing-something-super-smart-with-share-7529568216151642114-Yd4W/", "name": "Darren Shaw", "sub": "Founder, Whitespark", "avatar": "https://media.licdn.com/dms/image/v2/D5603AQGPRN78FYknrA/profile-displayphoto-shrink_400_400/profile-displayphoto-shrink_400_400/0/1685132735631?e=2147483647&v=beta&t=UqYA3gtwvph8Yb0r_rahU1g5IkXAz_R8M-wzWwu2sag", "text": "Yelp is doing something super smart with its title tags and you might want to do the same.\n \nBack in September, I noticed that Yelp's search result for Whitespark said “Updated September 2026”.\n \nI suspected they were automatically updating their business listing title tags every month.\n \nYep. Confirmed. I checked again today, and now it says “Updated November 2026”.\n \nSo, why do they do this?\n \nWell, if you're looking up a business, wouldn't you rather click a page that says “Updated November 2026” than one that looks like it hasn't been touched in years?\n \nAnd because this page looks like it was freshly updated, this will lead to more clicks on your page in the search results.\n \nAnd the more people who click on your page, the more it sends the signal to Google that this is a good result and keeps it ranking at the top.\n \nPretty smart!\n \nTry it on your pages and let me know if you see more clicks in Search Console. | 40 comments on LinkedIn", "img": "https://media.licdn.com/dms/image/v2/D5622AQEt9533eG_n_A/feedshare-shrink_800/B56aH5mYmPG0Ag-/0/1795188951728?e=2147483647&v=beta&t=AqXIHSPifdTNGRZjr7xHL_lEntzp6IbXaY3ihlzNQc8", "ts": "2026-11-20T15:35:55.343000+00:00", "col": "s", "sum": "Yelp updates its business page title tags every month to read 'Updated November 2026'. Darren Shaw suggests the same for location pages to earn more clicks.", "themes": ["local"], "day": "Fri Nov 20", "time": "12:35 PM", "wk": 1}, {"kind": "x", "url": "https://x.com/lilyraynyc/status/2123801792370643427", "name": "Lily Ray 😏", "sub": "lilyraynyc", "avatar": "https://pbs.twimg.com/profile_images/1935460090821189632/UvkORAsU_bigger.jpg", "text": "I hit the \"request indexing\" exactly once in GSC and instantly got this pop up. Have never even touched it ever before for this GSC property. What gives?\n\n@danielwaisberg @rajanpatel", "img": "https://pbs.twimg.com/media/HXlCVliXIAAXlZr.jpg", "likes": 67, "replies": 25, "ts": "2026-11-20T15:33:00+00:00", "col": "g", "sum": "Lily Ray got a warning pop-up in GSC after one Request Indexing click, on a property where she never used it before.", "themes": ["gsc"], "day": "Fri Nov 20", "time": "12:33 PM", "wk": 1}, {"kind": "x", "url": "https://x.com/nathangotch/status/2123791408746189077", "name": "Nathan Gotch", "sub": "nathangotch", "avatar": "https://pbs.twimg.com/profile_images/1690305084964384768/GRC-yHma_bigger.jpg", "text": "Let's break this down:\n\n\"AI didn't make your brand invisible in Search. Your content did.\"\n\n> AI overviews answer most queries and the SERPs are loaded with ads, features, and other variables that murd*r CTR. \n\nHere's a better version: \n\n\"Google made your brand invisible in", "img": null, "likes": 15, "replies": 9, "ts": "2026-11-20T14:51:44+00:00", "col": "s", "sum": "Google told brands that their content made them invisible, not AI. Nathan Gotch disagrees: AIOs, ads and SERP features cut the CTR.", "themes": ["debate"], "day": "Fri Nov 20", "time": "11:51 AM", "wk": 1}, {"kind": "x", "url": "https://x.com/Derek_Perkins/status/2123777724204433746", "name": "Derek Perkins", "sub": "Derek_Perkins", "avatar": "https://pbs.twimg.com/profile_images/3099337947/da62fb1abd976e1cd61582d81f9b9cd0_bigger.jpeg", "text": "As reported by @rustybrick and @SERPalerts a couple days ago, Google is testing a login wall on search.\n\nOn Nov 18, for about ten hours, our SERP collection fell by as much as 98%, across several providers simultaneously.\n\nGoogle is testing eliminating incognito searches", "img": "https://pbs.twimg.com/amplify_video_thumb/2123773494039339008/img/MgVb2zQhs58mFqde.jpg", "likes": 21, "replies": 3, "ts": "2026-11-20T13:57:21+00:00", "col": "g", "sum": "On Nov. 18, Nozzle's SERP data fell by up to 98% for about ten hours across several providers, while Google tested a login wall on search. Check Nov. 18 rank data before you blame the core update.", "themes": ["core"], "day": "Fri Nov 20", "time": "10:57 AM", "wk": 1}, {"kind": "x", "url": "https://x.com/glenngabe/status/2123776382916514247", "name": "Glenn Gabe", "sub": "glenngabe", "avatar": "https://pbs.twimg.com/profile_images/1939273879274287104/XDnMSJi5_bigger.jpg", "text": "And today's \"Core Update Notes\" wouldn't be complete without an example of \"Mt. AI\". Here's a site that surged recently and is dropping heavily with the broad core update. It scaled with commodity content, AI-generated content, etc.", "img": "https://pbs.twimg.com/media/HXkrOMBWYAA1Krp.png", "likes": 18, "replies": 9, "ts": "2026-11-20T13:52:02+00:00", "col": "g", "sum": "Glenn Gabe shows a site that scaled AI and commodity content, surged, and now drops hard in the core update.", "themes": ["core"], "day": "Fri Nov 20", "time": "10:52 AM", "wk": 1}, {"kind": "x", "url": "https://x.com/glenngabe/status/2123774779798732946", "name": "Glenn Gabe", "sub": "glenngabe", "avatar": "https://pbs.twimg.com/profile_images/1939273879274287104/XDnMSJi5_bigger.jpg", "text": "Good Morning Google Land! This is the 11/20 edition of \"Core Update Notes\". The core update continues to do its thing... and there have been some big surges and drops so far starting on 11/13-ish. \n\nAlthough it's been harder to track via the SEO visibility tools, GSC remains the", "img": "https://pbs.twimg.com/media/HXkpjBqWgAALe-C.png", "likes": 28, "replies": 13, "ts": "2026-11-20T13:45:39+00:00", "col": "g", "sum": "Glenn Gabe's Nov. 20 Core Update Notes: big surges and drops since about Nov. 13. SEO visibility tools struggle, so use GSC to judge the impact.", "themes": ["core"], "day": "Fri Nov 20", "time": "10:45 AM", "wk": 1}, {"kind": "blog", "url": "https://www.searchenginejournal.com/ai-citations-what-to-check-before-reacting-to-a-lost-one/598166/", "name": "Search Engine Journal", "sub": "searchenginejournal.com", "title": "AI Citations: What To Check Before Reacting To A Lost One", "logo": "https://www.google.com/s2/favicons?domain=searchenginejournal.com&sz=128", "ts": "2026-11-20T13:00:00+00:00", "col": "b", "sum": "Ahrefs tracked about 37,500 citations in AIOs, AI Mode, ChatGPT, Gemini and Copilot for 20 days. About three in four lost citations were temporary, and half came back within three days. Do not change a page for one lost citation. Review it if the citation is still gone after two or three weeks.", "themes": ["tracking"], "day": "Fri Nov 20", "time": "10:00 AM", "wk": 1}, {"kind": "x", "url": "https://x.com/glenngabe/status/2123761139989311521", "name": "Glenn Gabe", "sub": "glenngabe", "avatar": "https://pbs.twimg.com/profile_images/1939273879274287104/XDnMSJi5_bigger.jpg", "text": "Two slides from my SMX deck covering the listicle situation, scaled content abuse, and sites getting hammered:", "img": "https://pbs.twimg.com/media/HXkdZQzXAAAqXT_.jpg", "likes": 18, "replies": 1, "ts": "2026-11-20T12:51:28+00:00", "col": "g", "sum": "Glenn Gabe's SMX slides cover listicles, scaled content abuse and the sites Google hits hardest.", "themes": ["core"], "day": "Fri Nov 20", "time": "9:51 AM", "wk": 1}, {"kind": "x", "url": "https://x.com/rustybrick/status/2123761102664163673", "name": "Barry Schwartz", "sub": "rustybrick", "avatar": "https://pbs.twimg.com/profile_images/1433030583144390668/FKJ9JkUA_bigger.jpg", "text": "Google AI Overviews, ChatGPT AI answers and other AI engines are providing coupon codes from retailers, forget the coupon/promo code websites - via @glenngabe and @metehan777\n\nseroundtable.com/google-chatgpt…", "img": null, "likes": 16, "replies": 14, "ts": "2026-11-20T12:51:19+00:00", "col": "g", "sum": "AIOs, ChatGPT and other AI engines now show coupon codes from retailers. Coupon sites can lose these clicks.", "themes": ["ads"], "day": "Fri Nov 20", "time": "9:51 AM", "wk": 1}, {"kind": "x", "url": "https://x.com/rustybrick/status/2123753550136127526", "name": "Barry Schwartz", "sub": "rustybrick", "avatar": "https://pbs.twimg.com/profile_images/1433030583144390668/FKJ9JkUA_bigger.jpg", "text": "Bing and Microsoft ads with \"Made with AI\" label\n\nseroundtable.com/bing-ads-made-…", "img": null, "likes": 16, "replies": 6, "ts": "2026-11-20T12:21:18+00:00", "col": "t", "sum": "Bing and Microsoft ads now carry a 'Made with AI' label.", "themes": ["ads"], "day": "Fri Nov 20", "time": "9:21 AM", "wk": 1}, {"kind": "li", "url": "https://www.linkedin.com/posts/nathangotch_were-living-in-a-world-where-companies-are-share-7529309189127659520-8rO1/", "name": "Nathan Gotch", "sub": "Co-Founder and CEO, Rankability", "avatar": "https://media.licdn.com/dms/image/v2/C5603AQHOxXdAAX6RQw/profile-displayphoto-shrink_400_400/profile-displayphoto-shrink_400_400/0/1651848439583?e=2147483647&v=beta&t=F9znwDX1y5OaPu-Z9ikRc1sedCVm4Ib_K3R9TNOHuEU", "text": "We're living in a world where companies are hiring SEO and AEO companies to work on the same brand at the same time 🤯", "img": null, "ts": "2026-11-19T22:26:38.488000+00:00", "col": "s", "sum": "Nathan Gotch sees companies hire an SEO agency and a separate AEO agency to work on the same brand at the same time.", "themes": ["debate"], "day": "Thu Nov 19", "time": "7:26 PM", "wk": 1}, {"kind": "li", "url": "https://www.linkedin.com/posts/chris-long-marketing_huge-seo-news-google-is-rolling-out-a-collapsable-ugcPost-7529288158820286464-gme7/", "name": "Chris Long", "sub": "Co-founder, Nectiv", "avatar": "https://media.licdn.com/dms/image/v2/D4E03AQEf7iyuuMOsyQ/profile-displayphoto-shrink_400_400/profile-displayphoto-shrink_400_400/0/1696859606064?e=2147483647&v=beta&t=aXra4UyUJSs6shwTwE7K4nEnsm7T2lck5omg5hAy4FE", "text": "Huge SEO News: Google is rolling out a collapsable sidebar with AI Mode conversations in the MAIN SEARCH RESULTS!!! AI Mode is becoming the default search experience | 11 comments on LinkedIn", "img": null, "ts": "2026-11-19T21:03:04.472000+00:00", "col": "g", "sum": "Google is rolling out a collapsible sidebar that keeps AI Mode conversations inside the main search results. Chris Long says AI Mode is becoming the default search experience.", "themes": ["aimode"], "day": "Thu Nov 19", "time": "6:03 PM", "wk": 1}, {"kind": "x", "url": "https://x.com/Marie_Haynes/status/2123514082225688705", "name": "Marie Haynes", "sub": "Marie_Haynes", "avatar": "https://pbs.twimg.com/profile_images/1957228632415297537/fl2YY2tU_bigger.jpg", "text": "Google built a synthetic version of the web for testing agents. They call it a \"mirror dimension.\"\n\n\"This controlled testing ground lets engineers evaluate auto browse in realistic online environments, featuring thousands of simulated websites inspired by everyday user journeys,", "img": null, "likes": 13, "replies": 9, "ts": "2026-11-19T20:29:44+00:00", "col": "g", "sum": "Google built a 'mirror dimension', a test web with thousands of simulated sites, to test its auto browse agent.", "themes": ["agents"], "day": "Thu Nov 19", "time": "5:29 PM", "wk": 1}, {"kind": "x", "url": "https://x.com/glenngabe/status/2123487206253711618", "name": "Glenn Gabe", "sub": "glenngabe", "avatar": "https://pbs.twimg.com/profile_images/1939273879274287104/XDnMSJi5_bigger.jpg", "text": "I shared this morning about AIOs triggering for 'coupon code' queries, which is tough, but now @metehan777 just published a post about ChatGPT (and it's worse...) \n\nChatGPT can publish coupon code cards directly in the answer with \"copy code\" buttons. That basically cuts out the", "img": "https://pbs.twimg.com/media/HXgj9e1XQAAk9Mj.jpg", "likes": 17, "replies": 20, "ts": "2026-11-19T18:42:57+00:00", "col": "c", "sum": "ChatGPT can show coupon code cards with a 'copy code' button right in the answer. That cuts out coupon sites.", "themes": ["ads"], "day": "Thu Nov 19", "time": "3:42 PM", "wk": 1}, {"kind": "blog", "url": "https://www.searchenginejournal.com/googles-next-update-wont-touch-the-index-and-nobody-will-announce-it/597481/", "name": "Search Engine Journal", "sub": "searchenginejournal.com", "title": "Google's Next Update Won't Touch The Index, And Nobody Will Announce It", "logo": "https://www.google.com/s2/favicons?domain=searchenginejournal.com&sz=128", "ts": "2026-11-19T18:00:31+00:00", "col": "b", "sum": "Duane Forrester reads new Google Research work as a sign that model knowledge may update on a hidden schedule. He suggests you check what AI assistants say about a brand on a fixed schedule and track which facts change.", "themes": ["tracking"], "day": "Thu Nov 19", "time": "3:00 PM", "wk": 1}, {"kind": "li", "url": "https://www.linkedin.com/posts/johnshehata_an-open-letter-to-every-ai-visibility-company-ugcPost-7529235246039425026-ZVQh/", "name": "John Shehata", "sub": "News SEO Digest", "avatar": "https://media.licdn.com/dms/image/v2/C4E03AQGVpp2x64q3FQ/profile-displayphoto-shrink_400_400-alternative/profile-displayphoto-shrink_400_400-alternative/0/1528763278402?e=2147483647&v=beta&t=R3I3LPpwjJMyuAtbdlOcFpBuIdkk2AE0aSWtL-ZvXec", "text": "An open letter to every AI visibility company selling its product through misconceptions, fear, and “SEO is dead” campaigns. | 20 comments on LinkedIn", "img": null, "ts": "2026-11-19T17:32:49.082000+00:00", "col": "s", "sum": "John Shehata answers AI visibility vendors who sell with fear and \"SEO is dead\" claims. His News SEO Digest article uses data to show that the claim \"customers are not searching anymore\" is false. Lily Ray joined the discussion.", "themes": ["debate"], "day": "Thu Nov 19", "time": "2:32 PM", "wk": 1}, {"kind": "x", "url": "https://x.com/Techmeme/status/2123459667917758649", "name": "Techmeme", "sub": "Techmeme", "avatar": "https://pbs.twimg.com/profile_images/1191943129823399936/ZvfTRAlg_bigger.jpg", "text": "Anthropic makes its Nasdaq debut at $111.50 per share after pricing at $83 each, giving it a ~$2T market cap, in a historic moment for the AI industry (CNBC)\n\n(Visit Techmeme dot com for the link and full context!)", "img": null, "likes": 6, "replies": 0, "ts": "2026-11-19T16:53:31+00:00", "col": "t", "sum": "Anthropic opened on the Nasdaq at $111.50 a share after it priced at $83, for a market cap of about $2T.", "themes": [], "day": "Thu Nov 19", "time": "1:53 PM", "wk": 1}, {"kind": "li", "url": "https://www.linkedin.com/posts/anastasia-kotsiubynska_my-favorite-actionable-data-source-for-share-7529218219912441857-cBT1/", "name": "Anastasia Kotsiubynska", "sub": "SEO, SE Ranking", "avatar": "https://media.licdn.com/dms/image/v2/C5603AQGsHsB3XlLOCg/profile-displayphoto-shrink_400_400/profile-displayphoto-shrink_400_400/0/1523438221341?e=2147483647&v=beta&t=Iqt9tSyERWz5EKYrjGpgwM9aw-iisOgNL5s3FzJJQMM", "text": "My favorite (actionable) data source for a GEO content plan is the citations list for the prompts we track.\n\n ✅ Cited domains show which websites & platforms dominate for each AI engine (I usually focus on AI Overviews and ChatGPT).\n ✅ Cited URLs show you the exact topics and content formats that get picked up.\n\n👉 From there, you can see how much coverage each topic and content format has, so you know what to prioritize:\n\n 1️⃣ What new pieces to create or what to update/optimize on your own website\n 2️⃣  Which offsite actions to take (the most important part for AI search)\n\nFor our own website(s), I still build every content plan on a healthy SEO foundation: business relevance, search demand data, and SERP-based clustering.\n\n❗ If you only follow AI source data with your own website, you can put your Google performance at risk because of cannibalization.\n\nThis trap is common on product websites, where two types of pages can cover the same top feature query: a feature landing page and a listicle of top tools (e.g., an \"AI video generator\" landing page vs. a \"best AI video generators\" listicle). \n\n 👉 AI search usually benefits from having both pages, since LLMs get more sources to pull from. In Google, though, the two pages will likely compete for the same queries, so SERP & your historical performance data should decide which one you build.\n\n🟢 And the most fundamental source for any organic content plan: your customer data. AI search is still a black box when it comes to what users actually ask, so lean heavily on call recordings, input from your customer-facing teams and discussions on UGC platforms like Reddit. It works for SEO and GEO, and it also works for your users and your business.", "img": "https://media.licdn.com/dms/image/v2/D5622AQEEiIgKXEDWvg/feedshare-shrink_800/B56aH0oEZVIsAg-/0/1795105507975?e=2147483647&v=beta&t=IGY7cEEZsx4u9g2nZJuQ8XK5F9R3jNUzn4przx6M6lg", "ts": "2026-11-19T16:25:09.737000+00:00", "col": "s", "sum": "Anastasia Kotsiubynska builds GEO content plans from the cited domains and cited URLs of tracked prompts. She warns that AI source data alone can cause cannibalization and hurt Google performance.", "themes": ["tracking"], "day": "Thu Nov 19", "time": "1:25 PM", "wk": 1}, {"kind": "li", "url": "https://www.linkedin.com/posts/joshua-blyskal_im-open-sourcing-a-bit-of-profounds-data-share-7529212470125613056-_3Zj/", "name": "Josh Blyskal", "sub": "Head of Insights, Profound", "avatar": "https://media.licdn.com/dms/image/v2/D4E03AQGqCGmYvlT-ww/profile-displayphoto-scale_400_400/B4EaGCoVZeKUAg-/0/1793192974805?e=2147483647&v=beta&t=SQr-Arzq8cACZ9aUHWJ8NGd-J8NiUFzEkikxKDgfFFY", "text": "I'm open-sourcing a bit of Profound's data. You ever see all these headlines and charts about global citation share shifts
