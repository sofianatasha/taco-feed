<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Taco Feed</title>
<style>
:root{--bg:#f4f6f8;--col:#fff;--card:#fff;--line:#e3e7ec;--ink:#0f1419;--muted:#536471;--chip:#eef2f6;--chipOn:#0f1419;--chipOnInk:#fff;--accent:#1d9bf0;--sum:#f2f7fd;--sumInk:#1c3d5a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b0f14;--col:#121821;--card:#161d27;--line:#26313f;--ink:#e7edf3;--muted:#8b98a5;--chip:#1e2834;--chipOn:#e7edf3;--chipOnInk:#0b0f14;--accent:#4cb3ff;--sum:#16263a;--sumInk:#cfe3f7}}
:root[data-theme="dark"]{--bg:#0b0f14;--col:#121821;--card:#161d27;--line:#26313f;--ink:#e7edf3;--muted:#8b98a5;--chip:#1e2834;--chipOn:#e7edf3;--chipOnInk:#0b0f14;--accent:#4cb3ff;--sum:#16263a;--sumInk:#cfe3f7}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button{font:inherit;color:inherit}
.top{padding:14px 16px 12px;border-bottom:1px solid var(--line);background:var(--col)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.brand{font-weight:800;font-size:16px;margin-right:8px}
.stamp{font-weight:400;font-size:11.5px;color:var(--muted);margin-left:4px}
.themes{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.theme{border:1px solid transparent;background:var(--chip);border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.theme .c{opacity:.6;font-variant-numeric:tabular-nums}
.theme:hover{border-color:var(--line)}
.theme.on{background:var(--chipOn);color:var(--chipOnInk)}
.filters{display:flex;gap:4px}
.filters button{border:1px solid var(--line);background:var(--col);border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer}
.filters button.on{background:var(--chipOn);color:var(--chipOnInk);border-color:var(--chipOn)}
.overview{margin-top:10px;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:8px 10px 12px 14px;background:var(--card)}
.overview.folded{padding-bottom:8px}
.overview.folded ol{display:none}
.ovh{display:flex;align-items:flex-start;gap:8px}
.ovt{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;flex:1;min-width:0;min-height:30px}
.ovh h3{margin:0;font-size:15px}
.ovh .c{color:var(--muted);font-size:12.5px;font-weight:400;font-variant-numeric:tabular-nums;margin-left:2px}
.crumb{border:0;background:none;padding:0;color:var(--accent);font-weight:600;font-size:13.5px;cursor:pointer}
.crumb:hover{text-decoration:underline}
.sep{color:var(--muted)}
.fold,.clr{border:1px solid transparent;background:none;border-radius:8px;width:30px;height:30px;display:grid;place-items:center;cursor:pointer;color:var(--muted);padding:0;flex:none}
.fold:hover,.clr:hover{border-color:var(--line);color:var(--ink)}
.fold svg{transition:transform .15s}
.folded .fold svg{transform:rotate(180deg)}
.clr{font-size:20px;line-height:1}
.overview ol{margin:6px 0 0;padding-left:22px}
.overview li{margin:3px 0}
.brief{max-width:980px}
.brief li:last-child{font-weight:600}
.take{max-width:1500px}
.take li{margin:5px 0;break-inside:avoid}
.take li::marker{color:var(--muted);font-weight:700}
@media (min-width:1100px){.take{columns:2;column-gap:36px}}
.tag{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:1px 9px;font-size:12px;line-height:1.5;cursor:pointer;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:1px}
.tag:hover{border-color:var(--muted)}
.tag.on{background:var(--chipOn);color:var(--chipOnInk);border-color:var(--chipOn)}
.take .tag{margin-left:4px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 6px}
.deck{display:flex;gap:12px;padding:12px 16px 16px;overflow-x:auto;height:calc(100vh - 150px);min-height:560px}
.col{flex:0 0 360px;background:var(--col);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.colhead{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;border-top:4px solid var(--c);border-radius:14px 14px 0 0}
.colhead h2{font-size:15px;margin:0;flex:1}
.colhead .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.feed{overflow-y:auto;min-height:0;flex:1}
.wk{position:sticky;top:0;z-index:2;display:flex;align-items:baseline;gap:8px;padding:9px 14px 7px;background:var(--col);border-bottom:1px solid var(--line);font-weight:700;font-size:12.5px}
.wkr{color:var(--muted);font-weight:400}
.day{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 14px 4px}
.empty{color:var(--muted);font-size:13px;padding:18px 14px}
.deckempty{color:var(--muted);font-size:13px;padding:24px 4px}
.card{padding:12px 14px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:40px 1fr;gap:10px}
.card:hover{background:color-mix(in srgb,var(--chip) 45%,transparent)}
.av{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--chip)}
.av.sq{border-radius:10px}
.avf{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700}
.card>div{min-width:0;overflow-wrap:anywhere}
.hd{display:flex;gap:4px;align-items:baseline;flex-wrap:wrap;min-width:0}
.nm{font-weight:700}
.mt{color:var(--muted);font-size:13px}
.badge{margin-left:auto;font-size:11px;font-weight:700;color:var(--muted)}
.sum{background:var(--sum);color:var(--sumInk);border-radius:8px;padding:6px 9px;margin:6px 0;font-size:13px}
.ttl{font-weight:700;margin:4px 0 2px}
.tx{white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.tx.clamp{display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}
.src-blog .tx{margin-bottom:6px}
.more{border:0;background:none;color:var(--accent);padding:0;cursor:pointer;font-size:13px}
.img{display:block;width:100%;max-height:230px;object-fit:cover;border-radius:14px;border:1px solid var(--line);margin-top:8px}
.ft{display:flex;gap:16px;margin-top:8px;color:var(--muted);font-size:12.5px;align-items:center}
.ft a{color:var(--accent);text-decoration:none;margin-left:auto}
.hide{display:none!important}
@media (max-width:1100px){.brand{flex-basis:100%}.themes{order:3;flex-basis:100%}}
@media (max-width:700px){
  .top{padding:12px 12px 10px}
  .deck{height:auto!important;min-height:0;flex-direction:column;overflow-x:visible;padding:10px 12px 14px}
  .col{flex:none;min-width:0}
  .feed{max-height:70vh}
  .themes{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .themes::-webkit-scrollbar{display:none}
  .theme{flex:none}
  .theme,.filters button,.crumb,.take .tag{min-height:36px}
  .tags .tag{min-height:34px;padding:4px 12px}
  .fold,.clr{width:36px;height:36px}
  .ovt{min-height:36px}
  .more{min-height:32px}
}
</style>
</head>
<body>
<div class="top" id="top">
  <div class="row">
    <span class="brand">Taco Feed <span class="stamp">updated {{REFRESH}}</span></span>
    <div class="themes" id="themes"></div>
    <div class="filters" id="filters">
      <button data-f="x" aria-pressed="false">X</button><button data-f="li" aria-pressed="false">LinkedIn</button><button data-f="blog" aria-pressed="false">Blogs</button>
    </div>
  </div>
  <section class="overview hide" id="overview"></section>
</div>
<div class="deck" id="deck"></div>
<script>
/*DATA*/
const PAL=["#1d9bf0","#f91880","#00ba7c","#7856ff","#ff7a00","#e0245e","#0a66c2","#17bf63"];
const hue=s=>PAL[[...s].reduce((a,c)=>a+c.charCodeAt(0),0)%PAL.length];
const ini=s=>s.split(/\s+/).filter(w=>/[A-Za-z]/.test(w[0]||"")).map(w=>w[0]).join("").slice(0,2).toUpperCase();
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>n>=1000?(n/1000).toFixed(n>=10000?0:1)+"K":String(n);
const TM=Object.fromEntries(THEMES.map(t=>[t.id,t]));
const WK=Object.fromEntries(WEEKS.map(w=>[w.i,w]));
const CHEV='<svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M5 12.5l5-5 5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const KEY="tacoFeed.folded";
let pref=false;
try{pref=localStorage.getItem(KEY)==="1";}catch(e){}
const state={theme:null,src:null,folded:pref};
function tag(id,label){return `<button class="tag" data-theme="${esc(id)}" aria-pressed="false">${esc(label)}</button>`;}
function avatar(p){
  const src=p.kind==="blog"?p.logo:p.avatar;
  const sq=p.kind==="blog"?" sq":"";
  if(!src) return `<div class="avf" style="background:${hue(p.name)}">${ini(p.name)}</div>`;
  return `<img class="av${sq}" src="${esc(src)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML='<div class=&quot;avf&quot; style=&quot;background:${hue(p.name)}&quot;>${ini(p.name)}</div>'">`;
}
function card(p,i){
  const meta=p.kind==="x"?"@"+p.sub:p.sub;
  const badge=p.kind==="x"?"𝕏":p.kind==="li"?"LinkedIn":"Blog";
  const long=(p.text||"").length>320;
  const tags=p.themes.length?`<div class="tags">${p.themes.filter(id=>TM[id]).map(id=>tag(id,TM[id].label)).join("")}</div>`:"";
  let body="";
  if(p.kind==="blog") body=`<div class="ttl">${esc(p.title)}</div><div class="tx">${esc(p.sum)}</div>${tags}`;
  else body=`<div class="sum">${esc(p.sum)}</div>${tags}<div class="tx${long?" clamp":""}" id="t${i}">${esc(p.text)}</div>${long?`<button class="more" data-t="t${i}">Show more</button>`:""}`;
  const img=p.img?`<img class="img" src="${esc(p.img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:"";
  const stats=p.kind==="x"?`<span>♡ ${fmt(p.likes||0)}</span><span>💬 ${fmt(p.replies||0)}</span>`:"";
  const link=p.kind==="x"?"View on X":p.kind==="li"?"View on LinkedIn":"Read article";
  return `<article class="card src-${p.kind}" data-src="${p.kind}" data-themes="${esc(p.themes.join(" "))}">${avatar(p)}<div style="min-width:0">
    <div class="hd"><span class="nm">${esc(p.name)}</span><span class="mt">${meta&&meta!=="@"?esc(meta)+" · ":""}${p.time}</span><span class="badge">${badge}</span></div>
    ${body}${img}<div class="ft">${stats}<a href="${esc(p.url)}" target="_blank" rel="noopener">${link} ↗</a></div></div></article>`;
}
const topBar=document.getElementById("top");
const deck=document.getElementById("deck");
let idx=0;
COLS.forEach(c=>{
  const items=P.filter(p=>p.col===c.id);
  const sec=document.createElement("section"); sec.className="col"; sec.dataset.col=c.id;
  let h=`<div class="colhead" style="--c:${c.color}"><h2>${esc(c.title)}</h2><span class="n"></span></div><div class="feed">`;
  let wk=null, day="";
  items.forEach(p=>{
    if(p.wk!==wk){
      if(wk!==null) h+="</div>";
      wk=p.wk; day="";
      const w=WK[wk]||{label:"",range:""};
      h+=`<div class="wkg" data-wk="${wk}"><div class="wk"><span>${esc(w.label)}</span><span class="wkr">${esc(w.range)}</span></div>`;
    }
    if(p.day!==day){day=p.day; h+=`<div class="day">${esc(p.day)}</div>`;}
    h+=card(p,idx++);
  });
  if(wk!==null) h+="</div>";
  sec.innerHTML=h+`<div class="empty hide">No posts</div></div>`;
  deck.appendChild(sec);
});
const deckEmpty=document.createElement("div"); deckEmpty.className="deckempty hide"; deckEmpty.textContent="No posts"; deck.appendChild(deckEmpty);
document.getElementById("themes").innerHTML=THEMES.filter(t=>!t.archived).map(t=>`<button class="theme" data-theme="${esc(t.id)}" aria-pressed="false">${esc(t.label)} <span class="c">${t.n}</span></button>`).join("");
const ov=document.getElementById("overview");
function slot(){
  const t=state.theme?TM[state.theme]:null;
  if(!t&&!TAKE.length){ov.classList.add("hide"); ov.innerHTML=""; return;}
  ov.classList.remove("hide");
  ov.classList.toggle("folded",state.folded);
  const fold=`<button class="fold" aria-expanded="${!state.folded}" aria-label="${state.folded?"Expand":"Collapse"}" title="${state.folded?"Expand":"Collapse"}">${CHEV}</button>`;
  if(t){
    const back=TAKE.length?`<button class="crumb" data-back>Key takeaways</button><span class="sep" aria-hidden="true">›</span>`:"";
    const clear=TAKE.length?"":`<button class="clr" data-back title="Clear" aria-label="Clear">×</button>`;
    ov.innerHTML=`<div class="ovh"><div class="ovt">${back}<h3>${esc(t.label)} <span class="c">${t.n}</span></h3></div>${clear}${fold}</div><ol class="brief">${(t.lines||[]).map(l=>`<li>${esc(l)}</li>`).join("")}</ol>`;
  }else{
    ov.innerHTML=`<div class="ovh"><div class="ovt"><h3>Key takeaways</h3></div>${fold}</div><ol class="take">${TAKE.map(k=>{const th=k.theme&&TM[k.theme]; return `<li>${esc(k.text)}${th?" "+tag(th.id,th.label+" · "+th.n):""}</li>`;}).join("")}</ol>`;
  }
}
const mq=window.matchMedia("(max-width:700px)");
function fit(){
  if(mq.matches){deck.style.height=""; return;}
  deck.style.height=Math.max(560,window.innerHeight-topBar.offsetHeight)+"px";
}
function apply(){
  const refocus=document.activeElement&&document.activeElement.classList.contains("fold");
  slot();
  if(refocus){const f=ov.querySelector(".fold"); if(f) f.focus();}
  document.querySelectorAll("[data-theme]").forEach(b=>{const on=b.dataset.theme===state.theme; b.classList.toggle("on",on); b.setAttribute("aria-pressed",on?"true":"false");});
  document.querySelectorAll("#filters button").forEach(b=>{const on=b.dataset.f===state.src; b.classList.toggle("on",on); b.setAttribute("aria-pressed",on?"true":"false");});
  const filtered=!!(state.theme||state.src);
  let open=0;
  document.querySelectorAll(".col").forEach(col=>{
    let shown=0;
    col.querySelectorAll(".card").forEach(c=>{
      const ok=(!state.src||c.dataset.src===state.src)&&(!state.theme||c.dataset.themes.split(" ").includes(state.theme));
      c.classList.toggle("hide",!ok); if(ok) shown++;
    });
    col.querySelectorAll(".day").forEach(d=>{
      let n=d.nextElementSibling, any=false;
      while(n&&!n.classList.contains("day")){ if(n.classList.contains("card")&&!n.classList.contains("hide")){any=true; break;} n=n.nextElementSibling; }
      d.classList.toggle("hide",!any);
    });
    col.querySelectorAll(".wkg").forEach(g=>g.classList.toggle("hide",!g.querySelector(".card:not(.hide)")));
    col.querySelector(".n").textContent=shown;
    col.querySelector(".empty").classList.toggle("hide",shown>0);
    col.classList.toggle("hide",filtered&&shown===0);
    if(!col.classList.contains("hide")) open++;
  });
  deckEmpty.classList.toggle("hide",open>0);
  fit();
}
function reset(){document.querySelectorAll(".feed").forEach(f=>{f.scrollTop=0;}); deck.scrollLeft=0;}
function clearTopic(){state.theme=null; state.folded=pref; reset(); apply();}
document.addEventListener("click",e=>{
  const tb=e.target.closest("[data-theme]");
  if(tb){
    const fromCard=!!tb.closest(".card");
    if(state.theme===tb.dataset.theme){clearTopic(); return;}
    state.theme=tb.dataset.theme; state.folded=false; reset(); apply();
    if(fromCard) window.scrollTo({top:0,behavior:"smooth"});
    return;
  }
  if(e.target.closest("[data-back]")){clearTopic(); return;}
  if(e.target.closest(".fold")){
    state.folded=!state.folded; pref=state.folded;
    try{localStorage.setItem(KEY,pref?"1":"0");}catch(err){}
    apply(); return;
  }
  const fb=e.target.closest("#filters button");
  if(fb){state.src=state.src===fb.dataset.f?null:fb.dataset.f; reset(); apply(); return;}
  const mb=e.target.closest(".more");
  if(mb){const t=document.getElementById(mb.dataset.t); const closed=t.classList.toggle("clamp"); mb.textContent=closed?"Show more":"Show less";}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&state.theme) clearTopic();});
window.addEventListener("resize",fit);
apply();
</script>
</body>
</html>
